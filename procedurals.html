<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Cinematic Triangle Visualizer</title>

<style>

body{
margin:0;
background:#0c0802;
font-family:monospace;
overflow:hidden;
}

#panel{
position:fixed;
top:10px;
left:10px;
background:rgba(255,255,255,0.9);
padding:12px;
border-radius:8px;
font-size:12px;
}

canvas{
display:block;
}

</style>

</head>

<body>

<div id="panel">

<input type="file" id="audioFile" accept=".wav"><br><br>

Duration: <span id="duration">0</span><br>
Time: <span id="time">0</span><br><br>

Structure <input type="range" id="structure" min="50" max="600" value="200"><br>

Motion <input type="range" id="motion" min="0.1" max="2" step="0.1" value="0.6"><br>

Color <input type="color" id="color" value="#ff4466"><br><br>

<button id="play">Start</button>

</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas")
const ctx = canvas.getContext("2d")

canvas.width = window.innerWidth
canvas.height = window.innerHeight

let audioCtx
let analyser
let dataArray
let source
let audio
let duration=0

let triangles=[]

let camera={
x:0,
y:0,
zoom:1
}

function rand(a,b){return a+Math.random()*(b-a)}

class Triangle{

constructor(x,y,angle,size){

this.x=x
this.y=y
this.angle=angle
this.size=size

this.vx=Math.cos(angle)
this.vy=Math.sin(angle)

this.life=rand(400,1200)

}

update(volume,phase){

const motion=document.getElementById("motion").value

this.x+=this.vx*motion*(0.2+volume)
this.y+=this.vy*motion*(0.2+volume)

this.angle+=rand(-0.02,0.02)

if(Math.random()<phase.branch){

triangles.push(
new Triangle(
this.x,
this.y,
this.angle+rand(-1,1),
this.size*rand(0.8,1.1)
)
)

}

this.life--

}

draw(volume,progress){

let base=document.getElementById("color").value

let r=parseInt(base.substr(1,2),16)
let g=parseInt(base.substr(3,2),16)
let b=parseInt(base.substr(5,2),16)

let drift=progress*140

r=Math.min(255,r+drift+volume*80)
g=Math.min(255,g+drift*0.6+volume*60)
b=Math.min(255,b+volume*50)

ctx.fillStyle=`rgb(${r},${g},${b})`

ctx.beginPath()

ctx.moveTo(
this.x+Math.cos(this.angle)*this.size,
this.y+Math.sin(this.angle)*this.size
)

ctx.lineTo(
this.x+Math.cos(this.angle+2.1)*this.size,
this.y+Math.sin(this.angle+2.1)*this.size
)

ctx.lineTo(
this.x+Math.cos(this.angle+4.2)*this.size,
this.y+Math.sin(this.angle+4.2)*this.size
)

ctx.closePath()
ctx.fill()

}

}

function getVolume(){

analyser.getByteFrequencyData(dataArray)

let sum=0

for(let i=0;i<dataArray.length;i++)
sum+=dataArray[i]

return sum/dataArray.length/255

}

function phase(progress){

if(progress<0.25){
return{branch:0.002,spawn:1,zoom:0.6}
}

if(progress<0.5){
return{branch:0.006,spawn:2,zoom:0.8}
}

if(progress<0.8){
return{branch:0.01,spawn:3,zoom:1}
}

return{branch:0.02,spawn:4,zoom:1.2}

}

function spawn(volume,progress){

let p=phase(progress)

let limit=document.getElementById("structure").value

for(let i=0;i<p.spawn;i++){

if(triangles.length<limit){

triangles.push(

new Triangle(
canvas.width/2+rand(-100,100),
canvas.height/2+rand(-100,100),
Math.random()*Math.PI*2,
rand(2,6)
)

)

}

}

}

function updateCamera(progress){

camera.zoom=0.6+progress*0.6

camera.x=Math.sin(progress*4)*150
camera.y=Math.cos(progress*3)*120

}

function animate(){

requestAnimationFrame(animate)

let volume=getVolume()

let progress=audio.currentTime/duration

document.getElementById("time").innerText=audio.currentTime.toFixed(1)

let p=phase(progress)

updateCamera(progress)

ctx.fillStyle="rgba(245,245,245,0.05)"
ctx.fillRect(0,0,canvas.width,canvas.height)

ctx.save()

ctx.translate(canvas.width/2,canvas.height/2)
ctx.scale(camera.zoom,camera.zoom)
ctx.translate(-canvas.width/2+camera.x,-canvas.height/2+camera.y)

spawn(volume,progress)

for(let t of triangles){

t.update(volume,p)
t.draw(volume,progress)

}

ctx.restore()

triangles=triangles.filter(t=>t.life>0)

}

document.getElementById("play").onclick=async()=>{

audioCtx=new AudioContext()

analyser=audioCtx.createAnalyser()
analyser.fftSize=512

dataArray=new Uint8Array(analyser.frequencyBinCount)

let file=document.getElementById("audioFile").files[0]

audio=new Audio(URL.createObjectURL(file))

audio.onloadedmetadata=()=>{

duration=audio.duration
document.getElementById("duration").innerText=duration.toFixed(1)

}

source=audioCtx.createMediaElementSource(audio)

source.connect(analyser)
analyser.connect(audioCtx.destination)

audio.play()

animate()

}

</script>

</body>
</html>
