<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>professionaldex</title>
<meta name="description" content="A Kindle-paper national Pokédex: typing, matchups, every learnable move and game location, and a versus mode.">
<!-- iOS home-app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="professionaldex">
<meta name="theme-color" content="#e9e5db">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --paper:#e9e5db; --paper-2:#f0ece2; --card:#ece8de;
    --ink:#23201a; --ink-2:#4e4a40; --faint:#8a8477; --line:#cdc7b8; --line-2:#dcd6c8;
    --accent:#6a4a39;           /* faint oxide */
    --good:#4a6b4e; --bad:#8a4034;  /* resist / weak, muted */
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --mono:"Cascadia Mono",ui-monospace,"Consolas",monospace;
    /* muted type stamps */
    --t-normal:#8b8378; --t-fire:#b2593c; --t-water:#4f7fa8; --t-electric:#b0952f;
    --t-grass:#5e8a53; --t-ice:#6aa0a6; --t-fighting:#9c4b3f; --t-poison:#7d5287;
    --t-ground:#a9884f; --t-flying:#7f8fb0; --t-psychic:#b05f7e; --t-bug:#828d3b;
    --t-rock:#8c7e5c; --t-ghost:#5f5a86; --t-dragon:#5a63a0; --t-dark:#574f47;
    --t-steel:#7c838d; --t-fairy:#b07f9a;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--paper); color:var(--ink);
    font-family:var(--serif); -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  body{ overscroll-behavior-y:none; overflow-x:hidden; }
  a{ color:inherit; }
  .mono{ font-family:var(--mono); }

  /* ---------------- top bar ---------------- */
  #bar{ position:sticky; top:0; z-index:30; background:linear-gradient(var(--paper),rgba(233,229,219,.96));
    padding:calc(env(safe-area-inset-top) + 10px) 14px 8px; border-bottom:1px solid var(--line);
    backdrop-filter:saturate(1) blur(2px); }
  #bar .top{ display:flex; align-items:baseline; gap:10px; min-width:0; }
  #bar .brand{ font-size:20px; letter-spacing:.005em; font-weight:600; flex:none; }
  #bar .sub{ font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--faint);
    flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #bar .sp{ flex:1 1 0; min-width:0; }
  #bar .pill{ flex:none; }
  @media (max-width:390px){ #bar .sub{ display:none; } }
  #backBtn{ display:none; font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ink-2); background:none; border:0; padding:4px 6px 4px 0; cursor:pointer; }
  #backBtn::before{ content:"‹ "; }
  .toolRow{ display:flex; gap:8px; margin-top:9px; align-items:center; }
  #search{ flex:1 1 auto; min-width:0; font-family:var(--mono); font-size:13px; color:var(--ink); background:var(--paper-2);
    border:1px solid var(--line); border-radius:9px; padding:9px 11px; outline:none; }
  #search::placeholder{ color:var(--faint); letter-spacing:.04em; }
  .gamesel{ flex:none; max-width:47%; font-family:var(--mono); font-size:11px; letter-spacing:.02em; color:var(--ink-2);
    background:var(--paper-2); border:1px solid var(--line); border-radius:9px; padding:9px 8px; outline:none; cursor:pointer; }
  .pill{ font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-2);
    background:var(--paper-2); border:1px solid var(--line); border-radius:9px; padding:9px 12px; cursor:pointer; white-space:nowrap; }
  .pill.on{ border-color:var(--accent); color:var(--ink); box-shadow:inset 0 0 0 1px var(--accent); }

  /* ---------------- list ---------------- */
  main{ max-width:720px; margin:0 auto; }
  #list{ padding:4px 0 120px; }
  .row{ display:flex; align-items:center; gap:12px; padding:9px 14px; border-bottom:1px solid var(--line-2);
    cursor:pointer; content-visibility:auto; contain-intrinsic-size:0 62px; }
  .row:active{ background:var(--card); }
  .row .num{ font-family:var(--mono); font-size:11px; color:var(--faint); width:42px; flex:none; }
  .row .pic{ width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; }
  .row .pic img{ width:44px; height:44px; image-rendering:auto; filter:grayscale(1) contrast(1.02) sepia(.12) brightness(1.02); }
  .row .nm{ flex:1 1 auto; min-width:0; font-size:17px; letter-spacing:.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .tt{ display:flex; gap:5px; flex:none; margin-left:auto; }

  /* type stamp */
  .ty{ font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:#fff;
    padding:3px 7px; border-radius:6px; background:var(--faint); white-space:nowrap; }
  .ty.sm{ font-size:8.5px; padding:2px 5px; }
  .ty.ghosted{ color:var(--ink-2); background:transparent; border:1px solid var(--line); }

  /* ---------------- detail ---------------- */
  .view{ padding:0 0 140px; }
  .hidden{ display:none !important; }
  .d-head{ display:flex; gap:16px; align-items:center; padding:16px 16px 10px; }
  .d-head .art{ width:120px; height:120px; flex:none; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 42%, var(--paper-2), var(--paper)); border:1px solid var(--line); border-radius:14px; }
  .d-head .art img{ width:112px; height:112px; filter:grayscale(1) contrast(1.03) sepia(.14) brightness(1.02); }
  .d-head .who .num{ font-family:var(--mono); font-size:12px; color:var(--faint); letter-spacing:.12em; }
  .d-head .who h1{ margin:2px 0 8px; font-size:30px; font-weight:600; }
  .d-head .who .tt{ display:flex; gap:6px; }
  .section{ padding:12px 16px; border-top:1px solid var(--line); }
  .section h2{ margin:0 0 10px; font-family:var(--mono); font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--faint); font-weight:500; }
  .mlist{ display:flex; flex-direction:column; gap:7px; }
  .mline{ display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap; }
  .mline .lab{ font-family:var(--mono); font-size:11px; color:var(--ink-2); width:64px; flex:none; letter-spacing:.06em; padding-top:4px; }
  .chipwrap{ display:flex; flex-wrap:wrap; gap:6px; min-width:0; flex:1 1 0; }
  .chip{ font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; padding:3px 7px; border-radius:6px;
    border:1px solid var(--line); color:var(--ink-2); background:var(--paper-2); }
  .chip .x{ color:var(--ink); font-weight:600; }
  .chip.w4{ border-color:#9c4a3c; color:#7a3328; } .chip.w2{ border-color:#b07a52; color:#7a4a2a; }
  .chip.r2{ border-color:#5f7f5a; color:#3f5e3c; } .chip.r4{ border-color:#5f7f5a; color:#2f4e2c; background:#e4e8dc; }
  .chip.im{ border-color:var(--ink-2); color:var(--ink); background:#e6e2d6; }

  /* stat bars */
  .stat{ display:grid; grid-template-columns:70px 36px 1fr; align-items:center; gap:10px; margin:6px 0; }
  .stat .k{ font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); }
  .stat .v{ font-family:var(--mono); font-size:11px; color:var(--ink); text-align:right; }
  .bar{ height:6px; background:var(--line-2); border-radius:4px; overflow:hidden; }
  .bar i{ display:block; height:100%; background:linear-gradient(90deg,var(--ink-2),var(--accent)); }

  /* collapsible game groups */
  .acc{ border:1px solid var(--line); border-radius:9px; margin:7px 0; overflow:hidden; background:var(--paper-2); }
  .acc > summary{ list-style:none; cursor:pointer; padding:10px 12px; font-family:var(--mono); font-size:11px;
    letter-spacing:.1em; text-transform:uppercase; color:var(--ink-2); display:flex; justify-content:space-between; align-items:center; }
  .acc > summary::-webkit-details-marker{ display:none; }
  .acc > summary::after{ content:"＋"; color:var(--faint); }
  .acc[open] > summary::after{ content:"－"; }
  .acc .body{ padding:4px 12px 12px; }
  .mv{ display:flex; align-items:center; gap:8px; padding:6px 0; border-top:1px solid var(--line-2); cursor:pointer; }
  .mv:first-child{ border-top:0; }
  .mv .lv{ font-family:var(--mono); font-size:10px; color:var(--faint); width:54px; flex:none; }
  .mv .nm{ flex:1; font-size:15px; }
  .mv .meta{ display:flex; gap:5px; align-items:center; }
  .loc{ padding:6px 0; border-top:1px solid var(--line-2); }
  .loc:first-child{ border-top:0; }
  .loc .where{ font-size:15px; } .loc .how{ font-family:var(--mono); font-size:10px; color:var(--faint); letter-spacing:.04em; }

  .addvs{ margin:14px 16px 0; }
  .btn{ display:block; width:100%; text-align:center; font-family:var(--mono); font-size:12px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink); background:var(--paper-2); border:1px solid var(--line); border-radius:11px; padding:13px; cursor:pointer; }
  .btn:active{ background:var(--card); }

  /* ---------------- versus ---------------- */
  .vs-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:14px 14px 0; }
  .vs-slot{ border:1px solid var(--line); border-radius:12px; background:var(--paper-2); padding:12px; min-height:130px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; cursor:pointer; }
  .vs-slot img{ width:84px; height:84px; filter:grayscale(1) contrast(1.03) sepia(.14); }
  .vs-slot .nm{ font-size:17px; margin-top:4px; } .vs-slot .num{ font-family:var(--mono); font-size:10px; color:var(--faint); }
  .vs-slot .empty{ font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.1em; text-transform:uppercase; }
  .vs-mid{ text-align:center; font-family:var(--mono); font-size:11px; letter-spacing:.3em; color:var(--faint); padding:14px 0 4px; }
  .verdict{ margin:10px 16px; padding:12px 14px; border:1px solid var(--line); border-radius:11px; background:var(--card); font-size:15px; line-height:1.5; }

  /* picker overlay */
  #picker{ position:fixed; inset:0; z-index:60; background:rgba(26,24,20,.28); display:none; }
  #picker.on{ display:block; }
  #picker .sheet{ position:absolute; left:0; right:0; bottom:0; max-height:80%; background:var(--paper);
    border-top-left-radius:16px; border-top-right-radius:16px; border-top:1px solid var(--line); display:flex; flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom); }
  #picker .ph{ padding:12px 14px; border-bottom:1px solid var(--line); }
  #pickerList{ overflow:auto; padding-bottom:16px; }

  /* ---------------- charts drawer ---------------- */
  #chartsHandle{ position:fixed; right:0; top:50%; transform:translateY(-50%) rotate(180deg); writing-mode:vertical-rl;
    z-index:40; background:var(--paper-2); border:1px solid var(--line); border-right:0; border-radius:10px 0 0 10px;
    padding:12px 7px; font-family:var(--mono); font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--ink-2); cursor:pointer; }
  #charts{ position:fixed; inset:0 0 0 auto; width:min(560px,94vw); z-index:50; background:var(--paper);
    border-left:1px solid var(--line); box-shadow:-18px 0 40px rgba(30,28,22,.14); transform:translateX(100%);
    transition:transform .32s cubic-bezier(.4,0,.1,1); display:flex; flex-direction:column; }
  #charts.on{ transform:translateX(0); }
  #charts .dh{ display:flex; align-items:center; gap:12px; padding:calc(env(safe-area-inset-top) + 12px) 14px 10px; border-bottom:1px solid var(--line); }
  #charts .dh .ttl{ font-size:18px; font-weight:600; flex:1; }
  #charts .dh .x{ font-family:var(--mono); font-size:16px; color:var(--ink-2); cursor:pointer; padding:4px 8px; }
  .dtabs{ display:flex; gap:8px; padding:10px 14px 0; }
  #chartBody{ overflow:auto; padding:12px 14px calc(env(safe-area-inset-bottom) + 24px); }

  /* type grid */
  table.tg{ border-collapse:collapse; font-family:var(--mono); }
  table.tg th, table.tg td{ width:20px; height:20px; text-align:center; font-size:8px; border:1px solid var(--line-2); }
  table.tg th.rowh{ text-align:right; padding-right:5px; white-space:nowrap; font-size:8.5px; color:var(--ink-2); width:auto; }
  table.tg th.colh{ height:auto; }
  table.tg th.colh span{ writing-mode:vertical-rl; transform:rotate(180deg); font-size:8.5px; color:var(--ink-2); }
  td.m0{ background:#2b2824; color:#fff; } td.m05{ background:#d35f4e; color:#fff; }
  td.m2{ background:#46a35a; color:#fff; font-weight:700; } td.m1{ background:#faf7ef; color:#d3cdbe; }
  table.tg th.colh, table.tg th.rowh{ border-color:rgba(0,0,0,.14); }
  .tgKey{ display:flex; gap:12px; margin:10px 2px; font-family:var(--mono); font-size:10px; color:var(--ink-2); flex-wrap:wrap; }
  .tgKey span{ display:inline-flex; align-items:center; gap:5px; } .tgKey i{ width:12px; height:12px; border-radius:3px; display:inline-block; }

  /* nature grid */
  table.ng{ border-collapse:collapse; width:100%; font-size:12px; }
  table.ng th, table.ng td{ border:1px solid var(--line-2); padding:6px 5px; text-align:center; }
  table.ng th{ font-family:var(--mono); font-size:9px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); }
  table.ng td.neu{ color:var(--faint); background:#e7e3d8; } table.ng td.hl{ background:var(--card); }
  table.ng caption{ font-family:var(--mono); font-size:10px; color:var(--faint); text-align:left; margin-bottom:6px; letter-spacing:.06em; }

  .loading{ font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.1em; padding:16px; text-align:center; }
  .muted{ color:var(--faint); }
</style>
</head>
<body>
  <header id="bar">
    <div class="top">
      <button id="backBtn">back</button>
      <div class="brand">professionaldex</div>
      <div class="sub" id="barSub">national pokédex</div>
      <div class="sp"></div>
      <button class="pill" id="versusTab">versus</button>
    </div>
    <div class="toolRow" id="toolRow">
      <input id="search" placeholder="search  ·  name  ·  no.  ·  type" autocomplete="off" autocapitalize="off" spellcheck="false">
      <select id="gameFilter" class="gamesel" aria-label="filter by game"></select>
    </div>
  </header>

  <main>
    <section id="listView" class="view"><div id="list"><div class="loading">opening the dex…</div></div></section>
    <section id="detailView" class="view hidden"></section>
    <section id="versusView" class="view hidden"></section>
  </main>

  <button id="chartsHandle">Charts</button>
  <aside id="charts">
    <div class="dh"><div class="ttl">Reference</div><div class="x" id="chartsClose">✕</div></div>
    <div class="dtabs"><button class="pill on" data-chart="type">Type chart</button><button class="pill" data-chart="nature">Natures</button></div>
    <div id="chartBody"></div>
  </aside>

  <div id="picker"><div class="sheet">
    <div class="ph"><input id="pickerSearch" class="mono" style="width:100%;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--paper-2);color:var(--ink);outline:none" placeholder="choose a pokémon…" autocomplete="off"></div>
    <div id="pickerList"></div>
  </div></div>

  <script src="data/typechart.js"></script>
  <script src="data/natures.js"></script>
  <script src="app.js"></script>
</body>
</html>
