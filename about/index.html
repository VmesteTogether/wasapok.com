<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>about — wasapok</title>
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #485266; color: #f3dcb0; font-family: 'Share Tech Mono', ui-monospace, monospace; }
    body { overflow-x: hidden; }    /* art balloons left of the main column on expand — don't trigger horizontal scroll */
    main { max-width: 720px; margin: 0 auto; padding: 80px 24px; }
    h1 { font-weight: 700; letter-spacing: 0.06em; font-size: 2.5rem; margin: 0 0 1.5rem; }
    .role { line-height: 1.6; font-size: 1.05rem; margin: 0 0 24px; min-height: 1.6em; letter-spacing: 0.14em; }
    a { color: #f3dcb0; text-decoration: none; }

    /* Expanded view (above grid, full-width span) */
    .expanded { display: none; grid-template-columns: 220px 1fr; gap: 20px; padding: 16px;
                background: rgba(0,0,0,0.18); border: 1px solid rgba(243,220,176,0.18);
                border-radius: 6px; margin-bottom: 18px; position: relative; }
    .expanded.on { display: grid; }
    /* Art expands to a 2×2-tile footprint (~443px, the size of 4 grid tiles), anchored at its original top-right corner,
       growing down + left into the page margin. Adjust if grid gap / main width changes. */
    .exart      { width: 443px; height: 443px; margin-left: -223px; object-fit: cover; border-radius: 4px;
                  background: rgba(243,220,176,0.08); display: block; }
    .exinfo     { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .extitle    { font-size: 1.2rem; font-weight: 50; letter-spacing: 0.17em; }
    .exmeta     { font-size: 0.85rem; opacity: 0.75; letter-spacing: 0.14em; }
    .extrack    { font-size: 0.9rem; opacity: 0.9; white-space: pre-line; letter-spacing: 0.14em; }
    /* Manila-style file tabs on the right edge of the expanded backlay (streaming links).
       Distribute vertically centered; protrude past the right edge into the page margin.
       Hover: hovered tab darkens slightly + slides right; siblings darken more (recede). */
    .exTabs     { position: absolute; top: 50%; left: 100%; transform: translateY(-50%);
                  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; z-index: 3; }
    .exTabs a   { display: flex; align-items: center; justify-content: center;
                  min-width: 28px; min-height: 100px; padding: 12px 6px 12px 16px;   /* extra left padding so text sits clear of the recessed shadow */
                  background: linear-gradient(to right, rgba(0,0,0,0.45) 0, rgba(0,0,0,0.22) 14px);   /* darker fade at left edge → looks recessed into the box */
                  border: 1px solid rgba(243,220,176,0.25); border-left: none;
                  color: rgba(243,220,176,0.45); font-size: 0.75rem; letter-spacing: 0.08em;
                  writing-mode: vertical-rl; text-orientation: mixed;
                  border-radius: 0 8px 8px 0;
                  transition: background 0.18s ease, min-width 0.18s ease, opacity 0.18s ease, color 0.18s ease; cursor: pointer; }
    .exTabs a[data-service="spotify"] { color: rgba(30,215,96,0.55); }                         /* spotify green, dimmed */
    .exTabs a[data-service="apple"]   { color: rgba(252,60,68,0.6); }                          /* apple music red, dimmed */
    .exTabs:hover a   { opacity: 0.35; }                                                       /* siblings fade */
    .exTabs a:hover   { opacity: 1; min-width: 42px; color: #f3dcb0;
                        background: linear-gradient(to right, rgba(0,0,0,0.55) 0, rgba(0,0,0,0.32) 14px); }   /* hovered: full cream text + slight darken + grows right */
    .exTabs a[data-service="spotify"]:hover { color: #1ED760; }                                /* spotify green at full saturation */
    .exTabs a[data-service="apple"]:hover   { color: #FC3C44; }                                /* apple music red at full saturation */
    .player     { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .btn        { width: 32px; height: 32px; flex: 0 0 32px; border: 1px solid #f3dcb0; background: transparent;
                  color: #f3dcb0; border-radius: 50%; cursor: pointer; font: inherit; font-size: 0.9rem; line-height: 1; padding: 0; }
    .btn:hover:not(:disabled) { background: rgba(243,220,176,0.12); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .scrub      { -webkit-appearance: none; appearance: none; flex: 1; height: 4px;
                  background: rgba(243,220,176,0.25); border-radius: 2px; outline: none; }
    .scrub::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px;
                                   border-radius: 50%; background: #f3dcb0; cursor: pointer; border: none; }
    .scrub::-moz-range-thumb     { width: 12px; height: 12px; border-radius: 50%; background: #f3dcb0; cursor: pointer; border: none; }
    .time       { font-size: 0.85rem; opacity: 0.75; min-width: 84px; text-align: right; font-variant-numeric: tabular-nums; }

    /* Tile grid — 3 cols, independent vertical columns */
    .grid-wrap  { position: relative; }
    .grid-toggle{ position: absolute; top: 0; right: calc(100% + 10px);
                  writing-mode: vertical-rl; text-orientation: upright;
                  font-size: 0.7rem; letter-spacing: 0.15em;
                  color: rgba(243,220,176,0.40); cursor: pointer; user-select: none;
                  transition: color 0.18s ease; line-height: 1.4; }
    .grid-toggle:hover { color: #f3dcb0; }
    .grid-toggle .t-arrow { display: inline-block; padding: 6px 0; opacity: 0.6; font-size: 0.85rem; }
    .grid       { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .col        { display: flex; flex-direction: column; gap: 14px; transition: gap 0.18s ease;
                  position: relative; isolation: isolate; align-self: start; }   /* align-self: start so a short column (e.g. middle) doesn't stretch to the tallest col's height — the shadow then matches the actual tile content */
    .col:has(.tile:not(.empty-slot):not(.placeholder):hover) { gap: 24px; }    /* dynamic "hitbox" gap so scaled tiles don't touch each other */
    /* Soft vertical-oblong shadow that fades in behind a column when any active album tile in it is hovered */
    .col::before { content: ''; position: absolute; left: 50%; top: 50%;
                   width: 98%; height: 96%;
                   transform: translate(-50%, -50%);
                   background: rgba(0,0,0,0.09);
                   border-radius: 50%;
                   filter: blur(24px);
                   opacity: 0; transition: opacity 0.22s ease;
                   z-index: -1; pointer-events: none; }
    .col:has(.tile:not(.empty-slot):not(.placeholder):hover)::before { opacity: 1; }
    .tile-wrap  { display: flex; flex-direction: column; }
    .tile       { aspect-ratio: 1; background: rgba(243,220,176,0.06); border-radius: 4px; cursor: pointer;
                  position: relative; overflow: hidden; transform-style: preserve-3d;
                  transition: transform 0.22s ease-out; will-change: transform; }
    .tile img   { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    .tile.placeholder { background: #ffffff; cursor: default; }
    .tile.empty-slot  { background: rgba(0,0,0,0.18); border: 1px dashed rgba(243,220,176,0.35); }
    /* Subtle sympathetic lift on sibling album tiles in the same column when one is hovered */
    .tile.col-lift    { transform: scale(1.05); }
    .hover-info { max-height: 0; opacity: 0; overflow: hidden; font-size: 0.85rem; line-height: 1.35;
                  transition: max-height 0.2s ease, opacity 0.18s ease, padding-top 0.2s ease; padding-top: 0; }
    .hover-info.on  { max-height: 90px; opacity: 1; padding-top: 20px; }   /* clears the hovered tile's scaled-down extension */
    .hover-info .t  { font-weight: 700; letter-spacing: 0.04em; }
    .hover-info .y, .hover-info .n { opacity: 0.75; }

    @media (max-width: 600px) {
      main { padding: 60px 16px; max-width: none; }
      .expanded { grid-template-columns: 1fr; }
      .exart { width: 100%; height: auto; aspect-ratio: 1; margin-left: 0; }   /* no 4× balloon on mobile */
    }
  </style>
</head>
<body>
  <main>
    <h1>wasapok angleur</h1>
    <p class="role">art / music</p>

    <div id="expanded" class="expanded"></div>
    <div class="grid-wrap">
      <div id="grid-toggle" class="grid-toggle"></div>
      <div id="grid" class="grid"></div>
    </div>
  </main>

  <script>
    // ────────────────────────────────────────────────────────────────────────
    //  DATA — edit me to add / remove / reorder albums.
    //  col: 0 = LEFT (solo artist), 1 = MIDDLE (producer / demos), 2 = RIGHT (band)
    //  Order within a column = visual order top → bottom.
    //  Leave any field as '' to hide it (links, featured audio, etc.).
    //  Set placeholder:true for a passive white tile (future album slot).
    // ────────────────────────────────────────────────────────────────────────
    const albums = [
      // LEFT column — solo artist
      { id: 'reilly', col: 0, cover: 'reilly-album-cvr.jpeg',
        title: 'Biome .•.•.•:::Plain.', year: '2025', tracks: 5, role: 'sole artist',
        tracklist: [
          `Delphinium°171:`,
          `Aesthetics 2k, 052-054.`,
          `'Indamnesiac'`,
          `#1`,
          `Arscinine, thank you i'm sorry but thank you, again`,
        ], featured: '',
        links: { spotify: 'https://google.com', apple: 'https://music.apple.com/us/album/biome-plain-ep/1858512958', soundcloud: '', youtube: '' } },
      { id: 'scraped', col: 0, cover: 'scraped.jpg',
        title: 'scraped', year: '2025', tracks: 1, role: 'producer/co-writer',
        tracklist: ['scraped'], featured: '',
        links: { spotify: 'https://open.spotify.com/track/6o4uAFEoe5olYrg6Zji49n', apple: 'https://music.apple.com/us/album/scraped-single/1859111335', soundcloud: '', youtube: '' } },
      { id: 'palm_tree', col: 0, cover: 'palm_tree.png',
        title: `'°Palm Tree's Syrup'°"`, year: '2026', tracks: 4, role: 'sole artist',
        tracklist: [
          `Blue]:::]Crusaders`,
          `•°. Aevos::.•.•.•-`,
          `................:::::::indigenal`,
          `The Palm's Tree Syrup`,
        ], featured: '',
        links: { spotify: 'https://google.com', apple: 'https://music.apple.com/us/album/palm-trees-syrup-ep/1869613519', soundcloud: '', youtube: '' } },
      { id: 'scoputicular', col: 0, cover: 'Scoputicular-cvr.png',
        title: 'Scoputicular', year: '2026', tracks: 1, role: 'sole artist',
        tracklist: [`Scoputicular`], featured: '',
        links: { spotify: 'https://google.com', apple: 'https://music.apple.com/us/album/scoputicular-single/1873380037', soundcloud: '', youtube: '' } },

      // MIDDLE column — producer credits / demos / unreleased
      { id: 'delayworks', col: 1, cover: 'delayworks.jpg',
        title: 'Primadorial', year: '2023', tracks: 9, role: 'sole artist/demos',
        tracklist: [
          'Perfection',
          `I can’t get my eyes to burn`,
          'La beomba',
          'Althium',
          'Frother in bloom',
          'Spectral Projections (interlude)',
          `Interlocutor’s lude`,
          'Snowflaeks',
          'My eyes are finally burning',
        ], featured: '',
        links: { spotify: '', apple: '', soundcloud: 'https://soundcloud.com/v-mestetogether/sets/delayworks', youtube: '' } },
      { id: 'eskleon', col: 1, cover: 'eskleon.jpg',
        title: 'Eskleon', year: '2023', tracks: 4, role: 'sole artist/demos',
        tracklist: [
          'Saturns_Aurora3',
          'Iceland_on_fire.1 (Title Screen)',
          'Sunrise_over_concrete',
          'Lichen_meadow.3',
          // SoundCloud only ships the first 4 in HTML — fill in the remaining 12 from the set manually
        ], featured: '',
        links: { spotify: '', apple: '', soundcloud: 'https://soundcloud.com/wasapokangleur-482659426/sets/eskleon', youtube: '' } },

      // RIGHT column — band releases (V.Meste Together on SoundCloud, all 2023)
      { id: 'hello-boredom', col: 2, cover: 'hello-boredom.jpg',
        title: 'Hello Boredom', year: '2023', tracks: 7, role: 'v.meste together',
        tracklist: [
          'Intro to NAR (no. 0)',
          'Numbingly Pleasant (no. 2)',
          'Absorbiting (no. 3)',
          'Nuclear Drome Strike (no. 4)',
          'A Snippet of Sadness (no. 5)',
          'Galaxy Detuned (no. 6)',
          'Council on Jupiter (no. 7)',
        ], featured: '',
        links: { spotify: '', apple: '', soundcloud: 'https://soundcloud.com/v-mestetogether/sets/hello-boredom-jam-sesh', youtube: '' } },
      { id: 'hello-bo2edom', col: 2, cover: 'hello-bo2edom.jpg',
        title: 'Hello Bo2edom', year: '2023', tracks: 10, role: 'v.meste together',
        tracklist: [
          'Steep (no. 0)',
          'Snowflakes (no. 2)',
          'Free (3) Gnomes Descending Into A Reactor (no. 3)',
          'Legūã (no. 4)',
          'EMo Story (no. 5)',
          'Low Flight (no. 6)',
          'Nevesomost (no. 7)',
          'Morse (no. 8)',
          'Ludovico (no. 9)',
          'Ballad (no. 10)',
        ], featured: '',
        links: { spotify: '', apple: '', soundcloud: 'https://soundcloud.com/v-mestetogether/sets/hello-bo2edom', youtube: '' } },
      { id: 'helllo-b3redom', col: 2, cover: 'helllo-b3redom.jpg',
        title: 'Helllo B3redom', year: '2023', tracks: 19, role: 'v.meste together',
        tracklist: [
          'Between Levels Of Hell',
          'Squares & Mangoes',
          'Chasing Birds (piano)',
          'Overdrone',
          `realizing that it doesn't matter (guitar)`,
          'Pickup Truck Orgy',
          'Intro To NAR (drome edit)',
          'mentally unwell (guitar)',
          'Gnomes Melting (again?)',
          'Whenever Is Tonight (guitar)',
          'Ants In Pompeii (piano)',
          'excited machines',
          `Whenever I Don’t Know What To Do`,
          `you can't really outrun yourself (guitar)`,
          'Possiblimente Structural Songularity (guitar)',
          'snippet of songularity (guitar)',
          'Getting To Know Each Other',
          'Blisstering (guitar)',
          'Snow (cover)',
        ], featured: '',
        links: { spotify: '', apple: '', soundcloud: 'https://soundcloud.com/v-mestetogether/sets/helllo-b3redom', youtube: '' } },
    ];

    // ────────────────────────────────────────────────────────────────────────
    //  STATE
    // ────────────────────────────────────────────────────────────────────────
    let expandedId = null;
    let oldOnTop   = false;    // false = new at top by default (newest first); only affects col 0 + col 2; middle col 1 is catchall
    const $role     = document.querySelector('.role');
    const $grid     = document.getElementById('grid');
    const $expanded = document.getElementById('expanded');
    const $toggle   = document.getElementById('grid-toggle');
    const setRole = txt => { $role.textContent = txt || 'art / music'; };

    function buildToggle() {
      const top = oldOnTop ? 'old' : 'new';
      const bot = oldOnTop ? 'new' : 'old';
      $toggle.innerHTML = `${top}<span class="t-arrow">↕</span>${bot}`;
    }
    $toggle.addEventListener('click', () => { oldOnTop = !oldOnTop; render(); });

    // ────────────────────────────────────────────────────────────────────────
    //  GRID
    // ────────────────────────────────────────────────────────────────────────
    function buildGrid() {
      $grid.innerHTML = '';
      for (let c = 0; c < 3; c++) {
        const col = document.createElement('div');
        col.className = 'col';
        let colAlbums = albums.filter(a => a.col === c);
        if (c !== 1 && !oldOnTop) colAlbums = colAlbums.slice().reverse();   // toggle reverses outer cols only; middle stays in data order
        colAlbums.forEach(a => {
          const wrap = document.createElement('div');
          wrap.className = 'tile-wrap';

          const isEmpty = a.id === expandedId;
          const tile = document.createElement('div');
          tile.className = 'tile'
            + (a.placeholder ? ' placeholder' : '')
            + (isEmpty       ? ' empty-slot' : '');
          tile.dataset.id = a.id;
          if (!a.placeholder && !isEmpty) {
            const img = document.createElement('img');
            img.src = a.cover; img.alt = '';
            tile.appendChild(img);
          }
          wrap.appendChild(tile);

          // hover info reveals below this tile, within the same column
          if (!a.placeholder && !isEmpty) {
            const info = document.createElement('div');
            info.className = 'hover-info';
            info.dataset.for = a.id;
            info.innerHTML = `<div class="t">${a.title}</div><div class="y">${a.year}</div><div class="n">${a.tracks} tracks</div>`;
            wrap.appendChild(info);
          }
          col.appendChild(wrap);
        });
        $grid.appendChild(col);
      }
      attachHandlers();
    }

    function attachHandlers() {
      $grid.querySelectorAll('.tile').forEach(tile => {
        const a = albums.find(x => x.id === tile.dataset.id);
        if (!a || a.placeholder) return;

        const isEmpty = a.id === expandedId;

        tile.addEventListener('click', () => {
          expandedId = isEmpty ? null : a.id;          // click empty-slot → close; click album → expand (or swap)
          render();
          if (expandedId) $expanded.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        if (isEmpty) return;   // no hover/tilt on the empty slot

        const info = tile.parentElement.querySelector('.hover-info');
        const colEl = tile.closest('.col');
        const liftSiblings = on => {
          if (!colEl) return;
          colEl.querySelectorAll('.tile').forEach(t => {
            if (t === tile || t.classList.contains('placeholder') || t.classList.contains('empty-slot')) return;
            t.classList.toggle('col-lift', on);
          });
        };
        tile.addEventListener('mouseenter', () => { setRole(a.role); info && info.classList.add('on'); liftSiblings(true);  });
        tile.addEventListener('mouseleave', () => { setRole('');     info && info.classList.remove('on'); liftSiblings(false); resetTilt(tile); });
        tile.addEventListener('mousemove',  e  => applyTilt(tile, e));
      });
    }

    function applyTilt(tile, e) {
      const r  = tile.getBoundingClientRect();
      const cx = (e.clientX - r.left) / r.width  - 0.5;
      const cy = (e.clientY - r.top ) / r.height - 0.5;
      const rotY =  cx * 18;
      const rotX = -cy * 18;
      const tx   =  cx * 8;
      const ty   =  cy * 8;
      tile.style.transform =
        `perspective(600px) translate3d(${tx}px,${ty}px,0) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.10)`;
    }
    function resetTilt(tile) { tile.style.transform = ''; }

    // ────────────────────────────────────────────────────────────────────────
    //  EXPANDED VIEW
    // ────────────────────────────────────────────────────────────────────────
    function buildExpanded() {
      if (!expandedId) { $expanded.classList.remove('on'); $expanded.innerHTML = ''; return; }
      const a = albums.find(x => x.id === expandedId);
      const tabsHtml = Object.entries(a.links).filter(([, v]) => v)
        .map(([k, v]) => `<a href="${v}" target="_blank" rel="noopener" data-service="${k}">${k}</a>`).join('');
      const trackHtml = a.tracklist.length
        ? a.tracklist.map((t, i) => `${i + 1}. ${t}`).join('\n')
        : '(tracklist tbd)';
      const playerHtml = a.featured
        ? `<div class="player"><button class="btn">▶</button><input class="scrub" type="range" min="0" max="0" step="0.01" value="0"><span class="time">0:00 / 0:00</span><audio preload="metadata" src="${a.featured}"></audio></div>`
        : `<div class="player"><button class="btn" disabled>▶</button><input class="scrub" type="range" min="0" max="0" disabled><span class="time">— / —</span></div>`;
      $expanded.innerHTML = `
        ${a.cover ? `<img class="exart" src="${a.cover}" alt="">` : `<div class="exart"></div>`}
        <div class="exinfo">
          <div class="extitle">${a.title || '(untitled)'}</div>
          <div class="exmeta">${[a.year, `${a.tracks} tracks`, a.role].filter(Boolean).join(' · ')}</div>
          <div class="extrack">${trackHtml}</div>
          ${playerHtml}
        </div>
        ${tabsHtml ? `<div class="exTabs">${tabsHtml}</div>` : ''}`;
      $expanded.classList.add('on');
      wirePlayer();
    }

    function wirePlayer() {
      const audio = $expanded.querySelector('audio');
      const btn   = $expanded.querySelector('.btn');
      const scrub = $expanded.querySelector('.scrub');
      const time  = $expanded.querySelector('.time');
      if (!audio || !btn) return;
      const fmt = s => {
        if (!isFinite(s)) return '0:00';
        const m = Math.floor(s / 60), ss = Math.floor(s % 60).toString().padStart(2, '0');
        return `${m}:${ss}`;
      };
      audio.addEventListener('loadedmetadata', () => {
        scrub.max = audio.duration || 0;
        time.textContent = `0:00 / ${fmt(audio.duration)}`;
      });
      btn.addEventListener('click', () => {
        if (audio.paused) { audio.play(); btn.textContent = '■'; }
        else              { audio.pause(); audio.currentTime = 0; btn.textContent = '▶'; }
      });
      audio.addEventListener('timeupdate', () => {
        scrub.value = audio.currentTime;
        time.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
      });
      audio.addEventListener('ended', () => { btn.textContent = '▶'; scrub.value = 0; });
      scrub.addEventListener('input', () => { audio.currentTime = +scrub.value; });
    }

    function render() { buildToggle(); buildExpanded(); buildGrid(); }
    render();
  </script>
</body>
</html>
