<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>about — wasapok</title>
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #485266; color: #f3dcb0; font-family: 'Share Tech Mono', ui-monospace, monospace; }
    main { max-width: 720px; margin: 0 auto; padding: 80px 24px; }
    h1 { font-weight: 700; letter-spacing: 0.06em; font-size: 2.5rem; margin: 0 0 1.5rem; }
    p { line-height: 1.6; font-size: 1.05rem; margin-left: -72px; }
    .tracks { margin-left: -72px; margin-right: 72px; }
    a { color: #f3dcb0; }

    .tracks { margin-top: 32px; display: flex; flex-direction: column; gap: 20px; }
    .track  { display: grid; grid-template-columns: 200px 1fr; gap: 28px; align-items: center; }
    .card   { background: rgba(0,0,0,0.18); border: 1px solid rgba(243,220,176,0.18); border-radius: 6px; padding: 12px;
              display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .art    { width: 200px; height: 200px; background: rgba(243,220,176,0.08); border-radius: 4px; object-fit: cover; display: block; }
    .art-block { width: 200px; display: flex; flex-direction: column; gap: 6px; }
    .meta   { font-size: 0.85rem; line-height: 1.35; }
    .meta .t { font-weight: 700; letter-spacing: 0.04em; }
    .meta .y, .meta .n { opacity: 0.7; }
    .title  { font-size: 1rem; letter-spacing: 0.04em; }
    .row    { display: flex; align-items: center; gap: 10px; }
    .btn    { width: 32px; height: 32px; flex: 0 0 32px; border: 1px solid #f3dcb0; background: transparent; color: #f3dcb0;
              border-radius: 50%; cursor: pointer; font: inherit; font-size: 0.9rem; line-height: 1; padding: 0; }
    .btn:hover { background: rgba(243,220,176,0.12); }
    .scrub  { -webkit-appearance: none; appearance: none; flex: 1; height: 4px; background: rgba(243,220,176,0.25); border-radius: 2px; outline: none; }
    .scrub::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #f3dcb0; cursor: pointer; border: none; }
    .scrub::-moz-range-thumb     { width: 12px; height: 12px; border-radius: 50%; background: #f3dcb0; cursor: pointer; border: none; }
    .time   { font-size: 0.85rem; opacity: 0.75; min-width: 84px; text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <h1>wasapok angleur</h1>
    <p>as sole writer, performer, and producer:</p>

    <div class="tracks">
      <div class="track">
        <div class="art-block">
          <img class="art" src="reilly-album-cvr.jpeg" alt="">
          <div class="meta"><div class="t">title</div><div class="y">202x</div><div class="n">x tracks</div></div>
        </div>
        <div class="card">
          <div class="title">BiomePlain</div>
          <div class="row">
            <button class="btn" data-action="play">▶</button>
            <input class="scrub" type="range" min="0" max="0" step="0.01" value="0">
            <span class="time">0:00 / 0:00</span>
          </div>
          <audio preload="metadata" src="../newhome/BiomePlain.mp3"></audio>
        </div>
      </div>

      <div class="track">
        <div class="art-block">
          <img class="art" src="palm_tree.png" alt="">
          <div class="meta"><div class="t">title</div><div class="y">202x</div><div class="n">x tracks</div></div>
        </div>
        <div class="card">
          <div class="title">PalmTreeSyrup</div>
          <div class="row">
            <button class="btn" data-action="play">▶</button>
            <input class="scrub" type="range" min="0" max="0" step="0.01" value="0">
            <span class="time">0:00 / 0:00</span>
          </div>
          <audio preload="metadata" src="../newhome/PalmTreeSyrup.mp3"></audio>
        </div>
      </div>

      <div class="track">
        <div class="art-block">
          <img class="art" src="Scoputicular-cvr.png" alt="">
          <div class="meta"><div class="t">title</div><div class="y">202x</div><div class="n">x tracks</div></div>
        </div>
        <div class="card">
          <div class="title">Periphsisha</div>
          <div class="row">
            <button class="btn" data-action="play">▶</button>
            <input class="scrub" type="range" min="0" max="0" step="0.01" value="0">
            <span class="time">0:00 / 0:00</span>
          </div>
          <audio preload="metadata" src="../newhome/Periphsisha.mp3"></audio>
        </div>
      </div>

      <div class="track">
        <div class="art-block">
          <img class="art" src="eskleon.jpg" alt="">
          <div class="meta"><div class="t">title</div><div class="y">202x</div><div class="n">x tracks</div></div>
        </div>
        <div class="card">
          <div class="title">eskleon</div>
          <div class="row">
            <button class="btn" data-action="play">▶</button>
            <input class="scrub" type="range" min="0" max="0" step="0.01" value="0">
            <span class="time">0:00 / 0:00</span>
          </div>
          <audio preload="metadata"></audio>
        </div>
      </div>
    </div>
  </main>

  <script>
    const fmt = s => {
      if (!isFinite(s)) return '0:00';
      const m = Math.floor(s / 60), ss = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${ss}`;
    };
    const tracks = document.querySelectorAll('.track');
    const audios = [...tracks].map(t => t.querySelector('audio'));
    tracks.forEach((t, i) => {
      const audio = audios[i];
      const btn   = t.querySelector('.btn');
      const scrub = t.querySelector('.scrub');
      const time  = t.querySelector('.time');
      audio.addEventListener('loadedmetadata', () => {
        scrub.max = audio.duration || 0;
        time.textContent = `0:00 / ${fmt(audio.duration)}`;
      });
      btn.addEventListener('click', () => {
        if (audio.paused) {
          audios.forEach((a, j) => { if (j !== i) { a.pause(); a.currentTime = 0; tracks[j].querySelector('.btn').textContent = '▶'; } });
          audio.play(); btn.textContent = '■';
        } else {
          audio.pause(); audio.currentTime = 0; btn.textContent = '▶';
        }
      });
      audio.addEventListener('timeupdate', () => {
        scrub.value = audio.currentTime;
        time.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
      });
      audio.addEventListener('ended', () => { btn.textContent = '▶'; scrub.value = 0; });
      scrub.addEventListener('input', () => { audio.currentTime = +scrub.value; });
    });
  </script>
</body>
</html>
