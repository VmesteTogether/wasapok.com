    .extrack li.featured { opacity: 1; background: rgba(243,220,176,0.07); }   /* light up + subtle background bar */

    .extrack .ftag  { font-size: 0.72rem; color: #ffffff; opacity: 0.78; letter-spacing: 0.20em;
                      flex: 0 0 auto; white-space: nowrap; }
    /* Manila-style file tabs on the right edge of the expanded backlay (streaming links).
       Distribute vertically centered; protrude past the right edge into the page margin.
       Hover: hovered tab darkens slightly + slides right; siblings darken more (recede). */
    .exTabs     { position: absolute; top: 50%; left: 100%; transform: translateY(-50%);
                  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; z-index: 3; }
    .exTabs a   { display: flex; align-items: center; justify-content: center;
                  min-width: 28px; min-height: 100px; padding: 12px 6px 12px 16px;   /* extra left padding so text sits clear of the recessed shadow */
                  background: linear-gradient(to right, rgba(0,0,0,0.45) 0, rgba(0,0,0,0.22) 14px);   /* darker fade at left edge → looks recessed into the box */
                  border: 1px solid rgba(243,220,176,0.25); border-left: none;
                  color: rgba(243,220,176,0.45); font-size: 0.75rem; letter-spacing: 0.08em;
                  writing-mode: vertical-rl; text-orientation: mixed;
                  border-radius: 0 8px 8px 0;
                  transition: background 0.18s ease, min-width 0.18s ease, opacity 0.18s ease, color 0.18s ease; cursor: pointer; }
    .exTabs a[data-service="spotify"] { color: rgba(30,215,96,0.55); }                         /* spotify green, dimmed */
    .exTabs a[data-service="apple"]   { color: rgba(252,60,68,0.6); }                          /* apple music red, dimmed */
    .exTabs:hover a   { opacity: 0.35; }                                                       /* siblings fade */
    .exTabs a:hover   { opacity: 1; min-width: 42px; color: #f3dcb0;
                        background: linear-gradient(to right, rgba(0,0,0,0.55) 0, rgba(0,0,0,0.32) 14px); }   /* hovered: full cream text + slight darken + grows right */
    .exTabs a[data-service="spotify"]:hover { color: #1ED760; }                                /* spotify green at full saturation */
    .exTabs a[data-service="apple"]:hover   { color: #FC3C44; }                                /* apple music red at full saturation */
    .player     { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
    .btn        { width: 32px; height: 32px; flex: 0 0 32px; border: 1px solid #f3dcb0; background: transparent;
                  color: #f3dcb0; border-radius: 50%; cursor: pointer; font: inherit; font-size: 0.9rem; line-height: 1; padding: 0; }
    .btn:hover:not(:disabled) { background: rgba(243,220,176,0.12); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

                  background: rgba(243,220,176,0.25); border-radius: 2px; outline: none; }

    /* Tile grid — 3 cols, independent vertical columns */
    .grid-wrap  { position: relative; }
    .grid-toggle{ position: absolute; top: 0; right: calc(100% + 10px);
                  writing-mode: vertical-rl; text-orientation: upright;
                  font-size: 0.7rem; letter-spacing: 0.15em;
                  color: rgba(243,220,176,0.40); cursor: pointer; user-select: none;

    .grid-toggle:hover { color: #f3dcb0; }

    .col        { display: flex; flex-direction: column; gap: 14px; transition: gap 0.18s ease;
                  position: relative; isolation: isolate; align-self: start; }   /* align-self: start so a short column (e.g. middle) doesn't stretch to the tallest col's height — the shadow then matches the actual tile content */
    .col:has(.tile:not(.empty-slot):not(.placeholder):hover) { gap: 24px; }    /* dynamic "hitbox" gap so scaled tiles don't touch each other */
    /* Soft vertical-oblong shadow that fades in behind a column when any active album tile in it is hovered */
    .col::before { content: ''; position: absolute; left: 50%; top: 50%;
                   width: 98%; height: 96%;
                   transform: translate(-50%, -50%);
                   background: rgba(0,0,0,0.09);

    .col:has(.tile:not(.empty-slot):not(.placeholder):hover)::before { opacity: 1; }

                  transition: transform 0.22s ease-out; will-change: transform; }
    .tile img   { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }

    .tile.empty-slot  { background: rgba(0,0,0,0.18); border: 1px dashed rgba(243,220,176,0.35); }

    .hover-info { max-height: 0; opacity: 0; overflow: hidden; font-size: 0.85rem; line-height: 1.35;

    @media (max-width: 600px) {

    /* Grassy doorway anchored to the very bottom-right of the scrollable page — a
       forward-facing wall panel (.gd-wall) with a door-sized arched opening (.gd-door),
       plus a right-pointing chevron arrow (.gd-arrow) to its left so the whole thing
       reads as one "go in here" icon. Grass surfaces use the procedural pixel-grass
       texture (CSS var --grass); the opening is a darker recessed alcove. → /newhome. */
    #grassDoor { position: absolute; right: 20px; bottom: 20px; z-index: 60;
                 width: 128px; height: 296px; cursor: pointer; display: block;   /* 2× tall; door stays at the bottom, added top half is pure grass */
                 transform: scale(0.667); transform-origin: bottom right;   /* 2/3 size, anchored at the corner */
                 transition: transform 0.18s ease; }
    #grassDoor .gd-wall { position: absolute; inset: 0; overflow: hidden; image-rendering: pixelated;
                 background-image: var(--grass); background-size: 56px 56px;
                 /* fade the grass patch's edges to transparent so it dissolves into the
                    slate-blue page background: horizontal fade mends the sides, vertical
                    fade mends the top; the bottom (ground) stays solid. */
                 -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 24%, #000 76%, transparent 100%),
                                     linear-gradient(to bottom, transparent 0%, #000 30%, #000 100%);
                 -webkit-mask-composite: source-in;
                         mask-image: linear-gradient(to right, transparent 0%, #000 24%, #000 76%, transparent 100%),
                                     linear-gradient(to bottom, transparent 0%, #000 30%, #000 100%);
                         mask-composite: intersect; }
    #grassDoor .gd-door { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
                 width: 56px; height: 104px; border-radius: 28px 28px 0 0; overflow: hidden;
                 image-rendering: pixelated;
                 /* grass corridor with a long dark gradient receding to a vanishing point near
                    the top → reads as a hallway going back. More spread-out stops + a higher,
                    smaller vanishing point = a longer hallway. */
                 background-image: radial-gradient(75% 135% at 50% 4%, rgba(0,0,0,0.97) 0%, rgba(0,0,0,0.8) 16%, rgba(0,0,0,0.5) 42%, rgba(0,0,0,0.22) 66%, rgba(0,0,0,0) 92%),
                                   var(--grass);
                 background-size: 100% 100%, 40px 40px;
                 filter: brightness(0.62) saturate(0.85);
                 box-shadow: inset 0 0 10px 4px rgba(0,0,0,0.5), 0 0 0 2px rgba(0,0,0,0.3);
                 transition: filter 0.18s ease; }
    /* Chevron arrow just left of the wall, aligned with the door opening. Dim by
       default; on hover the chevrons light up in sequence flowing toward the door. */
    #grassDoor .gd-arrow { position: absolute; right: 100%; top: 244px; transform: translateY(-50%);
                 margin-right: 12px; line-height: 1; color: #f3dcb0; opacity: 0.32;
                 text-shadow: 0 1px 3px rgba(0,0,0,0.55);
                 font: 700 36px 'Share Tech Mono', ui-monospace, monospace;
                 transition: transform 0.2s ease, opacity 0.2s ease, text-shadow 0.2s ease; }
    #grassDoor:hover { transform: scale(0.69) translateY(-2px); }   /* only a slight grow (~7% of the old 2/3→full jump) */
    #grassDoor:hover .gd-door { filter: brightness(0.74) saturate(0.9); }   /* hallway lifts a touch on hover */
    #grassDoor:hover .gd-arrow { opacity: 1; transform: translate(7px, -50%);
                 text-shadow: 0 0 9px rgba(255,236,180,0.95); }
    @media (max-width: 560px) { #grassDoor { right: 12px; bottom: 12px; transform: scale(0.82); transform-origin: bottom right; } }

    /* ── Live chrome-diamond hero (Three.js canvas) above the title ── */
    #heroGem { width: 33%; height: 210px; margin: 0 0 10px -160px; cursor: grab; touch-action: none; }
    #heroGem:active { cursor: grabbing; }
    #heroGem canvas { display: block; width: 100%; height: 100%; }
    /* Mobile: drop the -160px desktop gutter offset (it shoved the gem off the left
       edge on a phone). Must live AFTER the base #heroGem rule above to win — @media
       adds no specificity, so source order decides. */
    @media (max-width: 600px) {
      #heroGem { width: 56%; height: 180px; margin: 0 0 6px -8px; }
    }

    /* ── Branded entrance ── */
    .tile-enter { animation: tileIn 0.5s cubic-bezier(0.2,0.7,0.2,1) backwards; }
    @keyframes tileIn { from { opacity: 0; transform: translateY(16px) scale(0.95); } to { opacity: 1; transform: none; } }
    #grassDoor { animation: doorGrow 0.7s cubic-bezier(0.2,0.7,0.2,1) 0.55s backwards; }
    @keyframes doorGrow { from { opacity: 0; transform: scale(0.55) translateY(16px); } to { opacity: 1; transform: scale(0.667); } }
    .expanded.on { animation: expandBloom 0.34s cubic-bezier(0.2,0.7,0.2,1); }
    @keyframes expandBloom { from { opacity: 0; transform: translateY(-8px) scale(0.985); } to { opacity: 1; transform: none; } }

    // ────────────────────────────────────────────────────────────────────────

    // ────────────────────────────────────────────────────────────────────────
    let expandedId = null;

    let oldOnTop   = false;    // false = new at top by default (newest first); only affects col 0 + col 2; middle col 1 is catchall

    const $grid     = document.getElementById('grid');
    const $expanded = document.getElementById('expanded');
    const $toggle   = document.getElementById('grid-toggle');
    const setRole = txt => { $role.textContent = txt || 'music'; };

    function buildToggle() {
      const top = oldOnTop ? 'old' : 'new';
      const bot = oldOnTop ? 'new' : 'old';
      $toggle.innerHTML = `${top}<span class="t-arrow">↕</span>${bot}`;
    }
    $toggle.addEventListener('click', () => { oldOnTop = !oldOnTop; render(); });

    // ────────────────────────────────────────────────────────────────────────
    //  GRID
    // ────────────────────────────────────────────────────────────────────────
    function buildGrid() {
      $grid.innerHTML = '';
      let stagger = 0;
      for (let c = 0; c < 3; c++) {
        const col = document.createElement('div');
        col.className = 'col';
        let colAlbums = albums.filter(a => a.col === c);
        if (c !== 1 && !oldOnTop) colAlbums = colAlbums.slice().reverse();   // toggle reverses outer cols only; middle stays in data order

          const wrap = document.createElement('div');
          wrap.className = 'tile-wrap';

          const isEmpty = a.id === expandedId;
          const tile = document.createElement('div');
          tile.className = 'tile'
            + (a.placeholder ? ' placeholder' : '')
            + (isEmpty       ? ' empty-slot' : '');
          tile.dataset.id = a.id;
          if (!a.placeholder && !isEmpty) {
            const img = document.createElement('img');
            img.src = a.cover; img.alt = '';
            tile.appendChild(img);
          }
          wrap.appendChild(tile);
          if (!entered) { tile.classList.add('tile-enter'); tile.style.animationDelay = (0.3 + stagger++ * 0.05) + 's'; }

          // hover info reveals below this tile, within the same column
          if (!a.placeholder && !isEmpty) {
            const info = document.createElement('div');
            info.className = 'hover-info';
            info.dataset.for = a.id;
            info.innerHTML = `<div class="t">${a.title}</div><div class="y">${a.year}</div><div class="n">${a.tracks} tracks</div>`;
            wrap.appendChild(info);
          }
          col.appendChild(wrap);
        });
        $grid.appendChild(col);
      }
      attachHandlers();
    }

    function attachHandlers() {
      $grid.querySelectorAll('.tile').forEach(tile => {
        const a = albums.find(x => x.id === tile.dataset.id);
        if (!a || a.placeholder) return;

        const isEmpty = a.id === expandedId;

        tile.addEventListener('click', () => {
          expandedId = isEmpty ? null : a.id;          // click empty-slot → close; click album → expand (or swap)
          render();
          if (expandedId) $expanded.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });

        if (isEmpty) return;   // no hover/tilt on the empty slot

        const info = tile.parentElement.querySelector('.hover-info');
        const colEl = tile.closest('.col');
        const liftSiblings = on => {
          if (!colEl) return;
          colEl.querySelectorAll('.tile').forEach(t => {
            if (t === tile || t.classList.contains('placeholder') || t.classList.contains('empty-slot')) return;
            t.classList.toggle('col-lift', on);
          });
        };
        tile.addEventListener('mouseenter', () => { setRole(a.role); info && info.classList.add('on'); liftSiblings(true);  });
        tile.addEventListener('mouseleave', () => { setRole('');     info && info.classList.remove('on'); liftSiblings(false); resetTilt(tile); });
        tile.addEventListener('mousemove',  e  => applyTilt(tile, e));
      });
    }

    function applyTilt(tile, e) {
      const r  = tile.getBoundingClientRect();
      const cx = (e.clientX - r.left) / r.width  - 0.5;
      const cy = (e.clientY - r.top ) / r.height - 0.5;
      const rotY =  cx * 18;
      const rotX = -cy * 18;
      const tx   =  cx * 8;
      const ty   =  cy * 8;
      tile.style.transform =
        `perspective(600px) translate3d(${tx}px,${ty}px,0) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.10)`;
    }
    function resetTilt(tile) { tile.style.transform = ''; }

    // ────────────────────────────────────────────────────────────────────────
    //  EXPANDED VIEW
    // ────────────────────────────────────────────────────────────────────────
    function buildExpanded() {
      if (!expandedId) { $expanded.classList.remove('on'); $expanded.innerHTML = ''; return; }
      const a = albums.find(x => x.id === expandedId);
      const tabsHtml = Object.entries(a.links).filter(([, v]) => v)
        .map(([k, v]) => `<a href="${v}" target="_blank" rel="noopener" data-service="${k}">${k}</a>`).join('');
      const trackHtml = a.tracklist.length
        ? `<ul class="extrack">${a.tracklist.map((t, i) => {
            const isFeatured = i === a.featuredIndex;
            const tag = isFeatured ? `<span class="ftag">★ featured</span>` : '';
            return `<li${isFeatured ? ' class="featured"' : ''}><span class="tname">${i + 1}. ${t}</span>${tag}</li>`;
          }).join('')}</ul>`
        : '<div class="extrack-empty">(tracklist tbd)</div>';
      const playerHtml = a.featured
        ? `<div class="player"><button class="btn">▶</button><input class="scrub" type="range" min="0" max="0" step="0.01" value="0"><span class="time">0:00 / 0:00</span><audio preload="metadata" src="${a.featured}"></audio></div>`
        : `<div class="player"><button class="btn" disabled>▶</button><input class="scrub" type="range" min="0" max="0" disabled><span class="time">— / —</span></div>`;
      $expanded.innerHTML = `
        ${a.cover ? `<img class="exart" src="${a.cover}" alt="">` : `<div class="exart"></div>`}
        <div class="exinfo">
          <div class="extitle">${a.title || '(untitled)'}</div>
          <div class="exmeta">${[a.year, `${a.tracks} tracks`, a.role].filter(Boolean).join(' · ')}</div>
          ${trackHtml}
          ${playerHtml}
        </div>
        ${tabsHtml ? `<div class="exTabs">${tabsHtml}</div>` : ''}`;
      $expanded.classList.add('on');
      wirePlayer();
    }

    function wirePlayer() {
      const audio = $expanded.querySelector('audio');
      const btn   = $expanded.querySelector('.btn');
      const scrub = $expanded.querySelector('.scrub');
      const time  = $expanded.querySelector('.time');
      if (!audio || !btn) return;
      const fmt = s => {
        if (!isFinite(s)) return '0:00';
        const m = Math.floor(s / 60), ss = Math.floor(s % 60).toString().padStart(2, '0');
        return `${m}:${ss}`;
      };
      audio.addEventListener('loadedmetadata', () => {
        scrub.max = audio.duration || 0;
        time.textContent = `0:00 / ${fmt(audio.duration)}`;
      });
      const featuredLi = $expanded.querySelector('li.featured');
      const setPlaying = on => featuredLi && featuredLi.classList.toggle('playing', on);
      btn.addEventListener('click', () => {
        if (audio.paused) { audio.play(); btn.textContent = '■'; setPlaying(true);  }
        else              { audio.pause(); audio.currentTime = 0; btn.textContent = '▶'; setPlaying(false); }
      });
      audio.addEventListener('timeupdate', () => {
        scrub.value = audio.currentTime;
        time.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
      });
      audio.addEventListener('ended', () => { btn.textContent = '▶'; scrub.value = 0; setPlaying(false); });
      scrub.addEventListener('input', () => { audio.currentTime = +scrub.value; });
    }

    function render() { buildToggle(); buildExpanded(); buildGrid(); }
    render();
    entered = true;   // subsequent re-renders (toggle / expand) skip the entrance stagger
  </script>

  <a id="grassDoor" aria-label="enter the room"><span class="gd-arrow">→</span><span class="gd-wall"><span class="gd-door"></span></span><span class="gd-smoke"></span></a>
  <style>
    /* a satisfying smoke ring that puffs up out of the doorway, expands and dissolves */
    #grassDoor .gd-smoke { position: absolute; left: 50%; top: 0; width: 0; height: 0; pointer-events: none; }
    #grassDoor .gd-smoke b {
      position: absolute; left: 0; top: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px;
      border-radius: 50%; opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(245,248,240,.85), rgba(220,228,210,.45) 55%, rgba(220,228,210,0) 72%);
      will-change: transform, opacity;
    }
    #grassDoor .gd-smoke b.go { animation: gdSmoke 1.3s cubic-bezier(.05,.85,.1,1) forwards; }
    @keyframes gdSmoke {
      0%   { opacity: 0;   transform: translate(0,0) scale(.25); }
      18%  { opacity: .9;  transform: translate(var(--x18), var(--y18)) scale(.7); }
      100% { opacity: 0;   transform: translate(var(--x), var(--y)) scale(1.9); filter: blur(3px); }
    }
  </style>
  <script>
    (function () {
      const door  = document.getElementById('grassDoor');
      const smoke = door.querySelector('.gd-smoke');
      const N = 14, R = 52, FLAT = 0.4;   // puffs, ring radius, vertical squash (reads as a ring seen from below)
      door.addEventListener('click', function (e) {
        e.preventDefault();
        smoke.innerHTML = '';
        const rise = -70;              // the ring shoots up out of the chimney top
        for (let i = 0; i < N; i++) {
          const a = (i / N) * Math.PI * 2;
          const b = document.createElement('b');
          b.style.setProperty('--x18', (Math.cos(a) * R * 0.45).toFixed(1) + 'px');
          b.style.setProperty('--y18', (Math.sin(a) * R * 0.45 * FLAT + rise * 0.25).toFixed(1) + 'px');
          b.style.setProperty('--x',  (Math.cos(a) * R).toFixed(1) + 'px');
          b.style.setProperty('--y',  (Math.sin(a) * R * FLAT + rise).toFixed(1) + 'px');
          b.style.animationDelay = (i * 6) + 'ms';
          smoke.appendChild(b);
          void b.offsetWidth;
          b.classList.add('go');
        }
      });
    })();
  </script>
  <script>
    // Procedural chunky pixel-grass texture, tiled across the wall + (darkened)
    // the door alcove via the --grass CSS variable. Tall blades wrap top↔bottom
    // so the tile repeats cleanly.
    (function () {
      const SZ = 56, PX = 4;
      const base  = ['#33501f', '#3b5a24', '#2c4419'];
      const blade = ['#4a6e2c', '#5c8236', '#6c9a3f', '#7faa4c', '#2f4a1c'];
      const c = document.createElement('canvas'); c.width = c.height = SZ;
      const g = c.getContext('2d');
      // mottled base
      for (let y = 0; y < SZ; y += PX) for (let x = 0; x < SZ; x += PX) {
        g.fillStyle = base[(Math.random() * base.length) | 0];
        g.fillRect(x, y, PX, PX);
      }
      // scattered blades (some tall), wrapped vertically for seamless tiling
      const n = (SZ * SZ / (PX * PX)) * 0.55;
      for (let i = 0; i < n; i++) {
        const x = ((Math.random() * SZ / PX) | 0) * PX, y = ((Math.random() * SZ / PX) | 0) * PX;
        const tall = Math.random() < 0.4 ? PX * 2 : PX;
        g.fillStyle = blade[(Math.random() * blade.length) | 0];
        g.fillRect(x, y, PX, tall);
        if (y + tall > SZ) g.fillRect(x, y - SZ, PX, tall);   // wrap overflow to the top edge
      }
      document.documentElement.style.setProperty('--grass', 'url(' + c.toDataURL() + ')');
    })();
  </script>

  <!-- Live chrome-diamond hero: the WasaDiminds crystal from /newhome, chrome env-map
       material, gentle auto-spin + drag-to-spin. Transparent so it floats on the page. -->
  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    const mount = document.getElementById('heroGem');
    if (mount) {
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      mount.appendChild(renderer.domElement);
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
      camera.position.set(0, 0, 4.3);
      const pmrem = new THREE.PMREMGenerator(renderer);
      const envMap = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      pmrem.dispose();
      scene.add(new THREE.AmbientLight(0xbcd4ff, 0.4));
      const key  = new THREE.DirectionalLight(0xfff0d8, 1.1); key.position.set(-3, 4, 5); scene.add(key);
      const cool = new THREE.PointLight(0x6aa8ff, 1.4, 14);   cool.position.set(2, -1, 3); scene.add(cool);
      const mat = new THREE.MeshStandardMaterial({ color: 0xdfe4ea, metalness: 1.0, roughness: 0.3,
                    envMap, envMapIntensity: 4.4, side: THREE.DoubleSide });
      // Procedural surface imperfections — vary the roughness across the metal (broad smudges +
      // fine micro-scratches) via object-space noise injected into the shader. No UVs needed, so
      // the imperfections stick to the surface as it turns. Makes it read as real, worn metal.
      mat.onBeforeCompile = (shader) => {
        shader.vertexShader = shader.vertexShader
          .replace('#include <common>', '#include <common>\nvarying vec3 vObjPos;')
          .replace('#include <begin_vertex>', '#include <begin_vertex>\nvObjPos = position;');
        shader.fragmentShader = shader.fragmentShader
          .replace('#include <common>', `#include <common>
            varying vec3 vObjPos;
            float h31(vec3 p){ return fract(sin(dot(p, vec3(12.9898, 78.233, 37.719))) * 43758.5453); }
            float vnoise(vec3 p){
              vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
              return mix(mix(mix(h31(i), h31(i+vec3(1,0,0)), f.x), mix(h31(i+vec3(0,1,0)), h31(i+vec3(1,1,0)), f.x), f.y),
                         mix(mix(h31(i+vec3(0,0,1)), h31(i+vec3(1,0,1)), f.x), mix(h31(i+vec3(0,1,1)), h31(i+vec3(1,1,1)), f.x), f.y), f.z);
            }`)
          .replace('#include <roughnessmap_fragment>', `#include <roughnessmap_fragment>
            float smudge  = vnoise(vObjPos * 6.5);    // broad dull/shiny patches
            float scratch = vnoise(vObjPos * 55.0);   // fine micro-scratches
            roughnessFactor = clamp(roughnessFactor + (smudge - 0.5) * 0.38 + (scratch - 0.5) * 0.14, 0.04, 0.92);`);
      };
      const tilt = new THREE.Group(); scene.add(tilt);   // hover-tilt (album-style); gem spins inside it on drag
      const gem  = new THREE.Group(); tilt.add(gem);
      gem.rotation.x = -0.4;   // resting lean — turn the diamond's face toward the viewer
      gem.rotation.y = -0.3;   // ...and turned slightly to the left
      fetch('/newhome/WasaDiminds-02.obj').then(r => r.text()).then(text => {
        const verts = [], idx = [];
        for (const raw of text.split('\n')) {
          const l = raw.trim();
          if (l.startsWith('v ')) { const p = l.split(/\s+/); verts.push(+p[1], +p[2], +p[3]); }
          else if (l.startsWith('f ')) { const t = l.slice(2).trim().split(/\s+/).map(x => parseInt(x, 10) - 1);
            for (let i = 1; i < t.length - 1; i++) idx.push(t[0], t[i], t[i + 1]); }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3)); g.setIndex(idx); g.computeVertexNormals();
        g.computeBoundingBox();
        const c = g.boundingBox.getCenter(new THREE.Vector3()), s = g.boundingBox.getSize(new THREE.Vector3());
        g.translate(-c.x, -c.y, -c.z); const sc = 2.2 / (Math.max(s.x, s.y, s.z) || 1); g.scale(sc, sc, sc);
        const mesh = new THREE.Mesh(g, mat); mesh.rotation.x = Math.PI / 2; gem.add(mesh);
      }).catch(() => {});
      // Static until grabbed. Drag = spin (inertia decays to rest, no idle spin).
      // Hover (when not dragging) = album-style tilt-toward-cursor + slight scale.
      let vel = 0, dragging = false, lastX = 0;
      let tiltX = 0, tiltY = 0, tgtX = 0, tgtY = 0, scl = 1, tgtScl = 1;
      const px = e => (e.touches ? e.touches[0].clientX : e.clientX);
      mount.addEventListener('pointerdown', e => { dragging = true; lastX = px(e); tgtX = tgtY = 0; });
      window.addEventListener('pointermove', e => {
        if (dragging) { const x = px(e); const d = (x - lastX) * 0.01; gem.rotation.y += d; vel = d; lastX = x; return; }
        const r = mount.getBoundingClientRect();
        const inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
        if (inside) { const cx = (e.clientX - r.left) / r.width - 0.5, cy = (e.clientY - r.top) / r.height - 0.5;
                      tgtY = cx * 0.5; tgtX = -cy * 0.5; tgtScl = 1.08; }
        else { tgtX = tgtY = 0; tgtScl = 1; }
      });
      window.addEventListener('pointerup', () => { dragging = false; });
      mount.addEventListener('pointerleave', () => { tgtX = tgtY = 0; tgtScl = 1; });
      const resize = () => { const w = mount.clientWidth, h = mount.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
      resize(); window.addEventListener('resize', resize);
      (function loop() {
        requestAnimationFrame(loop);
        if (!dragging) { gem.rotation.y += vel; vel *= 0.92; }   // spin inertia decays to rest — no idle spin
        tiltX += (tgtX - tiltX) * 0.12; tiltY += (tgtY - tiltY) * 0.12;
        scl  += (tgtScl - scl) * 0.12;
        tilt.rotation.x = tiltX; tilt.rotation.y = tiltY; tilt.scale.setScalar(scl);
        renderer.render(scene, camera);
      })();
    }
  </script>
