<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>eskleon rover</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: #3a4254; color: #f3dcb0;
      font-family: 'Share Tech Mono', ui-monospace, monospace;
      -webkit-tap-highlight-color: transparent;
    }
    #scene { position: fixed; inset: 0; display: block; }
    .hud { position: fixed; left: 16px; top: 14px; pointer-events: none; user-select: none; }
    .hud h1 { margin: 0; font-size: 20px; letter-spacing: 2px; }
    .hud p { margin: 2px 0 0; font-size: 11px; opacity: .55; }
    .speedbox {
      position: fixed; right: 16px; bottom: 14px;
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; opacity: .75; user-select: none;
    }
    input[type=range] { width: 110px; accent-color: #f3dcb0; }
    /* juice meter: no text — fullness, pulse tempo and glow do the talking */
    #juice {
      position: fixed; right: 16px; bottom: 44px;
      width: 220px; height: 10px; border-radius: 5px;
      background: rgba(0,0,0,.35);
      border: 1px solid rgba(255,160,86,.35);
    }
    #juicefill {
      position: absolute; left: 0; top: 0; bottom: 0; width: 100%;
      display: block; border-radius: 4px;
      background: linear-gradient(90deg, #ff8f5a, #ffb974);
      transition: width .15s;
    }
    #juiceedge {
      position: absolute; right: 0; top: -2px; bottom: -2px; width: 7px;
      display: block; border-radius: 3px;
      background: #ffe4b8; opacity: 0;
    }
    #juicenotch {
      position: absolute; left: 17.5%; top: -3px; bottom: -3px; width: 1px;
      background: rgba(243,220,176,.4);
    }
  </style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="hud">
  <h1>eskleon rover</h1>
  <p>v0.5 &mdash; the mill + jump/flip/jut/cannon/juice test</p>
  <p>wasd aims &middot; left-click jumps &middot; double-click flips &middot; right-click juts &middot; space fires mid tilt-jump</p>
</div>
<div id="juice"><i id="juicefill"><b id="juiceedge"></b></i><span id="juicenotch"></span></div>
<div class="speedbox">
  <label for="speed">belt speed</label>
  <input id="speed" type="range" min="0" max="2.5" step="0.05" value="1">
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module" src="game.js"></script></body>
</html>
