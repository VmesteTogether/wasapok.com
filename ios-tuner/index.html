<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuner</title>
<style>
  :root {
    --bg: #000000;
    --card: #1c1c1e;
    --card-2: #2c2c2e;
    --separator: rgba(84, 84, 88, 0.6);
    --label: #ffffff;
    --label-2: rgba(235, 235, 245, 0.6);
    --label-3: rgba(235, 235, 245, 0.3);
    --blue: #0a84ff;
    --green: #30d158;
    --red: #ff453a;
    --orange: #ff9f0a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: #101014;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- phone boundary box (iPhone 14/15-ish, 390 x 844 pt) ---------- */
  .phone-wrap {
    transform-origin: center center;
  }

  .phone {
    width: 390px;
    height: 844px;
    background: var(--bg);
    border-radius: 54px;
    border: 1px solid #3a3a3c;
    box-shadow: 0 0 0 10px #1a1a1c, 0 0 0 12px #0c0c0d, 0 30px 80px rgba(0,0,0,0.7);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
  }

  /* dynamic island */
  .island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 122px;
    height: 36px;
    background: #000;
    border-radius: 20px;
    z-index: 50;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
  }

  /* status bar */
  .statusbar {
    height: 59px;
    flex: 0 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 34px 8px;
    font-size: 16px;
    font-weight: 600;
    color: var(--label);
    letter-spacing: -0.2px;
  }
  .statusbar .right { display: flex; gap: 7px; align-items: center; }
  .statusbar svg { display: block; }

  /* nav title */
  .navbar {
    flex: 0 0 auto;
    padding: 6px 24px 2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .navbar h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.37px;
    color: var(--label);
  }
  .navbar .a4 {
    font-size: 13px;
    font-weight: 600;
    color: var(--label-2);
    background: var(--card);
    padding: 6px 12px;
    border-radius: 20px;
  }

  /* ---------- content ---------- */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 4px 20px 0;
    min-height: 0;
  }

  /* gauge card */
  .gauge-card {
    background: var(--card);
    border-radius: 24px;
    padding: 16px 12px 4px;
    position: relative;
  }

  .gauge-svg { width: 100%; display: block; }

  .readout {
    text-align: center;
    margin-top: -86px;
    padding-bottom: 14px;
    position: relative;
    z-index: 2;
  }
  .readout .note {
    font-size: 64px;
    font-weight: 700;
    letter-spacing: -1px;
    color: var(--label);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .readout .note sup {
    font-size: 30px;
    font-weight: 600;
    color: var(--label-2);
    vertical-align: 26px;
    margin-left: 2px;
  }
  .readout .meta {
    margin-top: 8px;
    font-size: 15px;
    font-weight: 500;
    color: var(--label-2);
    font-variant-numeric: tabular-nums;
    min-height: 20px;
  }
  .readout .cents-big {
    margin-top: 2px;
    font-size: 17px;
    font-weight: 600;
    min-height: 22px;
    font-variant-numeric: tabular-nums;
    transition: color 0.15s;
  }

  .tune-pill {
    display: inline-block;
    margin-top: 6px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 4px 14px;
    border-radius: 20px;
    color: #000;
    background: var(--green);
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.2s, transform 0.2s;
  }
  .tune-pill.show { opacity: 1; transform: scale(1); }

  /* ---------- note picker ---------- */
  .section-label {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--label-2);
    margin: 18px 6px 8px;
  }

  .note-grid {
    background: var(--card);
    border-radius: 20px;
    padding: 8px;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }
  .note-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--label);
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    padding: 11px 0;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, transform 0.1s;
    font-variant-numeric: tabular-nums;
  }
  .note-btn:active { transform: scale(0.93); }
  .note-btn.sharp { color: var(--label-2); }
  .note-btn.selected {
    background: var(--blue);
    color: #fff;
  }

  /* octave stepper + tone row */
  .row {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  .octave-card {
    flex: 1;
    background: var(--card);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 8px;
  }
  .oct-label {
    display: flex;
    flex-direction: column;
    padding-left: 10px;
  }
  .oct-label .t { font-size: 15px; font-weight: 600; color: var(--label); }
  .oct-label .v { font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; }
  .stepper {
    display: flex;
    background: var(--card-2);
    border-radius: 12px;
    overflow: hidden;
  }
  .stepper button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--label);
    width: 47px;
    height: 38px;
    font-size: 22px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s;
    line-height: 1;
  }
  .stepper button:active { background: rgba(255,255,255,0.12); }
  .stepper button:disabled { color: var(--label-3); }
  .stepper .div { width: 1px; background: var(--separator); margin: 8px 0; }

  .tone-btn {
    flex: 0 0 auto;
    appearance: none;
    border: none;
    background: var(--card);
    color: var(--blue);
    border-radius: 20px;
    width: 62px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .tone-btn:active { transform: scale(0.95); }
  .tone-btn.playing { background: var(--blue); color: #fff; }

  /* ---------- mic button ---------- */
  .mic-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 90px;
  }
  .mic-btn {
    appearance: none;
    border: none;
    font-family: inherit;
    background: var(--blue);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    padding: 15px 0;
    width: 100%;
    border-radius: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.2s, transform 0.1s;
  }
  .mic-btn:active { transform: scale(0.98); }
  .mic-btn.live {
    background: var(--card);
    color: var(--red);
  }
  .mic-btn .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: currentColor;
    display: none;
  }
  .mic-btn.live .dot { display: block; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* home indicator */
  .home-indicator {
    flex: 0 0 auto;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .home-indicator::after {
    content: "";
    width: 139px;
    height: 5px;
    border-radius: 3px;
    background: var(--label);
    opacity: 0.9;
  }
</style>
</head>
<body>

<div class="phone-wrap" id="phoneWrap">
  <div class="phone">
    <div class="island"></div>

    <div class="statusbar">
      <span id="clock">9:41</span>
      <span class="right">
        <!-- signal -->
        <svg width="18" height="12" viewBox="0 0 18 12" fill="white"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <!-- wifi -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="white"><path d="M8.5 12 L11.2 8.8 A4.4 4.4 0 0 0 5.8 8.8 Z"/><path d="M3.6 6.2 A7.4 7.4 0 0 1 13.4 6.2 L15.4 3.9 A10.4 10.4 0 0 0 1.6 3.9 Z" opacity="0.95"/></svg>
        <!-- battery -->
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="white" stroke-opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="white"/><path d="M25.5 4.5 V8.5 A2.2 2.2 0 0 0 25.5 4.5Z" fill="white" fill-opacity="0.4"/></svg>
      </span>
    </div>

    <div class="navbar">
      <h1>Tuner</h1>
      <span class="a4">A4 = 440 Hz</span>
    </div>

    <div class="content">
      <div class="gauge-card">
        <svg class="gauge-svg" id="gaugeSvg" viewBox="0 0 340 200"></svg>
        <div class="readout">
          <div class="note" id="noteDisplay">A<sup id="octDisplay">4</sup></div>
          <div class="meta" id="metaDisplay">target 440.00 Hz</div>
          <div class="cents-big" id="centsDisplay">&nbsp;</div>
          <div class="tune-pill" id="tunePill">IN TUNE</div>
        </div>
      </div>

      <div class="section-label">Target Note</div>
      <div class="note-grid" id="noteGrid"></div>

      <div class="row">
        <div class="octave-card">
          <div class="oct-label">
            <span class="t">Octave</span>
            <span class="v" id="octValue">4 · 440.00 Hz</span>
          </div>
          <div class="stepper">
            <button id="octDown" aria-label="Octave down">&minus;</button>
            <div class="div"></div>
            <button id="octUp" aria-label="Octave up">+</button>
          </div>
        </div>
        <button class="tone-btn" id="toneBtn" aria-label="Play reference tone">
          <svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3 L7 7.5 H3 V14.5 H7 L12 19 Z" fill="currentColor" stroke="none"/>
            <path d="M16 7.5 A5 5 0 0 1 16 14.5"/>
            <path d="M19 4.5 A9.2 9.2 0 0 1 19 17.5"/>
          </svg>
        </button>
      </div>

      <div class="mic-area">
        <button class="mic-btn" id="micBtn">
          <span class="dot"></span>
          <span id="micLabel">Start Tuning</span>
        </button>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
</div>

<script src="tuner.js"></script>
</body>
</html>
