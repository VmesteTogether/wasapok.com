<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0806">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wasapok Castle — Wasapok Room</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=MedievalSharp&family=VT323&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0806;
    color: #d8c896;
    font-family: 'VT323', monospace;
    overscroll-behavior: none;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
  }

  /* ========== TITLE BAR ========== */
  #title {
    position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; z-index: 10;
    text-align: center; padding: 12px 16px 8px;
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: 14px; letter-spacing: 0.35em; text-transform: uppercase;
    color: #d4a64c;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    pointer-events: none;
  }
  #title small {
    display: block; margin-top: 2px;
    font-family: 'MedievalSharp', cursive;
    font-size: 11px; letter-spacing: 0.15em; color: #b8945a; text-transform: none;
  }

  /* ========== LIFE BAR (3 hearts) ========== */
  #life-bar {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0) + 52px);
    left: 16px;
    z-index: 11;
    display: flex;
    gap: 8px;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .heart {
    width: 30px; height: 30px;
    display: block;
    filter: drop-shadow(0 0 6px rgba(255, 60, 60, 0.65));
    transition: filter 0.25s ease, transform 0.25s ease, opacity 0.25s ease;
  }
  .heart svg { width: 100%; height: 100%; display: block; }
  .heart.lost {
    filter: grayscale(1) brightness(0.35) drop-shadow(0 0 2px rgba(0,0,0,0.7));
    transform: scale(0.82);
    opacity: 0.5;
  }

  /* ========== CHAMBER PROXIMITY MESSAGE ========== */
  #chamber-msg {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 12; pointer-events: none;
    font-family: 'VT323', monospace; font-size: 30px;
    color: #ffc24a; text-shadow: 0 0 12px rgba(255,140,30,0.45), 0 2px 6px rgba(0,0,0,0.9);
    letter-spacing: 0.08em; opacity: 0;
    transition: opacity 0.45s ease;
    white-space: nowrap;
  }
  #chamber-msg.show { opacity: 0.72; }

  #confirm-msg {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 12; pointer-events: none;
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: 28px; letter-spacing: 0.18em;
    color: #ffe070; text-shadow: 0 0 14px rgba(255,180,40,0.55), 0 2px 6px rgba(0,0,0,0.9);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.35s ease;
    white-space: nowrap;
  }
  #confirm-msg.show { opacity: 0.88; }

  /* ========== 3D NAV CROSS ========== */
  #nav-wrapper {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    perspective: 450px;
    z-index: 15;
    pointer-events: none;
  }
  #nav-glow {
    position: absolute;
    width: 220px; height: 220px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotateX(35deg);
    background: radial-gradient(ellipse at center, rgba(255,120,8,0.28) 0%, rgba(255,80,5,0.10) 48%, transparent 72%);
    border-radius: 50%;
    pointer-events: none;
    transition: background 0.45s ease;
  }
  #nav-glow.active { pointer-events: auto; cursor: pointer; }
  #nav-glow.darken-1 {
    background: radial-gradient(ellipse at center, rgba(200,90,12,0.26) 0%, rgba(170,60,8,0.10) 48%, transparent 72%);
  }
  #nav-glow.darken-2 {
    background: radial-gradient(ellipse at center, rgba(140,55,10,0.22) 0%, rgba(120,40,6,0.08) 48%, transparent 72%);
  }
  #nav-glow.darken-3 {
    background: radial-gradient(ellipse at center, rgba(80,30,8,0.18) 0%, rgba(60,20,5,0.05) 48%, transparent 72%);
  }
  #nav-cross {
    display: grid;
    grid-template-columns: 68px 68px 68px;
    grid-template-rows: 68px 68px 68px;
    gap: 5px;
    transform: rotateX(35deg);
    pointer-events: auto;
  }
  #nav-center {
    width: 68px; height: 68px;
    background: transparent;
  }
  .nav-arrow {
    width: 68px; height: 68px;
    padding: 5px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    filter: brightness(1) drop-shadow(0 0 5px rgba(255,80,5,0.45));
    transition: filter 55ms ease-out, transform 55ms ease-out;
  }
  .nav-arrow:active,
  .nav-arrow.active {
    transform: translateY(2px);
    filter: brightness(1.80) drop-shadow(0 0 18px rgba(255,155,20,0.95));
  }
  .nav-arrow svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* Sprint button */
  #sprint-wrap {
    position: fixed;
    bottom: 24px;
    right: 20px;
    z-index: 15;
    pointer-events: auto;
  }
  .action-btn {
    width: 68px; height: 68px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(80,40,16,0.95), rgba(20,12,8,0.95));
    border: 3px solid #d4a64c;
    color: #f0c878;
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px; letter-spacing: 0.15em;
    display: flex; align-items: center; justify-content: center;
    text-transform: uppercase;
    box-shadow:
      inset -2px -2px 0 rgba(0,0,0,0.45),
      inset  2px  2px 0 rgba(255,210,140,0.15),
      0 4px 0 #2a1808;
    cursor: pointer;
    transition: transform 60ms ease-out, box-shadow 60ms ease-out;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .action-btn:active, .action-btn.active {
    transform: translateY(3px);
    box-shadow:
      inset -2px -2px 0 rgba(0,0,0,0.45),
      inset  2px  2px 0 rgba(255,210,140,0.10),
      0 1px 0 #2a1808;
  }
  .action-btn.active { background: radial-gradient(circle at 30% 30%, rgba(150,80,30,1), rgba(60,30,15,1)); color: #fff5b0; }

  /* ========== LOADING ========== */
  #loading {
    position: fixed; inset: 0; z-index: 50; background: #0a0806;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 20px;
  }
  #loading .crest { width: 84px; height: 84px; }
  @keyframes pulse {
    0%,100% { box-shadow: inset 0 0 12px rgba(0,0,0,0.6), 0 0 0 0 rgba(212,166,76,0.4); }
    50%     { box-shadow: inset 0 0 12px rgba(0,0,0,0.6), 0 0 0 16px rgba(212,166,76,0); }
  }
  #loading .label {
    font-family: 'Cinzel', serif; letter-spacing: 0.3em;
    font-size: 12px; color: #d4a64c; text-transform: uppercase;
  }

  /* ========== LOOK-UP TILT ARROWS (flat, floating above the cross) ========== */
  #look-pad {
    position: fixed;
    bottom: 230px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex !important;
    gap: 110px;
    pointer-events: none;
  }
  .look-arrow {
    width: 32px; height: 32px;
    padding: 0;
    border: 2px solid #6a6f78;
    border-radius: 50%;
    background: rgba(20,22,26,0.18);
    cursor: pointer;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    filter: brightness(1) drop-shadow(0 0 5px rgba(150,158,170,0.45));
    transition: filter 55ms ease-out, transform 55ms ease-out;
  }
  .look-arrow:active,
  .look-arrow.active {
    transform: translateY(2px);
    filter: brightness(1.60) drop-shadow(0 0 14px rgba(190,200,215,0.85));
  }
  .look-arrow svg { display: none; }

  /* Desktop: a hint line */
  @media (min-width: 800px) {
    #title { font-size: 18px; }
    #help-desk {
      position: fixed; bottom: 18px; left: 18px; z-index: 11;
      padding: 8px 12px; font-family: 'Cinzel', serif; font-size: 11px;
      letter-spacing: 0.15em; color: #b8945a;
      background: rgba(10,8,6,0.7); border: 1px solid #4a3a28;
    }
    #nav-wrapper, #sprint-wrap { pointer-events: none; }
  }
  @media (max-width: 799px) {
    #help-desk { display: none; }
  }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="vignette"></div>
  <div id="damage-overlay" style="position:fixed;inset:0;pointer-events:none;z-index:6;background:#c80a0a;opacity:0;mix-blend-mode:multiply;"></div>

  <div id="life-bar" aria-hidden="true">
    <span class="heart"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8.2 3 4 7.2 4c2.1 0 3.6 1.3 4.8 3 1.2-1.7 2.7-3 4.8-3C20.9 4 23 8.2 21.5 11.7 19.5 16.4 12 21 12 21z" fill="#e63a3a" stroke="#7a0e0e" stroke-width="1.4"/></svg></span>
    <span class="heart"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8.2 3 4 7.2 4c2.1 0 3.6 1.3 4.8 3 1.2-1.7 2.7-3 4.8-3C20.9 4 23 8.2 21.5 11.7 19.5 16.4 12 21 12 21z" fill="#e63a3a" stroke="#7a0e0e" stroke-width="1.4"/></svg></span>
    <span class="heart"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8.2 3 4 7.2 4c2.1 0 3.6 1.3 4.8 3 1.2-1.7 2.7-3 4.8-3C20.9 4 23 8.2 21.5 11.7 19.5 16.4 12 21 12 21z" fill="#e63a3a" stroke="#7a0e0e" stroke-width="1.4"/></svg></span>
  </div>
  <div id="chamber-msg">you aren&rsquo;t ready to strap in yet</div>
  <div id="confirm-msg">Ow.</div>

  <div id="title">
    Wasapok Room
    <small>Beyond the Throne</small>
  </div>

  <div id="help-desk">
    W/S walk · A/D turn · Q/E strafe · SHIFT sprint
  </div>

  <svg style="display:none"><defs>
    <radialGradient id="ag" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb020" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
  </defs></svg>

  <!-- 3D perspective nav cross -->
  <div id="nav-wrapper">
    <div id="nav-glow"></div>
    <div id="nav-cross">
      <div></div>
      <button class="nav-arrow" id="dpad-up" aria-label="Forward">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="18" fill="url(#ag)"/>
          <path d="M32,5 L59,36 L44,36 L44,59 L20,59 L20,36 L5,36 Z"
            fill="rgba(6,3,0,0.18)" stroke="#bf4800" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M32,5 L32,59 M20,36 L44,36"
            fill="none" stroke="#bf4800" stroke-width="1" stroke-linecap="square" opacity="0.55"/>
        </svg>
      </button>
      <div></div>

      <button class="nav-arrow" id="dpad-left" aria-label="Turn left">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="18" fill="url(#ag)"/>
          <path d="M5,32 L36,5 L36,20 L59,20 L59,44 L36,44 L36,59 Z"
            fill="rgba(6,3,0,0.18)" stroke="#bf4800" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M5,32 L59,32 M36,20 L36,44"
            fill="none" stroke="#bf4800" stroke-width="1" stroke-linecap="square" opacity="0.55"/>
        </svg>
      </button>
      <div id="nav-center"></div>
      <button class="nav-arrow" id="dpad-right" aria-label="Turn right">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="18" fill="url(#ag)"/>
          <path d="M59,32 L28,5 L28,20 L5,20 L5,44 L28,44 L28,59 Z"
            fill="rgba(6,3,0,0.18)" stroke="#bf4800" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M59,32 L5,32 M28,20 L28,44"
            fill="none" stroke="#bf4800" stroke-width="1" stroke-linecap="square" opacity="0.55"/>
        </svg>
      </button>

      <div></div>
      <button class="nav-arrow" id="dpad-down" aria-label="Back">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="18" fill="url(#ag)"/>
          <path d="M32,59 L5,28 L20,28 L20,5 L44,5 L44,28 L59,28 Z"
            fill="rgba(6,3,0,0.18)" stroke="#bf4800" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M32,59 L32,5 M20,28 L44,28"
            fill="none" stroke="#bf4800" stroke-width="1" stroke-linecap="square" opacity="0.55"/>
        </svg>
      </button>
      <div></div>
    </div>
  </div>

  <!-- Tilt-look arrows: pitch up + slight side yaw to view ceilings/architecture. -->
  <div id="look-pad">
    <button class="look-arrow" id="dpad-upright" aria-label="Look up-right"></button>
    <button class="look-arrow" id="dpad-upleft" aria-label="Look up-left"></button>
  </div>

  <!-- Sprint button -->
  <div id="sprint-wrap">
    <button class="action-btn" id="dpad-sprint">RUN</button>
  </div>

  <div id="loading">
    <div class="crest"></div>
    <div class="label"></div>
  </div>
