<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0806">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wasapok Castle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=MedievalSharp&family=VT323&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0806;
    color: #d8c896;
    font-family: 'VT323', monospace;
    overscroll-behavior: none;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.55) 100%);
  }

  /* ========== TITLE BAR ========== */
  #title {
    position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; z-index: 10;
    text-align: center; padding: 12px 16px 8px;
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: 14px; letter-spacing: 0.35em; text-transform: uppercase;
    color: #d4a64c;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    pointer-events: none;
  }
  #title small {
    display: block; margin-top: 2px;
    font-family: 'MedievalSharp', cursive;
    font-size: 11px; letter-spacing: 0.15em; color: #b8945a; text-transform: none;
  }

  /* ========== MINIMAP ========== */
  #minimap-wrap {
    position: fixed; top: calc(env(safe-area-inset-top, 0) + 8px); right: 12px; z-index: 10;
    padding: 6px;
    background: rgba(10,8,6,0.85);
    border: 2px solid #4a3a28;
    box-shadow: 0 4px 14px rgba(0,0,0,0.6), inset 0 0 8px rgba(0,0,0,0.4);
    image-rendering: pixelated;
  }
  #minimap { image-rendering: pixelated; display: block; }

  /* ========== ROOM DISCOVERY ========== */
  #discover {
    position: fixed; left: 50%; top: 32%;
    transform: translate(-50%, -50%);
    z-index: 30; pointer-events: none;
    text-align: center; opacity: 0;
  }
  #discover.show { animation: discover-fade 3600ms ease-out forwards; }
  @keyframes discover-fade {
    0%   { opacity: 0; letter-spacing: 0.55em; transform: translate(-50%, -55%); }
    18%  { opacity: 1; letter-spacing: 0.40em; transform: translate(-50%, -50%); }
    78%  { opacity: 1; letter-spacing: 0.40em; }
    100% { opacity: 0; letter-spacing: 0.48em; transform: translate(-50%, -48%); }
  }
  #discover .rule {
    height: 2px; width: 220px; margin: 0 auto;
    background: linear-gradient(90deg, transparent, #d4a64c, transparent);
    image-rendering: pixelated;
  }
  #discover .pre {
    font-family: 'Cinzel', serif; font-weight: 500;
    font-size: 11px; letter-spacing: 0.5em; color: #d4a64c; opacity: 0.85;
    margin: 10px 0 6px; text-transform: uppercase;
  }
  #discover .name {
    font-family: 'MedievalSharp', cursive; font-weight: 700;
    font-size: 38px; letter-spacing: 0.10em;
    color: #f0e0b0;
    text-shadow: 0 0 12px rgba(0,0,0,1), 0 2px 0 #2a1808, 0 0 30px rgba(212,166,76,0.35);
    margin: 6px 0;
  }
  #discover .sub {
    font-family: 'Cinzel', serif; font-size: 12px; font-weight: 500;
    letter-spacing: 0.28em; color: #d4a64c; opacity: 0.9;
    text-transform: uppercase; margin-top: 8px;
  }

  /* ========== 3D NAV CROSS ========== */
  #nav-wrapper {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    perspective: 450px;
    z-index: 15;
    pointer-events: none;
  }
  #nav-glow {
    position: absolute;
    width: 220px; height: 220px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotateX(35deg);
    background: radial-gradient(ellipse at center, rgba(255,120,8,0.28) 0%, rgba(255,80,5,0.10) 48%, transparent 72%);
    border-radius: 50%;
    pointer-events: none;
  }
  #nav-cross {
    display: grid;
    grid-template-columns: 68px 68px 68px;
    grid-template-rows: 68px 68px 68px;
    gap: 5px;
    transform: rotateX(35deg);
    pointer-events: auto;
  }
  #nav-center {
    width: 68px; height: 68px;
    background: transparent;
  }
  .nav-arrow {
    width: 68px; height: 68px;
    padding: 5px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    filter: brightness(1) drop-shadow(0 0 5px rgba(255,80,5,0.45));
    transition: filter 55ms ease-out, transform 55ms ease-out;
  }
  .nav-arrow:active,
  .nav-arrow.active {
    transform: translateY(2px);
    filter: brightness(1.80) drop-shadow(0 0 18px rgba(255,155,20,0.95));
  }
  .nav-arrow svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* Sprint button */
  #sprint-wrap {
    position: fixed;
    bottom: 24px;
    right: 20px;
    z-index: 15;
    pointer-events: auto;
  }
  .action-btn {
    width: 68px; height: 68px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(80,40,16,0.95), rgba(20,12,8,0.95));
    border: 3px solid #d4a64c;
    color: #f0c878;
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px; letter-spacing: 0.15em;
    display: flex; align-items: center; justify-content: center;
    text-transform: uppercase;
    box-shadow:
      inset -2px -2px 0 rgba(0,0,0,0.45),
      inset  2px  2px 0 rgba(255,210,140,0.15),
      0 4px 0 #2a1808;
    cursor: pointer;
    transition: transform 60ms ease-out, box-shadow 60ms ease-out;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .action-btn:active, .action-btn.active {
    transform: translateY(3px);
    box-shadow:
      inset -2px -2px 0 rgba(0,0,0,0.45),
      inset  2px  2px 0 rgba(255,210,140,0.10),
      0 1px 0 #2a1808;
  }
  .action-btn.active { background: radial-gradient(circle at 30% 30%, rgba(150,80,30,1), rgba(60,30,15,1)); color: #fff5b0; }

  /* ========== WASAPOK PORTAL LAYER ========== */
  #portal-layer {
    position: fixed; inset: 0; z-index: 25;
    background: #000;
    opacity: 0; pointer-events: none;
    transition: opacity 260ms ease-out;
  }
  #portal-layer.fullscreen { z-index: 60; opacity: 1; }
  #portal-layer iframe {
    width: 100%; height: 100%; border: 0; display: block;
  }
  #portal-exit {
    position: fixed; top: env(safe-area-inset-top, 0); right: 12px; z-index: 65;
    padding: 10px 14px;
    background: rgba(20,16,12,0.92);
    color: #f0c878;
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 13px; letter-spacing: 0.2em;
    border: 2px solid #d4a64c;
    cursor: pointer;
    text-transform: uppercase;
    display: none;
    box-shadow: 0 4px 0 #2a1808;
  }
  #portal-layer.fullscreen ~ #portal-exit { display: block; }

  /* ========== LOADING ========== */
  #loading {
    position: fixed; inset: 0; z-index: 50; background: #0a0806;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 20px;
  }
  #loading .crest {
    width: 84px; height: 84px;
    border: 4px solid #d4a64c;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: #d4a64c;
    font-family: 'MedievalSharp', cursive; font-weight: 700; font-size: 44px;
    animation: pulse 1.6s ease-in-out infinite;
    box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
  }
  @keyframes pulse {
    0%,100% { box-shadow: inset 0 0 12px rgba(0,0,0,0.6), 0 0 0 0 rgba(212,166,76,0.4); }
    50%     { box-shadow: inset 0 0 12px rgba(0,0,0,0.6), 0 0 0 16px rgba(212,166,76,0); }
  }
  #loading .label {
    font-family: 'Cinzel', serif; letter-spacing: 0.3em;
    font-size: 12px; color: #d4a64c; text-transform: uppercase;
  }

  /* Desktop: a hint line */
  @media (min-width: 800px) {
    #title { font-size: 18px; }
    #help-desk {
      position: fixed; bottom: 18px; left: 18px; z-index: 11;
      padding: 8px 12px; font-family: 'Cinzel', serif; font-size: 11px;
      letter-spacing: 0.15em; color: #b8945a;
      background: rgba(10,8,6,0.7); border: 1px solid #4a3a28;
    }
    /* Nav cross and sprint non-interactive on desktop — keyboard is primary */
    #nav-wrapper, #sprint-wrap { pointer-events: none; }
  }
  @media (max-width: 799px) {
    #help-desk { display: none; }
  }
</style>
</head>
<template id="__bundler_thumbnail" data-bg-color="#0a0806">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0a0806"/>
    <!-- castle silhouette -->
    <path d="M200 700 L200 380 L260 380 L260 320 L320 320 L320 380 L420 380 L420 280 L520 280 L520 380 L620 380 L620 320 L680 320 L680 380 L740 380 L740 280 L840 280 L840 380 L1000 380 L1000 700 Z" fill="#2a2520"/>
    <!-- crenellations -->
    <g fill="#3a3530">
      <rect x="220" y="370" width="20" height="20"/>
      <rect x="260" y="370" width="20" height="20"/>
      <rect x="940" y="370" width="20" height="20"/>
      <rect x="980" y="370" width="20" height="20"/>
    </g>
    <!-- big door arch -->
    <path d="M540 700 L540 540 Q540 460 600 460 Q660 460 660 540 L660 700 Z" fill="#1a0e08"/>
    <!-- portal glow inside arch -->
    <circle cx="600" cy="570" r="50" fill="#6090ff" opacity="0.7"/>
    <circle cx="600" cy="570" r="22" fill="#cce0ff" opacity="0.85"/>
    <!-- torches -->
    <g fill="#ff9a40">
      <ellipse cx="510" cy="600" rx="10" ry="22"/>
      <ellipse cx="690" cy="600" rx="10" ry="22"/>
    </g>
    <!-- title -->
    <text x="600" y="180" text-anchor="middle" fill="#d4a64c" font-family="Cinzel, serif" font-weight="700" font-size="64" letter-spacing="20">WASAPOK</text>
    <text x="600" y="240" text-anchor="middle" fill="#b8945a" font-family="Cinzel, serif" font-size="28" letter-spacing="14">CASTLE</text>
  </svg>
</template>
<body>
  <div id="game"></div>
  <div id="vignette"></div>

  <div id="title">
    Wasapok Castle
    <small>A medieval crawl</small>
  </div>

  <div id="minimap-wrap"><canvas id="minimap" width="140" height="120"></canvas></div>

  <div id="discover">
    <div class="rule"></div>
    <div class="pre">Area Discovered</div>
    <div class="name" id="discover-name">—</div>
    <div class="sub" id="discover-sub"></div>
    <div class="rule"></div>
  </div>

  <div id="help-desk">
    W/S walk · A/D turn · Q/E strafe · SHIFT sprint
  </div>

  <svg style="display:none"><defs>
    <radialGradient id="ag" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb020" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
  </defs></svg>

  <!-- 3D perspective nav cross — bottom center -->
  <div id="nav-wrapper">
    <div id="nav-glow"></div>
    <div id="nav-cross">

      <!-- row 1: up arrow -->
      <div></div>
      <button class="nav-arrow" id="dpad-up" aria-label="Forward">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="18" fill="url(#ag)"/>
          <path d="M32,5 L59,36 L44,36 L44,59 L20,59 L20,36 L5,36 Z"
            fill="rgba(6,3,0,0.18)" stroke="#bf4800" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M32,5 L32,59 M20,36 L44,36"
            fill="none" stroke="#bf4800" stroke-width="1" stroke-linecap="square" opacity="0.55"/>
        </svg>
      </button>
      <div></div>

      <!-- row 2: left · center · right -->
      <button class="nav-arrow" id="dpad-left" aria-label="Turn left">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="18" fill="url(#ag)"/>
          <path d="M5,32 L36,5 L36,20 L59,20 L59,44 L36,44 L36,59 Z"
            fill="rgba(6,3,0,0.18)" stroke="#bf4800" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M5,32 L59,32 M36,20 L36,44"
            fill="none" stroke="#bf4800" stroke-width="1" stroke-linecap="square" opacity="0.55"/>
        </svg>
      </button>
      <div id="nav-center"></div>
      <button class="nav-arrow" id="dpad-right" aria-label="Turn right">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="18" fill="url(#ag)"/>
          <path d="M59,32 L28,5 L28,20 L5,20 L5,44 L28,44 L28,59 Z"
            fill="rgba(6,3,0,0.18)" stroke="#bf4800" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M59,32 L5,32 M28,20 L28,44"
            fill="none" stroke="#bf4800" stroke-width="1" stroke-linecap="square" opacity="0.55"/>
        </svg>
      </button>

      <!-- row 3: down arrow -->
      <div></div>
      <button class="nav-arrow" id="dpad-down" aria-label="Back">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="18" fill="url(#ag)"/>
          <path d="M32,59 L5,28 L20,28 L20,5 L44,5 L44,28 L59,28 Z"
            fill="rgba(6,3,0,0.18)" stroke="#bf4800" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M32,59 L32,5 M20,28 L44,28"
            fill="none" stroke="#bf4800" stroke-width="1" stroke-linecap="square" opacity="0.55"/>
        </svg>
      </button>
      <div></div>

    </div>
  </div>

  <!-- Sprint button — bottom right, independent of cross -->
  <div id="sprint-wrap">
    <button class="action-btn" id="dpad-sprint">RUN</button>
  </div>

  <!-- Wasapok portal overlay -->
  <div id="portal-layer">
    <iframe id="wasapok-frame"
      title="Wasapok"
      allow="autoplay; fullscreen; gyroscope; xr-spatial-tracking; accelerometer; camera; microphone"
      referrerpolicy="no-referrer-when-downgrade"
      loading="lazy"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-pointer-lock"
    ></iframe>
  </div>
  <button id="portal-exit">✕ Exit Portal</button>

  <div id="loading">
    <div class="crest">W</div>
    <div class="label">Entering the castle…</div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

</body>
</html>
