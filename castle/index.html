<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8aaabf">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wasapok Castle — Grounds</title>
<link rel="preload" href="/fonts/technicality.ttf" as="font" type="font/ttf" crossorigin>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=MedievalSharp&family=VT323&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #8aaabf;
    color: #d8c896;
    font-family: 'VT323', monospace;
    overscroll-behavior: none;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.35) 100%);
  }

  /* ========== TITLE BAR ========== */
  @font-face { font-family: 'Technicality'; src: url('/fonts/technicality.ttf') format('truetype'); font-display: swap; }
  #title {
    position: fixed; top: env(safe-area-inset-top, 0); left: 0; right: 0; z-index: 10;
    text-align: center; padding: 12px 16px 8px;
    font-family: 'Cinzel', serif; font-weight: 700;
    font-size: 14px; letter-spacing: 0.35em; text-transform: uppercase;
    color: #f0e0b0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.9);
    pointer-events: none;
  }
  #title small {
    display: block; margin-top: 2px;
    font-family: 'MedievalSharp', cursive;
    font-size: 11px; letter-spacing: 0.15em; color: #e2d29c; text-transform: none;
  }

  /* ========== 3D NAV CROSS ========== */
  #nav-wrapper {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    perspective: 450px;
    z-index: 15;
    pointer-events: none;
  }
  #nav-glow {
    position: absolute;
    width: 220px; height: 220px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotateX(35deg);
    background: radial-gradient(ellipse at center, rgba(255,120,8,0.28) 0%, rgba(255,80,5,0.10) 48%, transparent 72%);
    border-radius: 50%;
    pointer-events: none;
  }
  #nav-cross {
    display: grid;
    grid-template-columns: 68px 68px 68px;
    grid-template-rows: 68px 68px 68px;
    gap: 5px;
    transform: rotateX(35deg);
    pointer-events: auto;
  }
  #nav-center {
    width: 68px; height: 68px;
    background: transparent;
  }
  .nav-arrow {
    width: 68px; height: 68px;
    padding: 5px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    filter: brightness(1) drop-shadow(0 0 5px rgba(255,80,5,0.45));
    transition: filter 55ms ease-out, transform 55ms ease-out;
  }
  .nav-arrow:active,
  .nav-arrow.active {
    transform: translateY(2px);
    filter: brightness(1.80) drop-shadow(0 0 18px rgba(255,155,20,0.95));
  }
  .nav-arrow svg { display: block; width: 100%; height: 100%; overflow: visible; }

  /* Sprint button */
  #sprint-wrap {
    position: fixed;
    bottom: 24px;
    right: 20px;
    z-index: 15;
    pointer-events: auto;
  }
  .action-btn {
    width: 68px; height: 68px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(80,40,16,0.95), rgba(20,12,8,0.95));
    border: 3px solid #d4a64c;
    color: #f0c878;
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 12px; letter-spacing: 0.15em;
    display: flex; align-items: center; justify-content: center;
    text-transform: uppercase;
    box-shadow:
      inset -2px -2px 0 rgba(0,0,0,0.45),
      inset  2px  2px 0 rgba(255,210,140,0.15),
      0 4px 0 #2a1808;
    cursor: pointer;
    transition: transform 60ms ease-out, box-shadow 60ms ease-out;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .action-btn:active, .action-btn.active {
    transform: translateY(3px);
    box-shadow:
      inset -2px -2px 0 rgba(0,0,0,0.45),
      inset  2px  2px 0 rgba(255,210,140,0.10),
      0 1px 0 #2a1808;
  }
  .action-btn.active { background: radial-gradient(circle at 30% 30%, rgba(150,80,30,1), rgba(60,30,15,1)); color: #fff5b0; }

  /* ========== LOADING ========== */
  #loading {
    position: fixed; inset: 0; z-index: 50; background: #0a0806;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 20px;
  }
  #loading .crest { width: 84px; height: 84px; }
  @keyframes pulse {
    0%,100% { box-shadow: inset 0 0 12px rgba(0,0,0,0.6), 0 0 0 0 rgba(212,166,76,0.4); }
    50%     { box-shadow: inset 0 0 12px rgba(0,0,0,0.6), 0 0 0 16px rgba(212,166,76,0); }
  }
  #loading .label {
    font-family: 'Cinzel', serif; letter-spacing: 0.3em;
    font-size: 12px; color: #d4a64c; text-transform: uppercase;
  }

  /* ========== LOOK-UP TILT ARROWS (flat, floating above the cross) ========== */
  #look-pad {
    position: fixed;
    bottom: 230px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex !important;
    gap: 110px;
    pointer-events: none;
  }
  .look-arrow {
    width: 32px; height: 32px;
    padding: 0;
    border: 2px solid #6a6f78;
    border-radius: 50%;
    background: rgba(20,22,26,0.18);
    cursor: pointer;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    filter: brightness(1) drop-shadow(0 0 5px rgba(150,158,170,0.45));
    transition: filter 55ms ease-out, transform 55ms ease-out;
  }
  .look-arrow:active,
  .look-arrow.active {
    transform: translateY(2px);
    filter: brightness(1.60) drop-shadow(0 0 14px rgba(190,200,215,0.85));
  }
  .look-arrow svg { display: none; }

  /* Desktop: a hint line */
  @media (min-width: 800px) {
    #title { font-size: 18px; }
    #help-desk {
      position: fixed; bottom: 18px; left: 18px; z-index: 11;
      padding: 8px 12px; font-family: 'Cinzel', serif; font-size: 11px;
      letter-spacing: 0.15em; color: #2a3548;
      background: rgba(255,255,255,0.55); border: 1px solid #6a7888;
    }
    #nav-wrapper, #sprint-wrap { pointer-events: none; }
  }
  @media (max-width: 799px) {
    #help-desk { display: none; }
  }
</style>
</head>
<body>
  <div id="game"></div>
  <div id="vignette"></div>

  <div id="title">
    Eskleodrome
  </div>

  <div id="help-desk">
    W/S walk · A/D turn · Q/E strafe · SHIFT sprint · approach the door
  </div>

  <svg style="display:none"><defs>
    <radialGradient id="ag" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb020" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#ffb020" stop-opacity="0"/>
    </radialGradient>
  </defs></svg>

  <!-- 3D perspective nav cross — bottom center -->
  <div id="nav-wrapper">
    <div id="nav-glow"></div>
    <div id="nav-cross">

      <!-- row 1: up arrow -->
      <div></div>
      <button class="nav-arrow" id="dpad-up" aria-label="Forward">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="18" fill="url(#ag)"/>
          <path d="M32,5 L59,36 L44,36 L44,59 L20,59 L20,36 L5,36 Z"
            fill="rgba(6,3,0,0.18)" stroke="#bf4800" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M32,5 L32,59 M20,36 L44,36"
            fill="none" stroke="#bf4800" stroke-width="1" stroke-linecap="square" opacity="0.55"/>
        </svg>
      </button>
      <div></div>

      <!-- row 2: left · center · right -->
      <button class="nav-arrow" id="dpad-left" aria-label="Turn left">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="18" fill="url(#ag)"/>
          <path d="M5,32 L36,5 L36,20 L59,20 L59,44 L36,44 L36,59 Z"
            fill="rgba(6,3,0,0.18)" stroke="#bf4800" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M5,32 L59,32 M36,20 L36,44"
            fill="none" stroke="#bf4800" stroke-width="1" stroke-linecap="square" opacity="0.55"/>
        </svg>
      </button>
      <div id="nav-center"></div>
      <button class="nav-arrow" id="dpad-right" aria-label="Turn right">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="18" fill="url(#ag)"/>
          <path d="M59,32 L28,5 L28,20 L5,20 L5,44 L28,44 L28,59 Z"
            fill="rgba(6,3,0,0.18)" stroke="#bf4800" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M59,32 L5,32 M28,20 L28,44"
            fill="none" stroke="#bf4800" stroke-width="1" stroke-linecap="square" opacity="0.55"/>
        </svg>
      </button>

      <!-- row 3: down arrow -->
      <div></div>
      <button class="nav-arrow" id="dpad-down" aria-label="Back">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <circle cx="32" cy="32" r="18" fill="url(#ag)"/>
          <path d="M32,59 L5,28 L20,28 L20,5 L44,5 L44,28 L59,28 Z"
            fill="rgba(6,3,0,0.18)" stroke="#bf4800" stroke-width="2" stroke-linejoin="miter"/>
          <path d="M32,59 L32,5 M20,28 L44,28"
            fill="none" stroke="#bf4800" stroke-width="1" stroke-linecap="square" opacity="0.55"/>
        </svg>
      </button>
      <div></div>

    </div>
  </div>

  <!-- Tilt-look arrows: pitch up + slight side yaw to view ceilings/sky. -->
  <div id="look-pad">
    <button class="look-arrow" id="dpad-upright" aria-label="Look up-right"></button>
    <button class="look-arrow" id="dpad-upleft" aria-label="Look up-left"></button>
  </div>

  <!-- Sprint button — bottom right -->
  <div id="sprint-wrap">
    <button class="action-btn" id="dpad-sprint">RUN</button>
  </div>

  <div id="loading">
    <div class="crest"></div>
    <div class="label"></div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module" src="outside/main.js?v=78"></script>
  <script type="module" src="loading-diamond.js"></script>
  <script>
    // Arriving at the grounds from /newhome → a white "you've made it across"
    // message that fades in, holds, then disappears. (Internal castle nav won't match.)
    if (document.referrer.includes('/newhome')) {
      const show = () => {
        const el = document.createElement('div');
        el.style.cssText = 'position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;' +
          "color:#fff;font:400 clamp(20px,4.4vw,40px) 'Courier New',monospace;letter-spacing:0.06em;text-align:center;padding:0 7vw;" +
          'pointer-events:none;text-shadow:0 2px 11px rgba(0,0,0,0.8);transform:scale(1.12,1.6);opacity:0;transition:opacity 1s ease;';
        const wrap = document.createElement('div');
        wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:0.3em;';
        // each line = a faded base + a full-opacity copy masked to a razor-thin band at the letters' middle
        const band = 'calc(50% - 0.75px)', band2 = 'calc(50% + 0.75px)';
        const mask = 'linear-gradient(transparent ' + band + ',#000 ' + band + ',#000 ' + band2 + ',transparent ' + band2 + ')';
        for (const t of ["you've made it", "across"]) {
          const ln = document.createElement('div'); ln.style.cssText = 'position:relative;white-space:nowrap;';
          const base = document.createElement('span'); base.textContent = t; base.style.opacity = '0.5';
          const sharp = document.createElement('span'); sharp.textContent = t;
          sharp.style.cssText = 'position:absolute;left:0;top:0;-webkit-mask:' + mask + ';mask:' + mask + ';';
          ln.append(base, sharp); wrap.append(ln);
        }
        el.appendChild(wrap);
        document.body.appendChild(el);
        requestAnimationFrame(() => { el.style.opacity = '1'; });
        setTimeout(() => { el.style.opacity = '0'; }, 3200);
        setTimeout(() => { el.remove(); }, 4400);
        // Independently fade the Eskleodrome title out a few seconds after the message's
        // full run (~4.4s) — its own timer, not tied to the message element.
        const title = document.getElementById('title');
        if (title) { title.style.transition = 'opacity 1.2s ease'; setTimeout(() => { title.style.opacity = '0'; }, 7400); }
      };
      const ld = document.getElementById('loading');
      // Fires the instant the loading screen STARTS fading out (inline opacity set to '0'),
      // so the message appears right as the grounds resolve from black — not after.
      const done = () => !ld || !document.body.contains(ld) || ld.style.opacity === '0' || getComputedStyle(ld).display === 'none';
      (function wait() { done() ? show() : setTimeout(wait, 60); })();
    }
  </script>
</body>
</html>
