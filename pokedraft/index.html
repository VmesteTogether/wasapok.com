<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pokédraft</title>
<meta name="description" content="Feed in up to 30 favourite Pokémon and Pokédraft forges the best possible teams of six — ranked, with full defensive coverage and team stats, in Competitive or Game-Ready mode.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokédraft">
<meta name="theme-color" content="#070a0e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='12' y='12' width='30' height='30' rx='5' fill='none' stroke='%2335e6ff' stroke-width='7'/><rect x='58' y='12' width='30' height='30' rx='5' fill='none' stroke='%2335e6ff' stroke-width='7'/><rect x='35' y='58' width='30' height='30' rx='5' fill='%2335e6ff'/></svg>">
</head>
<body>

<div class="phone-wrap" id="phoneWrap">
  <div class="phone" id="phone">

    <div class="amb grid-bg" aria-hidden="true"></div>
    <div class="amb hexwash" aria-hidden="true"></div>
    <div class="amb scanlines" aria-hidden="true"></div>
    <div class="amb vignette" aria-hidden="true"></div>
    <div class="amb sweep" aria-hidden="true"></div>

    <!-- drawn status bar (browser preview; hidden in standalone) -->
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span class="sb-right">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 12 L11.2 8.8 A4.4 4.4 0 0 0 5.8 8.8 Z"/><path d="M3.6 6.2 A7.4 7.4 0 0 1 13.4 6.2 L15.4 3.9 A10.4 10.4 0 0 0 1.6 3.9 Z" opacity="0.95"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" stroke-opacity="0.5"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25.5 4.5 V8.5 A2.2 2.2 0 0 0 25.5 4.5Z" fill="currentColor" fill-opacity="0.5"/></svg>
      </span>
    </div>

    <header class="hud-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>POKÉDRAFT</h1>
          <span class="brand-sub">TEAM&nbsp;FORGE&nbsp;//&nbsp;COMPETITIVE&nbsp;DRAFTER</span>
        </div>
      </div>
      <div class="sysreadout" title="Pool size">
        <span class="sys-dot" aria-hidden="true"></span>
        <span class="sys-label">POOL</span>
        <span class="sys-count"><b id="poolCount">0</b>/30</span>
      </div>
    </header>

    <!-- ============ POOL BUILDER ============ -->
    <section class="view view-pool active" id="viewPool">
      <div class="pool-intro" id="poolIntro">
        <p>Add your favourite Pokémon — up to <b>30</b>. Pokédraft forges the strongest teams of six it can build from them, ranked best to worst. <b>Lock</b> any you want in every team.</p>
      </div>
      <div class="search-bar">
        <span class="sb-glyph" aria-hidden="true"></span>
        <input id="searchInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ADD A POKÉMON — NAME / NO.">
        <button class="sb-clear" id="searchClear" type="button" aria-label="Clear">&times;</button>
      </div>
      <div class="results" id="results"></div>
      <div class="pool-wrap" id="poolWrap">
        <div class="pool-head"><span>YOUR POOL <b id="poolHeadCount">0</b></span><button class="pool-clear" id="poolClear" type="button">CLEAR</button></div>
        <div class="pool-grid" id="poolGrid"></div>
      </div>
      <button class="forge-btn" id="forgeBtn" type="button" disabled>
        <span class="fb-label">FORGE TEAMS</span><span class="fb-sub" id="forgeSub">add 2+ units</span><span class="fb-arw">▸</span>
      </button>
    </section>

    <!-- ============ RESULTS (ranked teams) ============ -->
    <section class="view view-results" id="viewResults">
      <div class="res-bar">
        <button class="rb-back" id="resBack" type="button">‹ POOL</button>
        <div class="mode-toggle" id="modeToggle" role="tablist">
          <button class="mt-opt sel" data-mode="comp" type="button">COMPETITIVE</button>
          <button class="mt-opt" data-mode="game" type="button">GAME-READY</button>
        </div>
      </div>
      <div class="mode-note" id="modeNote"></div>
      <div class="team-list" id="teamList"></div>
    </section>

    <!-- ============ TEAM DETAIL ============ -->
    <section class="view view-team" id="viewTeam">
      <div class="res-bar">
        <button class="rb-back" id="teamBack" type="button">‹ TEAMS</button>
        <div class="team-rankbadge" id="teamRankBadge"></div>
      </div>
      <div class="team-hero" id="teamHero"></div>
      <div class="tabs" id="tabs">
        <button class="tab sel" data-tab="coverage" type="button">COVERAGE</button>
        <button class="tab" data-tab="roster" type="button">ROSTER</button>
        <button class="tab" data-tab="stats" type="button">STATS</button>
      </div>
      <div class="tab-body" id="tabBody"></div>
    </section>

    <div class="home-indicator"></div>
  </div>
</div>

<button class="fit-toggle" id="fitToggle" type="button" aria-label="Fill the screen" title="Fill the screen">
  <svg class="ic-expand" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6 V2 H6 M16 6 V2 H12 M2 12 V16 H6 M16 12 V16 H12"/></svg>
  <svg class="ic-compress" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6 H6 V2 M16 6 H12 V2 M2 12 H6 V16 M16 12 H12 V16"/></svg>
</button>

<script src="app.js"></script>
<script>
  (() => {
    const AR_W = 390, AR_H = 844, KEY = "pokedraft-fillscreen";
    const wrap = document.getElementById("phoneWrap"), btn = document.getElementById("fitToggle");
    const fit = () => {
      if (!document.body.classList.contains("fs")) { wrap.style.transform = ""; return; }
      const vv = window.visualViewport, vw = vv ? vv.width : innerWidth, vh = vv ? vv.height : innerHeight;
      const s = Math.min(vw / AR_W, vh / AR_H);
      wrap.style.transform = "translate(" + (vw - AR_W) / 2 + "px," + (vh - AR_H) / 2 + "px) scale(" + s + ")";
    };
    const setFS = (on, { native = false, persist = true } = {}) => {
      document.body.classList.toggle("fs", on); fit();
      if (persist) { try { localStorage.setItem(KEY, on ? "1" : "0"); } catch {} }
      if (native) { try { const el = document.documentElement;
        if (on && el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen(); } catch {} }
    };
    btn.addEventListener("click", () => setFS(!document.body.classList.contains("fs"), { native: true }));
    addEventListener("resize", fit); addEventListener("orientationchange", fit);
    if (window.visualViewport) visualViewport.addEventListener("resize", fit);
    const standalone = navigator.standalone === true || (matchMedia && matchMedia("(display-mode: standalone)").matches);
    if (standalone) document.body.classList.add("standalone");
    else { let s = "0"; try { s = localStorage.getItem(KEY) || "0"; } catch {} if (s === "1") setFS(true, { persist: false }); }
  })();
</script>
</body>
</html>
