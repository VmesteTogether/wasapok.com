<style>
/* ────────────────────────────────────────────────────────────────
   PDF MERGER · hydraulic document press
   Family design language: navy-deep header bar, condensed uppercase,
   gold hard-offset shadows, chalk-light page, pixel accents.
   ──────────────────────────────────────────────────────────────── */

/* ── EARTH & GOO PALETTE ─────────────────────────────────────────
   Light: sun-baked paper + deep-pine chrome, tuned to the machine's
   dirt, sand, sage piping and candy goo. Dark: forest-night cave.
   Restyled for VmesteSoft; see soft/DESIGN_SPEC.md.
/* ── WORKBENCH LAYOUT — machine left, controls right ── */
.workbench {
  max-width: 1080px;
  margin: 26px auto 0;
  padding: 0 20px;
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(300px, 0.85fr);
  gap: 20px 44px;   /* wide gutter: the feed pipe rises through it */
  align-items: start;
  position: relative;   /* anchors the feed-pipe overlay */
}
.side {
  display: flex;
  flex-direction: column;
  gap: 18px;
  min-width: 0;
}

/* feed pipe: lives in the BACKGROUND, behind every card */
#connector {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: visible;
  z-index: 0;
}
.side, .machine-card { z-index: 1; }
.side { position: relative; }

.card {
  background: var(--tar);
  border: 1px solid var(--line);
  border-radius: 0;
  transition: background 0.2s, border-color 0.2s;
}

/* ── DROPBOX ── */
#dz {
  border: 2px dashed var(--line);
  border-radius: 0;
  padding: 26px 18px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.1s, box-shadow 0.12s;
  background: var(--pit);
}
#dz:hover, .drop-card.drag-over #dz {
  border-color: var(--acid);
  background: rgba(200,168,75,0.10);
}
#dz .dz-icon { display: block; margin: 0 auto 10px; }
#dz .dz-big {
  display: block;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 700;
  letter-spacing: 3px; text-transform: uppercase;
  color: var(--bone);
}
#dz .dz-small {
  display: block;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 600;
  letter-spacing: 2px; text-transform: uppercase;
  color: var(--ash);
  margin-top: 6px;
  animation: dz-breathe 2.4s ease-in-out infinite;
}
@keyframes dz-breathe { 50% { opacity: 0.5; } }

/* ── MACHINE ── */
.machine-card { position: relative; order: -1; }  /* left column; DOM keeps dropzone first */
.machine-card.drag-over #machine { outline: 3px dashed var(--acid); outline-offset: -3px; }
.machine-wrap { position: relative; }
#machine {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 0;
  touch-action: none;
}

/* floating filename tooltip over the canvas */
#blobTip {
  position: absolute;
  background: var(--house);
  border: 2px solid var(--acid);
  box-shadow: 3px 3px 0 var(--acid-dim);
  color: var(--bone);
  font-size: 12.5px;
  padding: 6px 10px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.1s;
  z-index: 30;
  max-width: 260px;
  line-height: 1.4;
}
#blobTip .tip-label {
  display: block;
  font-family: var(--mono);
  font-size: 7px; letter-spacing: 1px;
  color: var(--acid);
  margin-bottom: 3px; text-transform: uppercase;
}
#blobTip .tip-name { display: block; word-break: break-all; font-weight: 700; }
#blobTip .tip-meta { display: block; color: var(--ash); font-size: 11.5px; margin-top: 2px; }
#blobTip.show { opacity: 1; }

/* ── CONTROL PANEL ── */
.panel-card { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.panel-card[hidden] { display: none; }

/* file rows */
#fileList { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.file-row {
  display: flex; align-items: center; gap: 9px;
  background: var(--tar);
  border: 1px solid var(--line);
  border-radius: 0;
  padding: 7px 9px;
  cursor: grab;
  user-select: none;
  transition: border-color 0.12s, background 0.12s, opacity 0.12s;
}
.file-row:hover { background: var(--slab); }
.file-row:active { cursor: grabbing; }
.file-row.dragging { opacity: 0.35; }
.file-row.drag-target { border-color: var(--acid); box-shadow: 2px 2px 0 var(--acid); }
.file-row.pressed-row { border-style: dashed; opacity: 0.75; }

.row-chip {
  width: 18px; height: 18px; flex-shrink: 0;
  border-radius: 0;
  border: 2px solid rgba(0,0,0,0.25);
  position: relative;
}
.row-idx {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--ash);
  width: 16px; text-align: center; flex-shrink: 0;
}
.row-info { flex: 1; min-width: 0; }
.row-name {
  font-size: 13px; font-weight: 700; color: var(--bone);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row-meta { font-size: 11.5px; color: var(--ash); margin-top: 1px; }

.row-btns { display: flex; gap: 2px; flex-shrink: 0; }
.row-btn {
  background: none; border: 1px solid transparent;
  color: var(--ash);
  width: 22px; height: 22px;
  font-size: 11px; line-height: 1;
  cursor: pointer; border-radius: 0;
  display: grid; place-items: center;
  transition: color 0.12s, border-color 0.12s, background 0.12s;
}
.row-btn:hover, .row-btn:focus-visible { color: var(--bone); border-color: var(--line); background: var(--slab); }
.row-btn.rm:hover, .row-btn.rm:focus-visible { color: #FF4A2B; border-color: #FF4A2B; }
.row-btn:disabled { opacity: 0.25; cursor: default; }
.row-btn:disabled:hover { color: var(--ash); border-color: transparent; background: none; }

/* output title */
.title-box {
  display: flex; align-items: center;
  background: var(--tar);
  border: 1px solid var(--line);
  border-radius: 0;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.title-box:focus-within { border-color: var(--acid); box-shadow: 2px 2px 0 var(--acid); }
#titleInput {
  flex: 1; min-width: 0;
  background: none; border: none; outline: none;
  padding: 9px 12px;
  color: var(--bone);
  font-family: 'Barlow', sans-serif;
  font-size: 14px; font-weight: 500;
}
.title-ext { color: var(--ash); font-size: 13px; padding-right: 12px; }

/* the big press button */
.press-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 21px; font-weight: 800;
  letter-spacing: 4px; text-transform: uppercase;
  padding: 13px 10px;
  width: 100%;
  background: var(--acid);
  color: var(--void);
  border: 2px solid var(--void);
  border-radius: 0;
  box-shadow: 4px 4px 0 var(--acid-dim);
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s, background 0.12s;
}
.press-btn:hover:not(:disabled) { background: #FFDD66; transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--acid-dim); }
.press-btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--acid-dim); }
.press-btn:focus-visible { outline: 2px solid var(--acid-dim); outline-offset: 3px; }
.press-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: 2px 2px 0 rgba(0,0,0,0.25); }

/* the payoff: a glass tank of pressed-document goo — it boils on hover */
.dl-btn {
  position: relative;
  display: block;
  overflow: hidden;
  text-align: center;
  text-decoration: none;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 23px; font-weight: 800;
  letter-spacing: 3px; text-transform: uppercase;
  padding: 16px 12px;
  background: rgba(255, 253, 246, 0.45);
  color: var(--void);
  border: 2px solid var(--void);
  border-radius: 0;
  box-shadow: 4px 4px 0 #193830;
  cursor: pointer;
  overflow-wrap: anywhere;
  animation: dl-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  transition: transform 0.08s, box-shadow 0.08s;
}

.dl-btn:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 #193830; }
.dl-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #193830; }
.dl-btn:focus-visible { outline: 2px solid var(--acid-dim); outline-offset: 3px; }
.dl-btn[hidden] { display: none; }
#dlGooCvs {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.dl-btn span {
  position: relative;
  z-index: 1;
  text-shadow: 0 0 6px rgba(255,255,255,0.85), 0 0 2px rgba(255,255,255,0.95);
}

@keyframes dl-pop {
  0%   { transform: scale(0.5); }
  60%  { transform: scale(1.07); }
  100% { transform: scale(1); }
}
@media (prefers-reduced-motion: reduce) {
  .dl-btn { animation: none; }
}

.clear-btn {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 14px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 8px;
  width: 100%;
  background: none;
  color: var(--ash);
  border: 1px solid var(--line);
  border-radius: 0;
  cursor: pointer;
  transition: color 0.12s, border-color 0.12s;
}
.clear-btn:hover, .clear-btn:focus-visible { color: #FF4A2B; border-color: #FF4A2B; }

/* status chip */
#status {
  font-size: 13px; font-weight: 500;
  padding: 10px 12px;
  border-radius: 0;
  display: none;
  line-height: 1.45;
}
#status.info    { display: block; background: rgba(58,110,168,0.12);  border: 1px solid var(--line-hi);  color: var(--bone); }
#status.success { display: block; background: rgba(26,94,56,0.12);   border: 1px solid var(--acid); color: var(--acid); }
#status.error   { display: block; background: rgba(138,26,26,0.10);  border: 1px solid var(--rust);   color: var(--rust); }


#status a { color: inherit; font-weight: 700; }

#fileInput { display: none; }

@media (max-width: 880px) {
  .workbench { grid-template-columns: 1fr; }
  .machine-card { order: 0; }  /* controls first on small screens */

  /* the page must stay scrollable by touch: vertical drags pan,
     horizontal drags still grab and throw the goo */
  #machine { touch-action: pan-y; }
  .press-btn { font-size: 19px; letter-spacing: 3px; }
  .dl-btn { font-size: 19px; letter-spacing: 2px; }
  /* finger-sized queue controls */
  .row-btn { width: 34px; height: 34px; font-size: 14px; }
  .file-row { padding: 8px 9px; }
  #titleInput { padding: 12px; font-size: 15px; }
}
@media (max-width: 480px) {

  .workbench { padding: 0 12px; }
}

@media (prefers-reduced-motion: reduce) {

  #dz .dz-small { animation: none; }
}

.workbench { max-width: var(--maxw); margin: 0 auto; padding: 0 var(--gutter) 80px; }

.card { background: var(--tar); border: 1px solid var(--line); border-radius: 0; box-shadow: none; }

/* ── drop zone ── */
#dz {
  background: var(--pit); border: 1px dashed var(--line); border-radius: 0;
  min-height: 180px; padding: 32px 20px;
}
#dz:hover { border-color: var(--line-hi); background: var(--pit); }
.drop-card.drag-over #dz {
  border-style: solid; border-color: var(--acid); background: var(--pit);
  background-image: repeating-linear-gradient(45deg,
    rgba(0,184,113,0.10) 0 4px, transparent 4px 8px);
  background-size: 11.32px 11.32px;
  animation: hazard-crawl 800ms linear infinite;
}
.drop-card.drag-over #dz .dz-big { color: var(--acid); }
#dz .dz-icon { color: var(--ash); }
#dz .dz-big {
  font-family: var(--mono); font-size: var(--t-label); font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--ash); text-shadow: none;
}
#dz .dz-small {
  font-family: var(--mono); font-size: var(--t-micro); font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ghost); text-shadow: none;
}

/* ── machine well ── */
.machine-card { border: 1px solid var(--line); background: var(--pit); }
#machine { border-radius: 0; }
.machine-card.drag-over #machine { outline: 1px solid var(--acid); outline-offset: -1px; }

#blobTip {
  background: var(--pit); border: 1px solid var(--line); border-radius: 0;
  font-family: var(--mono); font-size: var(--t-micro); color: var(--bone); box-shadow: none;
}
#blobTip .tip-label {
  font-family: var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ghost);
}

/* ── queue rows ── */
.file-row {
  background: var(--pit); border: 1px solid var(--line); border-radius: 0;
  font-family: var(--mono);
}
.file-row:hover { background: var(--slab); border-color: var(--line-hi); }
.file-row.drag-target { border-color: var(--acid); box-shadow: 2px 2px 0 var(--acid-dim); }
.row-idx, .row-chip {
  font-family: var(--mono); font-size: var(--t-micro); font-weight: 700;
  letter-spacing: 0.10em; color: var(--ghost);
  background: transparent; border: 1px solid var(--line); border-radius: 0;
}
.row-name { font-family: var(--mono); font-size: var(--t-data); color: var(--bone); }
.row-meta { font-family: var(--mono); font-size: 11px; color: var(--ghost); }
.row-btn {
  background: transparent; color: var(--ash);
  border: 1px solid transparent; border-radius: 0;
}
.row-btn:hover, .row-btn:focus-visible { color: var(--bone); border-color: var(--line-hi); }
.row-btn.rm:hover, .row-btn.rm:focus-visible { color: var(--rust); border-color: var(--rust); }

/* ── filename field ── */
.title-box {
  background: var(--pit); border: 1px solid var(--line); border-radius: 0; box-shadow: none;
}
.title-box:focus-within { border-color: var(--acid); box-shadow: none; outline: 1px solid var(--acid); outline-offset: 1px; }
#titleInput { font-family: var(--mono); font-size: var(--t-data); color: var(--bone); background: transparent; }
#titleInput::placeholder { color: var(--ghost); }
.title-ext { font-family: var(--mono); font-size: var(--t-data); color: var(--ghost); }

/* ── actions ── */
.press-btn, .dl-btn, .clear-btn {
  font-family: var(--shout); font-weight: 800; font-size: 15px;
  letter-spacing: 0.12em; text-transform: uppercase;
  border-radius: 0; box-shadow: none; text-shadow: none;
  padding: 12px 20px; min-height: 44px;
  transition: transform 100ms linear, box-shadow 100ms linear;
}
.press-btn, .dl-btn {
  background: var(--acid); color: var(--void); border: 1px solid var(--acid);
  clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px,
                     100% 100%, 8px 100%, 0 calc(100% - 8px));
}
.press-btn:hover:not(:disabled), .dl-btn:hover {
  background: var(--acid); color: var(--void);
  transform: translate(-1px, -1px);
  box-shadow: 2px 2px 0 var(--acid-dim), 0 0 12px rgba(0, 255, 156, 0.25);
}
.press-btn:active:not(:disabled) { transform: translate(0, 0); box-shadow: 1px 1px 0 var(--acid-dim); }
.press-btn:disabled { background: var(--slab); color: var(--ghost); border-color: var(--line); }

.clear-btn {
  background: transparent; color: var(--ash); border: 1px solid transparent;
}
.clear-btn:hover { color: var(--rust); border-color: var(--rust); }

/* ── status ── */
#status {
  font-family: var(--mono); font-size: var(--t-data);
  background: var(--slab); color: var(--ash);
  border: 1px solid var(--line); border-left-width: 3px; border-radius: 0;
}
#status.info    { border-color: var(--line); border-left-color: var(--acid);  color: var(--ash); }
#status.success { border-color: var(--line); border-left-color: var(--acid);  color: var(--bone); }
#status.error   { border-color: var(--line); border-left-color: var(--rust);  color: var(--bone); }
</style>
