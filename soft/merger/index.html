<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════
   THEME (shared family behavior)
   ═══════════════════════════════════════════════════════════════ */


/* ═══════════════════════════════════════════════════════════════
   GLASS GOO TITLE — hollow glass letters, each filled with a
   different color of sloshing goo. The whole title tilts in 3D
   toward the mouse; the goo obeys the tilt and gets excited when
   the mouse moves fast.
   ═══════════════════════════════════════════════════════════════ */


/* ═══════════════════════════════════════════════════════════════
   PDF PLUMBING
   ═══════════════════════════════════════════════════════════════ */
const { PDFDocument } = PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* One document, one shade. A ramp along the accent rather than twelve
   competing hues — documents stay tellable apart without breaking the
   one-accent rule. */
const SLIME_COLORS = [
  '#00FF9C', '#C6FF3D', '#00D982', '#7FE86B', '#00B871',
  '#A8F05C', '#2AFFAE', '#8CFF4D', '#00E68C', '#5EDD8A',
  '#3DFFC4', '#B4FF6B'
];
let colorCursor = 0;

let files = [];        // [{id, file, name, size, buf, pages, color, preview}]
let nextId = 1;
let merged = null;     // {url, name, pages} after a successful press
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = id => document.getElementById(id);
const live = msg => { $('liveRegion').textContent = msg; };

function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shade(hex, f) { /* f<1 darken, f>1 lighten */
  const n = parseInt(hex.slice(1), 16);
  const ch = v => Math.max(0, Math.min(255, Math.round(v * f)));
  return `rgb(${ch(n >> 16)},${ch((n >> 8) & 255)},${ch(n & 255)})`;
}

async function addFiles(list) {
  if (machine.isPressing()) { setStatus('The press is mid-squish — one moment.', 'info'); return; }
  const pdfs = [...list].filter(f => f.type === 'application/pdf' || /\.pdf$/i.test(f.name));
  if (!pdfs.length) { setStatus('That machine only eats PDFs. Try again with .pdf files.', 'error'); return; }
  if (merged) unfuse(); // list changed after a press — break the merged blob apart

  for (const f of pdfs) {
    const entry = {
      id: nextId++, file: f, name: f.name, size: f.size,
      buf: null, pages: null, color: SLIME_COLORS[colorCursor++ % SLIME_COLORS.length],
      preview: null
    };
    files.push(entry);
    conveyor.send(entry);         // parcel rides the pipe, then the hopper spits a blob
    loadEntry(entry);             // async: bytes, page count, preview
  }
  renderList();
  hideStatus();
  live(`${pdfs.length} document${pdfs.length > 1 ? 's' : ''} added — ${files.length} in the press queue.`);
}

async function loadEntry(entry) {
  try {
    entry.buf = await entry.file.arrayBuffer();
    // pdf.js transfers its buffer to the worker, so hand it a copy
    const doc = await pdfjsLib.getDocument({ data: entry.buf.slice(0) }).promise;
    entry.pages = doc.numPages;
    const page = await doc.getPage(1);
    const vp = page.getViewport({ scale: 1 });
    const scale = 260 / vp.width;
    const svp = page.getViewport({ scale });
    const cvs = document.createElement('canvas');
    cvs.width = Math.ceil(svp.width);
    cvs.height = Math.ceil(svp.height);
    const cx = cvs.getContext('2d');
    cx.fillStyle = '#fff';
    cx.fillRect(0, 0, cvs.width, cvs.height);
    await page.render({ canvasContext: cx, viewport: svp }).promise;
    entry.preview = cvs;
    doc.destroy();
  } catch (e) {
    if (!entry.buf) { // completely unreadable
      removeEntry(entry.id, true);
      setStatus(`Couldn't read "${entry.name}" — the file may be corrupted.`, 'error');
      return;
    }
    entry.pages = '?'; // encrypted / preview failed; pdf-lib may still merge it
  }
  renderList();
}

function removeEntry(id, silent) {
  const i = files.findIndex(f => f.id === id);
  if (i === -1) return;
  if (merged) unfuse();
  const [entry] = files.splice(i, 1);
  machine.pop(entry);
  renderList();
  if (!silent) live(`${entry.name} removed. ${files.length} left in the queue.`);
}

function moveEntry(from, to) {
  if (to < 0 || to >= files.length || from === to) return;
  if (merged) unfuse();
  const [e] = files.splice(from, 1);
  files.splice(to, 0, e);
  renderList();
}

function clearAll() {
  files = [];
  colorCursor = 0;
  conveyor.clear();
  clearMerged();
  machine.clear();
  renderList();
  hideStatus();
  $('titleInput').value = '';
  live('Chamber cleared.');
}

function clearMerged() {
  if (merged) { URL.revokeObjectURL(merged.url); merged = null; }
  $('dlBtn').hidden = true;
  dlGoo.stop();
}
function unfuse() {
  clearMerged();
  machine.unfuse();
  hideStatus();
  renderList();
}

/* ── file list UI ── */
let dragSrcIdx = null;
function renderList() {
  const list = $('fileList');
  const n = files.length;
  $('queuePanel').hidden = n === 0;
  $('pressBtn').disabled = n < 2 || machine.isPressing();
  list.innerHTML = '';

  files.forEach((f, i) => {
    const li = document.createElement('li');
    li.className = 'file-row' + (merged ? ' pressed-row' : '');
    li.draggable = true;

    const pages = f.pages == null ? '&hellip;' : (f.pages === '?' ? '? pages' : f.pages + (f.pages === 1 ? ' page' : ' pages'));
    li.innerHTML = `
      <span class="row-chip" style="background:${f.color}" aria-hidden="true"></span>
      <span class="row-idx" aria-hidden="true">${String(i + 1).padStart(2, '0')}</span>
      <div class="row-info">
        <div class="row-name" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="row-meta">${fmtSize(f.size)} &middot; ${pages}</div>
      </div>
      <div class="row-btns">
        <button class="row-btn up" title="Move up" aria-label="Move ${esc(f.name)} up" ${i === 0 ? 'disabled' : ''}>&#9650;</button>
        <button class="row-btn dn" title="Move down" aria-label="Move ${esc(f.name)} down" ${i === n - 1 ? 'disabled' : ''}>&#9660;</button>
        <button class="row-btn rm" title="Remove" aria-label="Remove ${esc(f.name)}">&#10005;</button>
      </div>`;

    li.querySelector('.up').addEventListener('click', () => moveEntry(i, i - 1));
    li.querySelector('.dn').addEventListener('click', () => moveEntry(i, i + 1));
    li.querySelector('.rm').addEventListener('click', () => removeEntry(f.id));

    li.addEventListener('dragstart', () => { dragSrcIdx = i; li.classList.add('dragging'); });
    li.addEventListener('dragend', () => li.classList.remove('dragging'));
    li.addEventListener('dragover', e => { e.preventDefault(); li.classList.add('drag-target'); });
    li.addEventListener('dragleave', () => li.classList.remove('drag-target'));
    li.addEventListener('drop', e => {
      e.preventDefault();
      li.classList.remove('drag-target');
      if (dragSrcIdx !== null && dragSrcIdx !== i) moveEntry(dragSrcIdx, i);
      dragSrcIdx = null;
    });

    list.appendChild(li);
  });
}

function setStatus(msg, type, html) {
  const el = $('status');
  if (html) el.innerHTML = msg; else el.textContent = msg;
  el.className = type;
}
function hideStatus() { const el = $('status'); el.className = ''; el.textContent = ''; }

function outputName() {
  const raw = ($('titleInput').value || 'merged-document').trim() || 'merged-document';
  return raw.replace(/\.pdf$/i, '').replace(/[\\/:*?"<>|]/g, '-');
}

/* ── the merge itself (runs while the pistons slam) ── */
async function doMerge() {
  const out = await PDFDocument.create();
  const title = outputName();
  out.setTitle(title);
  out.setProducer('VmesteSoft — PDF MERGER');
  for (const f of files) {
    if (!f.buf) f.buf = await f.file.arrayBuffer();
    const doc = await PDFDocument.load(f.buf, { ignoreEncryption: true });
    const pages = await out.copyPages(doc, doc.getPageIndices());
    pages.forEach(p => out.addPage(p));
  }
  const bytes = await out.save();
  const blob = new Blob([bytes], { type: 'application/pdf' });
  return { url: URL.createObjectURL(blob), name: title + '.pdf', pages: out.getPageCount() };
}

async function pressIt() {
  if (files.length < 2 || machine.isPressing()) return;
  if (merged) unfuse();
  hideStatus();
  $('pressBtn').disabled = true;
  setStatus('Squishing&hellip;', 'info', true);
  live('Merging documents.');

  const mergePromise = doMerge();
  try {
    const [result] = await Promise.all([mergePromise, machine.press()]);
    merged = result;
    machine.fuse(result);
    renderList();
    /* no auto-download: let them savor the squish, then smash the button */
    const dl = $('dlBtn');
    dl.href = merged.url;
    dl.download = merged.name;
    $('dlLabel').textContent = `Download ${merged.name}`;
    dl.hidden = false;
    dlGoo.start(files.map(f => f.color));
    hideStatus();   // the goo button IS the confirmation
    live(`Merge complete. ${merged.name} is ready to download.`);
  } catch (err) {
    machine.abortPress();
    setStatus('The press jammed: ' + (err && err.message ? err.message : err) + ' — remove the problem file and try again.', 'error');
    live('Merge failed.');
  } finally {
    $('pressBtn').disabled = files.length < 2;
  }
}

/* ═══════════════════════════════════════════════════════════════
   THE MACHINE — soft-body slime physics in a navy chamber
   ═══════════════════════════════════════════════════════════════ */
const machine = (() => {
  const canvas = $('machine');
  const ctx = canvas.getContext('2d');
  const W = 600, H = 630;

  /* geometry */
  const FLOOR = H - 52;
  const WALL_L = 50, WALL_R = W - 50;       // resting piston faces
  const PLATE_TOP = 150;                    // tall plates: no goo escapes over the top
  const PLATE_W = 18;
  const DIRT = 26;                          // dirt border thickness around the carved chamber
  const HOP = { cx: W / 2, topY: 2, topW: 150, neckY: 60, neckW: 96, exitY: 98 };  // rim right on the box's top edge

  /* sim state */
  let blobs = [];            // live Blob instances
  const feedQueue = [];      // entries waiting for the hopper
  let feedTimer = 0;
  let particles = [];
  let shake = 0;
  let flash = 0;
  let tubeSquish = 0;        // hopper recoil when spitting
  let hoverBlob = null;
  let mouse = { x: -1, y: -1 };
  let grab = null;           // {blob, offx, offy, hist:[{x,y,t}], moved, t0}
  let lastSdt = 1 / 180;     // most recent physics substep, for throw velocity

  /* Where's My Water scenery: pre-scattered dirt speckles & pebbles */
  const dirtSpecks = [], sandSpecks = [], pebbles = [];
  for (let i = 0; i < 90; i++) {
    const edge = Math.floor(Math.random() * 4);
    const p = { r: 1 + Math.random() * 2.6, c: Math.random() < 0.5 ? '#0F221D' : '#193830' };
    if (edge === 0)      { p.x = Math.random() * DIRT;           p.y = Math.random() * H; }
    else if (edge === 1) { p.x = W - Math.random() * DIRT;       p.y = Math.random() * H; }
    else if (edge === 2) { p.x = Math.random() * W;              p.y = Math.random() * 20; }
    else                 { p.x = Math.random() * W;              p.y = FLOOR + Math.random() * (H - FLOOR); }
    dirtSpecks.push(p);
  }
  for (let i = 0; i < 34; i++) {
    sandSpecks.push({
      x: DIRT + 8 + Math.random() * (W - 2 * DIRT - 16),
      y: 30 + Math.random() * (FLOOR - 60),
      r: 1 + Math.random() * 1.8,
      c: Math.random() < 0.5 ? 'rgba(25,56,48,0.28)' : 'rgba(0,255,156,0.5)'
    });
  }
  for (let i = 0; i < 7; i++) {
    const k = 6 + (Math.random() * 2 | 0);
    pebbles.push({
      x: 26 + Math.random() * (W - 52),
      y: FLOOR + 20 + Math.random() * 14,
      rx: 6 + Math.random() * 8,
      ry: 4.5 + Math.random() * 3.5,
      /* stable per-stone lumpy silhouette */
      jit: Array.from({ length: k }, () => 0.8 + Math.random() * 0.4),
      c: ['#2A5B4E', '#193830', '#3D6B5E'][i % 3]
    });
  }
  /* smaller, darker stones embedded in the dirt frame */
  const frameStones = [];
  for (let i = 0; i < 7; i++) {
    const band = i % 3;
    frameStones.push({
      x: band === 0 ? 7 + Math.random() * 12 : band === 1 ? W - 19 + Math.random() * 12 : 44 + Math.random() * (W - 88),
      y: band === 2 ? 5 + Math.random() * 8 : 70 + Math.random() * (FLOOR - 140),
      rx: 3.5 + Math.random() * 3.5,
      ry: 2.8 + Math.random() * 2.4,
      jit: Array.from({ length: 6 }, () => 0.8 + Math.random() * 0.4),
      c: ['#193830', '#0F221D', '#2A5B4E'][i % 3],
      embedded: true
    });
  }

  /* cartoon stone: lumpy silhouette, lit-from-above gradient, ink line */
  function drawStone(p) {
    const k = p.jit.length;
    const stone = () => {
      ctx.beginPath();
      for (let i = 0; i <= k; i++) {
        const a = (i % k) / k * Math.PI * 2 - Math.PI / 2;
        const b = ((i + 1) % k) / k * Math.PI * 2 - Math.PI / 2;
        const x1 = p.x + Math.cos(a) * p.rx * p.jit[i % k];
        const y1 = p.y + Math.sin(a) * p.ry * p.jit[i % k];
        const x2 = p.x + Math.cos(b) * p.rx * p.jit[(i + 1) % k];
        const y2 = p.y + Math.sin(b) * p.ry * p.jit[(i + 1) % k];
        i === 0 ? ctx.moveTo((x1 + x2) / 2, (y1 + y2) / 2)
                : ctx.quadraticCurveTo(x1, y1, (x1 + x2) / 2, (y1 + y2) / 2);
      }
      ctx.closePath();
    };
    if (!p.embedded) {
      ctx.fillStyle = 'rgba(2,7,6,0.3)';
      ctx.beginPath();
      ctx.ellipse(p.x + 1, p.y + p.ry * 0.9, p.rx * 1.02, p.ry * 0.4, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    const sg = ctx.createLinearGradient(0, p.y - p.ry, 0, p.y + p.ry);
    sg.addColorStop(0, shade(p.c, 1.22));
    sg.addColorStop(0.55, p.c);
    sg.addColorStop(1, shade(p.c, 0.68));
    stone();
    ctx.fillStyle = sg;
    ctx.fill();
    ctx.strokeStyle = p.embedded ? '#020706' : '#193830';
    ctx.lineWidth = p.embedded ? 2 : 2.4;
    ctx.lineJoin = 'round';
    ctx.stroke();
    ctx.fillStyle = `rgba(228,243,236,${p.embedded ? 0.3 : 0.5})`;
    ctx.beginPath();
    ctx.ellipse(p.x - p.rx * 0.32, p.y - p.ry * 0.42, p.rx * 0.28, p.ry * 0.2, -0.4, 0, Math.PI * 2);
    ctx.fill();
  }

  /* press state machine: idle | anticipate | drive | hold | release */
  let press = { state: 'idle', t: 0, resolve: null, faceL: WALL_L, faceR: WALL_R, gapTarget: 0 };

  const rnd = (a, b) => a + Math.random() * (b - a);
  const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
  const easeInCubic = t => t * t * t;
  const easeOutBack = t => 1 + 2.2 * Math.pow(t - 1, 3) + 1.2 * Math.pow(t - 1, 2);

  /* ── soft-body blob ── */
  class Blob {
    constructor(entry, x, y, r, squeezeX) {
      this.entry = entry;        // null for the merged blob
      this.segments = null;      // merged blob: [{color, frac}]
      this.mergedInfo = null;
      this.r = r;
      this.restArea = Math.PI * r * r;
      this.N = 16;
      this.nodes = [];
      this.wobble = Math.random() * 6.28;
      this.dead = false;
      const rx = squeezeX ? Math.min(squeezeX, r) : r;
      const ry = this.restArea / (Math.PI * rx);
      for (let i = 0; i < this.N; i++) {
        const a = (i / this.N) * Math.PI * 2;
        const px = x + Math.cos(a) * rx;
        const py = y + Math.sin(a) * ry;
        this.nodes.push({ x: px, y: py, px: px, py: py - rnd(1, 3) });
      }
      this.chord = 2 * Math.PI * r / this.N;
      this.pr = Math.max(5, r * 0.22);      // node collision radius
    }

    center() {
      let cx = 0, cy = 0;
      for (const n of this.nodes) { cx += n.x; cy += n.y; }
      return { x: cx / this.N, y: cy / this.N };
    }
    area() {
      let a = 0;
      for (let i = 0; i < this.N; i++) {
        const p = this.nodes[i], q = this.nodes[(i + 1) % this.N];
        a += p.x * q.y - q.x * p.y;
      }
      return Math.abs(a / 2);
    }
    bbox() {
      let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
      for (const n of this.nodes) {
        if (n.x < x0) x0 = n.x; if (n.x > x1) x1 = n.x;
        if (n.y < y0) y0 = n.y; if (n.y > y1) y1 = n.y;
      }
      return { x0, y0, x1, y1 };
    }
    contains(x, y) {
      let inside = false;
      for (let i = 0, j = this.N - 1; i < this.N; j = i++) {
        const a = this.nodes[i], b = this.nodes[j];
        if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) inside = !inside;
      }
      return inside;
    }
    impulse(mag) {
      for (const n of this.nodes) { n.px += rnd(-mag, mag); n.py += rnd(-mag, mag); }
    }

    integrate(dt) {
      const g = 1500;
      const damp = 0.992;
      for (const n of this.nodes) {
        const vx = (n.x - n.px) * damp;
        const vy = (n.y - n.py) * damp;
        n.px = n.x; n.py = n.y;
        n.x += vx;
        n.y += vy + g * dt * dt;
      }
    }

    constrain() {
      const nodes = this.nodes, N = this.N;
      /* perimeter springs */
      for (let i = 0; i < N; i++) {
        const a = nodes[i], b = nodes[(i + 1) % N];
        let dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.0001;
        const diff = (d - this.chord) / d * 0.5;
        dx *= diff; dy *= diff;
        a.x += dx; a.y += dy;
        b.x -= dx; b.y -= dy;
      }
      /* pressure: nudge nodes along their normals toward rest area */
      const areaErr = (this.restArea - this.area()) / this.restArea;
      const k = Math.min(0.6, Math.max(-0.6, areaErr)) * this.r * 0.045;
      if (Math.abs(k) > 0.0005) {
        for (let i = 0; i < N; i++) {
          const prev = nodes[(i - 1 + N) % N], next = nodes[(i + 1) % N], n = nodes[i];
          let nx = next.y - prev.y, ny = prev.x - next.x; // outward normal
          const len = Math.hypot(nx, ny) || 0.0001;
          n.x += nx / len * k;
          n.y += ny / len * k;
        }
      }
      /* world collision — the goo is sealed in: floor, ceiling, walls and
         piston faces. While the press runs, the faces act full-height so
         nothing squirts over the top of the plates. */
      const fl = press.faceL + PLATE_W / 2 + 2, fr = press.faceR - PLATE_W / 2 - 2;
      const squeezing = press.state === 'anticipate' || press.state === 'drive' || press.state === 'hold';
      for (const n of nodes) {
        if (n.y > FLOOR - 3) {
          n.y = FLOOR - 3;
          n.px = n.x + (n.x - n.px) * 0.35; // floor friction
        }
        if (n.y < 10) {                      // ceiling: bounce off, damped
          const vy = n.y - n.py;
          n.y = 10;
          n.py = n.y + vy * 0.45;
        }
        const inPlateBand = squeezing || n.y > PLATE_TOP;
        const lb = inPlateBand ? fl : DIRT + 6;
        const rb = inPlateBand ? fr : W - DIRT - 6;
        if (n.x < lb) { const vx = n.x - n.px; n.x = lb; n.px = n.x + vx * 0.4; }
        if (n.x > rb) { const vx = n.x - n.px; n.x = rb; n.px = n.x + vx * 0.4; }
        /* the feed pipe is a solid obstacle with an open channel down the
           middle: goo outside bounces off its walls (never gets vacuumed
           in), goo shoved up inside is free — gravity drains it back out */
        if (n.y < HOP.exitY + 4 && n.y > HOP.topY - 10) {
          const funnelT = Math.min(Math.max(n.y - HOP.topY, 0) / (HOP.neckY - HOP.topY), 1);
          const halfW = HOP.topW / 2 + (HOP.neckW / 2 - HOP.topW / 2) * funnelT;
          const dx = n.x - HOP.cx, adx = Math.abs(dx);
          const inner = halfW - 6, outer = halfW + 7;
          if (adx > inner && adx < outer) {
            const vx = n.x - n.px;
            const side = adx < (inner + outer) / 2 ? inner : outer;
            n.x = HOP.cx + (dx < 0 ? -side : side);
            n.px = n.x + vx * 0.4;
          }
        }
      }
    }

    /* ── drawing ── */
    path() {
      const nodes = this.nodes, N = this.N;
      ctx.beginPath();
      let mx = (nodes[0].x + nodes[N - 1].x) / 2;
      let my = (nodes[0].y + nodes[N - 1].y) / 2;
      ctx.moveTo(mx, my);
      for (let i = 0; i < N; i++) {
        const a = nodes[i], b = nodes[(i + 1) % N];
        ctx.quadraticCurveTo(a.x, a.y, (a.x + b.x) / 2, (a.y + b.y) / 2);
      }
      ctx.closePath();
    }

    draw(t, hovered, index) {
      const c = this.center();
      const bb = this.bbox();

      /* contact shadow */
      const shW = (bb.x1 - bb.x0) * 0.44;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 0.35 - (FLOOR - bb.y1) / 300);
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(c.x, FLOOR - 2, shW, 7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      /* body — Where's My Water goo: opaque, candy-bright */
      const fill = this.segments ? 'rgba(228,243,236,0.97)' : this.entry.color;
      this.path();
      ctx.save();
      if (hovered) {
        ctx.shadowColor = this.segments ? '#00FF9C' : this.entry.color;
        ctx.shadowBlur = 26;
      }
      ctx.globalAlpha = 0.96;
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.restore();

      /* preview paper clipped inside the goo */
      ctx.save();
      this.path();
      ctx.clip();
      const preview = this.segments ? this.mergedInfo.preview : this.entry.preview;
      const w = bb.x1 - bb.x0, h = bb.y1 - bb.y0;
      const tilt = Math.sin(t * 1.4 + this.wobble) * 0.035;
      if (preview) {
        const pw = Math.max(34, Math.min(w, h * preview.width / preview.height) * 0.62);
        const ph = pw * preview.height / preview.width;
        ctx.translate(c.x, c.y);
        ctx.rotate(tilt);
        ctx.fillStyle = 'rgba(5,13,11,0.35)';
        ctx.fillRect(-pw / 2 + 3, -ph / 2 + 3, pw, ph);
        ctx.fillStyle = '#fff';
        ctx.fillRect(-pw / 2 - 2, -ph / 2 - 2, pw + 4, ph + 4);
        ctx.drawImage(preview, -pw / 2, -ph / 2, pw, ph);
      } else if (!this.segments) {
        /* placeholder pixel doc while the preview renders */
        const s = Math.max(20, Math.min(w, h) * 0.3);
        ctx.translate(c.x, c.y);
        ctx.rotate(tilt);
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.fillRect(-s / 2, -s * 0.62, s, s * 1.24);
        ctx.fillStyle = shade(this.entry.color, 0.55);
        for (let i = 0; i < 4; i++) ctx.fillRect(-s / 2 + s * 0.15, -s * 0.42 + i * s * 0.28, s * 0.7, s * 0.09);
      }
      ctx.restore();

      /* merged title stamp */
      if (this.segments && this.mergedInfo) {
        ctx.save();
        this.path();
        ctx.clip();
        const label = this.mergedInfo.name.replace(/\.pdf$/i, '');
        ctx.font = '700 15px "Barlow Condensed", sans-serif';
        const tw = Math.min(ctx.measureText(label.toUpperCase()).width + 18, w * 0.8);
        const ty = c.y + h * 0.26;
        ctx.fillStyle = '#00FF9C';
        ctx.fillRect(c.x - tw / 2, ty - 11, tw, 22);
        ctx.fillStyle = '#050D0B';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label.toUpperCase().slice(0, 28), c.x, ty + 1, tw - 12);
        ctx.restore();
      }

      /* border: single color, or the merged color chunks */
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      if (this.segments) {
        const nodes = this.nodes, N = this.N;
        let seg = 0, used = 0;
        let quota = Math.max(1, Math.round(this.segments[0].frac * N));
        for (let i = 0; i < N; i++) {
          const a = nodes[i], b = nodes[(i + 1) % N];
          const c1 = nodes[(i + 2) % N];
          ctx.strokeStyle = shade(this.segments[seg].color, 0.9);
          ctx.lineWidth = 8;
          ctx.beginPath();
          ctx.moveTo((a.x + b.x) / 2, (a.y + b.y) / 2);
          ctx.quadraticCurveTo(b.x, b.y, (b.x + c1.x) / 2, (b.y + c1.y) / 2);
          ctx.stroke();
          used++;
          if (used >= quota && seg < this.segments.length - 1) {
            seg++; used = 0;
            quota = Math.max(1, Math.round(this.segments[seg].frac * N));
          }
        }
      } else {
        this.path();
        ctx.strokeStyle = shade(this.entry.color, 0.5);
        ctx.lineWidth = 5.5;
        ctx.stroke();
      }
      ctx.restore();

      /* cartoon gloss: one soft sweep + one hard sparkle */
      ctx.save();
      this.path();
      ctx.clip();
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.ellipse(c.x - w * 0.18, bb.y0 + h * 0.2, w * 0.2, h * 0.11, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.6;
      ctx.beginPath();
      ctx.ellipse(c.x - w * 0.28, bb.y0 + h * 0.14, Math.max(2.5, w * 0.045), Math.max(2, h * 0.03), -0.5, 0, Math.PI * 2);
      ctx.fill();
      /* bottom inner shade for volume */
      ctx.globalAlpha = 0.12;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(c.x, bb.y1 + h * 0.05, w * 0.42, h * 0.2, 0, Math.PI, 0, true);
      ctx.fill();
      ctx.restore();

      /* order badge (only while separate blobs) */
      if (!this.segments && blobs.length > 1 && index >= 0) {
        const bx = c.x, by = bb.y0 - 1;
        ctx.save();
        ctx.fillStyle = '#193830';
        ctx.fillRect(bx - 10, by - 10, 20, 17);
        ctx.strokeStyle = shade(this.entry.color, 0.9);
        ctx.lineWidth = 2;
        ctx.strokeRect(bx - 10, by - 10, 20, 17);
        ctx.fillStyle = '#00FF9C';
        ctx.font = '700 9px "Space Mono", monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(index + 1), bx, by - 1);
        ctx.restore();
      }
    }
  }

  /* ── blob ↔ blob collisions: node repulsion + polygon ejection ── */
  function collideBlobs() {
    for (let i = 0; i < blobs.length; i++) {
      for (let j = i + 1; j < blobs.length; j++) {
        const A = blobs[i], B = blobs[j];
        const ca = A.center(), cb = B.center();
        const span = (A.r + B.r) * 1.6;
        if (Math.abs(ca.x - cb.x) > span || Math.abs(ca.y - cb.y) > span) continue;
        const minD = A.pr + B.pr;
        for (const na of A.nodes) {
          for (const nb of B.nodes) {
            let dx = nb.x - na.x, dy = nb.y - na.y;
            const d2 = dx * dx + dy * dy;
            if (d2 > minD * minD || d2 === 0) continue;
            const d = Math.sqrt(d2);
            const push = (minD - d) / d * 0.5;
            dx *= push; dy *= push;
            na.x -= dx; na.y -= dy;
            nb.x += dx; nb.y += dy;
          }
        }
        /* eject stray nodes that tunneled inside the other blob */
        for (const [P, Q, cq] of [[A, B, cb], [B, A, ca]]) {
          for (const n of P.nodes) {
            if (Q.contains(n.x, n.y)) {
              let dx = n.x - cq.x, dy = n.y - cq.y;
              const d = Math.hypot(dx, dy) || 0.001;
              n.x += dx / d * 3;
              n.y += dy / d * 3;
            }
          }
        }
      }
    }
  }

  /* ── hopper feed ── */
  function feed(entry) { feedQueue.push(entry); }

  function radiusFor(entry, crowd) {
    const kb = Math.max(entry.size / 1024, 8);
    let r = 30 + Math.min(24, Math.sqrt(kb) * 0.9);
    r *= Math.max(0.58, Math.min(1, Math.sqrt(7 / Math.max(crowd, 1))));
    return r;
  }

  function spitBlob(entry) {
    const crowd = files.length;
    const r = radiusFor(entry, crowd);
    const b = new Blob(entry, HOP.cx + rnd(-4, 4), HOP.exitY - 26, r, HOP.neckW / 2 - 8);
    /* give it a spit: downward + slight sideways kick */
    const kick = rnd(-1.6, 1.6);
    for (const n of b.nodes) { n.py -= rnd(2.5, 4.5); n.px -= kick; }
    blobs.push(b);
    tubeSquish = 1;
    for (let i = 0; i < 7; i++) {
      particles.push({
        x: HOP.cx + rnd(-HOP.neckW / 3, HOP.neckW / 3), y: HOP.exitY + rnd(-4, 10),
        vx: rnd(-40, 40), vy: rnd(20, 120),
        r: rnd(2, 4.5), color: entry.color, life: 1
      });
    }
  }

  function pop(entry) {
    const i = blobs.findIndex(b => b.entry && b.entry.id === entry.id);
    if (i === -1) return;
    const b = blobs[i];
    const c = b.center();
    splat(c.x, c.y, [entry.color], reduceMotion ? 8 : 22, b.r);
    blobs.splice(i, 1);
  }

  function splat(x, y, colors, count, spread) {
    for (let i = 0; i < count; i++) {
      const a = rnd(0, Math.PI * 2);
      const sp = rnd(40, 320);
      particles.push({
        x: x + rnd(-spread, spread) * 0.4, y: y + rnd(-spread, spread) * 0.4,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80,
        r: rnd(2.5, 6), color: colors[i % colors.length], life: 1
      });
    }
  }

  function clear() {
    blobs = [];
    feedQueue.length = 0;
    particles = [];
    grab = null;
    press = { state: 'idle', t: 0, resolve: null, faceL: WALL_L, faceR: WALL_R, gapTarget: 0 };
  }

  /* ── press sequence ── */
  function isPressing() { return press.state !== 'idle'; }

  function pressAction() {
    return new Promise(resolve => {
      grab = null;  // the press outranks the hand
      /* squeeze until the goo fills the gap column */
      const totalArea = blobs.reduce((s, b) => s + b.restArea, 0);
      const gap = Math.max(110, Math.min(totalArea / 260, WALL_R - WALL_L - 140));
      press = { state: 'anticipate', t: 0, resolve, faceL: press.faceL, faceR: press.faceR, gapTarget: gap };
    });
  }

  function abortPress() {
    if (press.resolve) press.resolve = null;
    press.state = 'release';
    press.t = 0;
  }

  /* fuse all blobs into one big multi-border blob */
  function fuse(result) {
    if (!blobs.length) return;
    const totalArea = blobs.reduce((s, b) => s + b.area(), 0);
    let cx = 0, cy = 0;
    for (const b of blobs) { const c = b.center(); cx += c.x; cy += c.y; }
    cx /= blobs.length; cy /= blobs.length;

    /* the press compacts documents: merged blob is denser than the sum */
    const maxR = Math.min((WALL_R - WALL_L) / 2 - 46, 105);
    const area = Math.min(totalArea * 0.82, Math.PI * maxR * maxR);
    const r = Math.sqrt(area / Math.PI);

    const colorsInOrder = files.map(f => ({ color: f.color, area: Math.PI * Math.pow(radiusFor(f, files.length), 2) }));
    const sum = colorsInOrder.reduce((s, c) => s + c.area, 0) || 1;

    const gapHalf = Math.max((press.faceR - press.faceL) / 2 - PLATE_W - 8, 30);
    const big = new Blob(null, cx, Math.min(cy, FLOOR - 20), r, Math.min(gapHalf, r * 0.6));
    big.N = big.nodes.length;
    big.segments = colorsInOrder.map(c => ({ color: c.color, frac: c.area / sum }));
    big.mergedInfo = { name: result.name, pages: result.pages, preview: files[0].preview };

    splat(cx, cy, files.map(f => f.color), reduceMotion ? 12 : 44, r);
    flash = reduceMotion ? 0 : 0.85;
    shake = reduceMotion ? 0 : 16;

    blobs = [big];
    press.state = 'release';
    press.t = 0;
  }

  /* break the merged blob back into per-file blobs (list was edited) */
  function unfuse() {
    if (!blobs.some(b => b.segments)) return;
    blobs = blobs.filter(b => !b.segments);
    feedQueue.length = 0;
    for (const f of files) feed(f);
  }

  function updatePress(dt) {
    press.t += dt;
    const t = press.t;
    switch (press.state) {
      case 'anticipate': {  /* pull back a touch before the slam */
        const k = easeOutCubic(Math.min(t / 0.28, 1)) * 16;
        press.faceL = WALL_L - k;
        press.faceR = WALL_R + k;
        if (t >= 0.28) { press.state = 'drive'; press.t = 0; }
        break;
      }
      case 'drive': {       /* accelerate inward — the slam */
        const D = 1.15;
        const k = easeInCubic(Math.min(t / D, 1));
        const startL = WALL_L - 16, startR = WALL_R + 16;
        const endL = W / 2 - press.gapTarget / 2, endR = W / 2 + press.gapTarget / 2;
        press.faceL = startL + (endL - startL) * k;
        press.faceR = startR + (endR - startR) * k;
        if (!reduceMotion) shake = Math.max(shake, k * 6);
        if (t >= D) {
          press.state = 'hold'; press.t = 0;
          if (!reduceMotion) {
            shake = 13;
            /* impact sparks off both faces */
            for (const fx of [press.faceL, press.faceR]) {
              for (let i = 0; i < 9; i++) {
                particles.push({
                  x: fx, y: rnd(PLATE_TOP + 40, FLOOR - 30),
                  vx: rnd(-140, 140), vy: rnd(-260, -60),
                  r: rnd(1.5, 3), color: i % 2 ? '#00FF9C' : '#C6FF3D', life: rnd(0.5, 0.9)
                });
              }
            }
          }
        }
        break;
      }
      case 'hold': {        /* max pressure: vibrate and wait for the merge */
        const vib = reduceMotion ? 0 : Math.sin(t * 55) * 1.6;
        press.faceL = W / 2 - press.gapTarget / 2 + vib;
        press.faceR = W / 2 + press.gapTarget / 2 - vib;
        if (t >= 0.5 && press.resolve) { const r = press.resolve; press.resolve = null; r(); }
        /* fuse() or abortPress() moves us on from outside */
        break;
      }
      case 'release': {     /* springy retreat */
        const D = 0.85;
        const k = Math.min(t / D, 1);
        const e = easeOutBack(k);
        press.faceL = press.faceL + (WALL_L - press.faceL) * (0.08 + e * 0.14);
        press.faceR = press.faceR + (WALL_R - press.faceR) * (0.08 + e * 0.14);
        if (k >= 1) { press.state = 'idle'; press.faceL = WALL_L; press.faceR = WALL_R; renderList(); }
        break;
      }
    }
  }

  /* ── drawing the world: a chamber carved out of warm dirt ── */
  function drawChamber() {
    /* raw dirt everywhere */
    const dirt = ctx.createLinearGradient(0, 0, 0, H);
    dirt.addColorStop(0, '#0A1714');
    dirt.addColorStop(1, '#050D0B');
    ctx.fillStyle = dirt;
    ctx.fillRect(0, 0, W, H);

    /* the carved cave interior — sandy and bright */
    const sand = ctx.createLinearGradient(0, 0, 0, FLOOR);
    sand.addColorStop(0, '#0F221D');
    sand.addColorStop(0.7, '#0A1714');
    sand.addColorStop(1, '#071310');
    ctx.fillStyle = sand;
    roundRectPath(DIRT, 18, W - 2 * DIRT, FLOOR - 18, 16);
    ctx.fill();
    /* carved edge: dark rim + light lip */
    ctx.strokeStyle = 'rgba(2,7,6,0.55)';
    ctx.lineWidth = 5;
    roundRectPath(DIRT, 18, W - 2 * DIRT, FLOOR - 18, 16);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,255,156,0.35)';
    ctx.lineWidth = 2;
    roundRectPath(DIRT + 4, 22, W - 2 * DIRT - 8, FLOOR - 26, 13);
    ctx.stroke();

    /* sediment strata — faint wavy bands in the sand */
    ctx.strokeStyle = 'rgba(25,56,48,0.13)';
    ctx.lineWidth = 6;
    for (let i = 1; i <= 4; i++) {
      const y = 40 + i * (FLOOR - 90) / 5;
      ctx.beginPath();
      ctx.moveTo(DIRT + 8, y);
      for (let x = DIRT + 8; x <= W - DIRT - 8; x += 40) {
        ctx.quadraticCurveTo(x + 20, y + (i % 2 ? 5 : -5), x + 40, y);
      }
      ctx.stroke();
    }

    /* speckles: dirt border grain + sand grain */
    for (const p of dirtSpecks) {
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    for (const p of sandSpecks) {
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }

    /* packed-earth floor */
    ctx.fillStyle = '#0F221D';
    ctx.fillRect(0, FLOOR, W, H - FLOOR);
    ctx.fillStyle = '#050D0B';
    ctx.fillRect(DIRT, FLOOR, W - 2 * DIRT, 4);
    ctx.fillStyle = 'rgba(0,255,156,0.18)';
    ctx.fillRect(DIRT, FLOOR + 4, W - 2 * DIRT, 2);
    for (const p of pebbles) drawStone(p);
    for (const p of frameStones) drawStone(p);

    /* interior depth: soft shadow cast by the frame onto the sand */
    const ish = ctx.createLinearGradient(0, 18, 0, 46);
    ish.addColorStop(0, 'rgba(2,7,6,0.28)');
    ish.addColorStop(1, 'rgba(2,7,6,0)');
    ctx.fillStyle = ish;
    roundRectPath(DIRT + 3, 21, W - 2 * DIRT - 6, 28, 12);
    ctx.fill();

    /* fat cartoon outline around the whole earth box */
    ctx.strokeStyle = '#020706';
    ctx.lineWidth = 5;
    roundRectPath(2.5, 2.5, W - 5, H - 5, 13);
    ctx.stroke();
  }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* the outside pipe plunges down at exactly the funnel's x; this stub
     carries it through the box wall into the mouth — one seamless line */
  function drawFeedPipe() {
    const trace = () => {
      ctx.beginPath();
      ctx.moveTo(HOP.cx, -16);
      ctx.lineTo(HOP.cx, HOP.topY + 12);
    };
    ctx.save();
    ctx.lineCap = 'butt';
    trace(); ctx.strokeStyle = '#0F221D'; ctx.lineWidth = 30; ctx.stroke();
    trace(); ctx.strokeStyle = '#2A5B4E'; ctx.lineWidth = 23; ctx.stroke();
    trace(); ctx.strokeStyle = '#00B871'; ctx.lineWidth = 12; ctx.stroke();
    trace(); ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 4.5; ctx.stroke();
    /* wall fitting: a flared gold bell clamped onto the box's top edge */
    ctx.beginPath();
    ctx.moveTo(HOP.cx - 14, -2);
    ctx.lineTo(HOP.cx + 14, -2);
    ctx.lineTo(HOP.cx + 23, 14);
    ctx.lineTo(HOP.cx - 23, 14);
    ctx.closePath();
    ctx.fillStyle = '#00FF9C';
    ctx.fill();
    ctx.strokeStyle = '#193830';
    ctx.lineWidth = 2.5;
    ctx.lineJoin = 'round';
    ctx.stroke();
    for (const bx of [HOP.cx - 15, HOP.cx + 15]) {
      ctx.fillStyle = '#C6FF3D';
      ctx.beginPath(); ctx.arc(bx, 8, 2.6, 0, 7); ctx.fill();
      ctx.strokeStyle = '#193830'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.restore();
  }

  function drawHopper(t) {
    const squish = 1 + tubeSquish * 0.14;
    ctx.save();
    ctx.translate(HOP.cx, HOP.topY);
    ctx.scale(2 - squish, squish);
    ctx.translate(-HOP.cx, -HOP.topY);

    const cx = HOP.cx, hw = HOP.topW / 2, nw = HOP.neckW / 2;

    /* bell body — concave flared walls, fat cartoon outline */
    const bell = () => {
      ctx.beginPath();
      ctx.moveTo(cx - hw, HOP.topY + 5);
      ctx.quadraticCurveTo(cx - nw - 12, HOP.topY + 18, cx - nw, HOP.neckY);
      ctx.lineTo(cx - nw, HOP.exitY);
      ctx.lineTo(cx + nw, HOP.exitY);
      ctx.lineTo(cx + nw, HOP.neckY);
      ctx.quadraticCurveTo(cx + nw + 12, HOP.topY + 18, cx + hw, HOP.topY + 5);
      ctx.closePath();
    };
    const g = ctx.createLinearGradient(cx - hw, 0, cx + hw, 0);
    g.addColorStop(0, '#193830');
    g.addColorStop(0.42, '#2A5B4E');
    g.addColorStop(1, '#0F221D');
    bell();
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = '#193830';
    ctx.lineWidth = 5;
    ctx.lineJoin = 'round';
    ctx.stroke();

    /* sheen sweeping down the left wall */
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx - hw + 14, HOP.topY + 11);
    ctx.quadraticCurveTo(cx - nw - 3, HOP.topY + 24, cx - nw + 9, HOP.neckY + 6);
    ctx.stroke();

    /* rolled rim lip riding the box edge */
    ctx.beginPath();
    ctx.roundRect(cx - hw - 8, HOP.topY - 5, HOP.topW + 16, 15, 8);
    ctx.fillStyle = '#0F221D';
    ctx.fill();
    ctx.strokeStyle = '#193830';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.roundRect(cx - hw - 2, HOP.topY - 2, HOP.topW * 0.55, 4, 2);
    ctx.fill();

    /* chunky gold exit band with bolt heads */
    ctx.beginPath();
    ctx.roundRect(cx - nw - 8, HOP.exitY - 10, HOP.neckW + 16, 13, 5);
    ctx.fillStyle = '#00FF9C';
    ctx.fill();
    ctx.strokeStyle = '#193830';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    for (const bx of [cx - nw - 1, cx + nw + 1]) {
      ctx.fillStyle = '#C6FF3D';
      ctx.beginPath(); ctx.arc(bx, HOP.exitY - 3.5, 3, 0, 7); ctx.fill();
      ctx.strokeStyle = '#193830'; ctx.lineWidth = 1.5; ctx.stroke();
    }

    /* big friendly rivets on the bell */
    for (const [rx, ry] of [[cx - nw + 10, (HOP.neckY + HOP.exitY) / 2], [cx + nw - 10, (HOP.neckY + HOP.exitY) / 2]]) {
      ctx.fillStyle = '#C6FF3D';
      ctx.beginPath(); ctx.arc(rx, ry, 3.5, 0, 7); ctx.fill();
      ctx.strokeStyle = '#193830'; ctx.lineWidth = 1.5; ctx.stroke();
    }

    ctx.restore();

    /* drip: idle goo tease at the nozzle when queue is loading */
    if (feedQueue.length) {
      const next = feedQueue[0];
      const ph = (Math.sin(t * 6) + 1) / 2;
      ctx.fillStyle = next.color;
      ctx.beginPath();
      ctx.ellipse(HOP.cx, HOP.exitY + 3 + ph * 5, 12 + ph * 4, 8 + ph * 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPiston(side, t) {
    const faceX = side === 'L' ? press.faceL : press.faceR;
    const dir = side === 'L' ? 1 : -1;
    const plateX = side === 'L' ? faceX - PLATE_W : faceX;
    const edgeX = side === 'L' ? 0 : W;
    const midY = (PLATE_TOP + FLOOR) / 2;
    const pressing = isPressing();

    /* telescoping main ram + twin guide rods — cartoon cylinders:
       lit from above, fat ink outline, running shine */
    const INK = '#020706';
    const armLen = Math.abs(faceX - edgeX);
    const armX = side === 'L' ? 0 : faceX;
    const cyl = (x, y, w, h, base, r) => {
      if (w < 2) return;
      const g = ctx.createLinearGradient(0, y, 0, y + h);
      g.addColorStop(0, shade(base, 1.28));
      g.addColorStop(0.45, base);
      g.addColorStop(1, shade(base, 0.6));
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = INK;
      ctx.lineWidth = 2.4;
      ctx.lineJoin = 'round';
      ctx.stroke();
      ctx.fillStyle = 'rgba(228,243,236,0.35)';
      ctx.beginPath();
      ctx.roundRect(x + 4, y + 3, Math.max(w - 8, 3), Math.max(h * 0.14, 3), 2);
      ctx.fill();
    };
    cyl(armX - 6, midY - 26, armLen + 6, 52, '#0F221D', 5);
    cyl(side === 'L' ? -6 : faceX + armLen * 0.45, midY - 15, armLen * 0.55 + 6, 30, '#193830', 5);
    for (const ry of [PLATE_TOP + 34, FLOOR - 48]) cyl(armX - 6, ry, armLen + 6, 14, '#0F221D', 4);

    /* wall mount flange with bolt heads */
    cyl(side === 'L' ? -8 : W - 14, PLATE_TOP + 8, 22, FLOOR - PLATE_TOP - 16, '#193830', 5);
    const fbx = side === 'L' ? 9 : W - 9;
    for (const fy of [PLATE_TOP + 30, midY, FLOOR - 34]) {
      ctx.fillStyle = '#C6FF3D';
      ctx.beginPath(); ctx.arc(fbx, fy, 3, 0, 7); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
    }

    /* plate body */
    const plateH = FLOOR - PLATE_TOP;
    const pg = ctx.createLinearGradient(plateX, 0, plateX + PLATE_W, 0);
    if (side === 'L') { pg.addColorStop(0, shade('#0F221D', 1.18)); pg.addColorStop(1, shade('#0F221D', 0.66)); }
    else { pg.addColorStop(0, shade('#0F221D', 0.66)); pg.addColorStop(1, shade('#0F221D', 1.18)); }
    ctx.beginPath();
    ctx.roundRect(plateX - 1, PLATE_TOP - 2, PLATE_W + 2, plateH + 2, 4);
    ctx.fillStyle = pg;
    ctx.fill();
    ctx.strokeStyle = INK;
    ctx.lineWidth = 2.6;
    ctx.stroke();

    /* hazard stripes on the pressing face */
    const fx = side === 'L' ? faceX - 6 : faceX;
    ctx.save();
    ctx.beginPath();
    ctx.rect(fx, PLATE_TOP, 6, FLOOR - PLATE_TOP);
    ctx.clip();
    ctx.fillStyle = '#00FF9C';
    ctx.fillRect(fx, PLATE_TOP, 6, FLOOR - PLATE_TOP);
    ctx.fillStyle = '#050D0B';
    for (let y = PLATE_TOP - 12; y < FLOOR; y += 16) {
      ctx.beginPath();
      ctx.moveTo(fx, y + 8); ctx.lineTo(fx + 6, y); ctx.lineTo(fx + 6, y + 8); ctx.lineTo(fx, y + 16);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    /* bolt heads down the plate spine */
    const bx = plateX + (side === 'L' ? 6 : PLATE_W - 6);
    for (const by of [PLATE_TOP + 16, midY, FLOOR - 22]) {
      ctx.fillStyle = '#C6FF3D';
      ctx.beginPath(); ctx.arc(bx, by, 3.2, 0, 7); ctx.fill();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      ctx.beginPath(); ctx.arc(bx - 1, by - 1, 1, 0, 7); ctx.fill();
    }

    /* pressure gauge riding the top of each plate */
    if (pressing || press.state === 'release') {
      const gx = plateX + PLATE_W / 2, gy = PLATE_TOP - 22;
      const drivePos = 1 - (press.faceR - press.faceL - press.gapTarget) / (WALL_R - WALL_L - press.gapTarget || 1);
      const p = press.state === 'hold' ? 1 : press.state === 'release' ? Math.max(0, 1 - press.t * 1.4) : Math.max(0, Math.min(1, drivePos));
      ctx.fillStyle = '#193830';
      ctx.beginPath(); ctx.arc(gx, gy, 14, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#00FF9C'; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.strokeStyle = INK; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(gx, gy, 15.6, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = '#8DAFA3';
      ctx.beginPath(); ctx.arc(gx, gy, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.beginPath(); ctx.ellipse(gx - 4, gy - 5, 3, 1.8, -0.6, 0, Math.PI * 2); ctx.fill();
      /* red zone */
      ctx.strokeStyle = '#FF4A2B'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(gx, gy, 8, -0.9, 0.5); ctx.stroke();
      /* needle sweeps into the red as pressure builds */
      const ang = -Math.PI * 0.95 + p * (Math.PI * 1.15) + (press.state === 'hold' && !reduceMotion ? Math.sin(t * 40) * 0.1 : 0);
      ctx.strokeStyle = '#050D0B'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(gx, gy);
      ctx.lineTo(gx + Math.cos(ang) * 8.5, gy + Math.sin(ang) * 8.5);
      ctx.stroke();
    }
  }

  function drawParticles(dt) {
    for (const p of particles) {
      p.vy += 1300 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.y > FLOOR - p.r) { p.y = FLOOR - p.r; p.vy *= -0.4; p.vx *= 0.7; }
      p.life -= dt * 1.4;
      if (p.life <= 0) continue;
      ctx.globalAlpha = Math.min(1, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.5 + p.life * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    particles = particles.filter(p => p.life > 0);
  }

  function drawGlass() {
    /* soft vignette so the cave feels deep */
    const vg = ctx.createRadialGradient(W / 2, H * 0.45, H * 0.35, W / 2, H * 0.5, H * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(2,7,6,0.22)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  /* ── main loop ── */
  let last = performance.now();
  let simTime = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    simTime += dt;

    /* feed queue → spit blobs one at a time */
    feedTimer -= dt;
    if (feedQueue.length && feedTimer <= 0) {
      spitBlob(feedQueue.shift());
      feedTimer = 0.42;
    }
    tubeSquish = Math.max(0, tubeSquish - dt * 4);

    if (isPressing()) updatePress(dt);

    /* the user's hand: spring the grabbed blob toward the pointer */
    if (grab) {
      const b = grab.blob;
      if (!blobs.includes(b)) grab = null;
      else {
        const c = b.center();
        let dx = (mouse.x - grab.offx) - c.x;
        let dy = (mouse.y - grab.offy) - c.y;
        const mag = Math.hypot(dx, dy);
        const cap = 60;                     // the goo lags behind a fast hand
        if (mag > cap) { dx *= cap / mag; dy *= cap / mag; }
        for (const n of b.nodes) {
          n.x += dx * 0.4;  n.y += dy * 0.4;
          n.px += dx * 0.34; n.py += dy * 0.34;   // damp so it doesn't slingshot
        }
      }
    }

    /* physics substeps */
    const SUB = 3;
    const sdt = dt / SUB;
    lastSdt = sdt;
    for (let s = 0; s < SUB; s++) {
      for (const b of blobs) b.integrate(sdt);
      for (let it = 0; it < 3; it++) {
        for (const b of blobs) b.constrain();
        collideBlobs();
      }
    }

    /* hover pick (topmost = last drawn) */
    hoverBlob = grab ? grab.blob : null;
    if (!hoverBlob && mouse.x >= 0) {
      for (let i = blobs.length - 1; i >= 0; i--) {
        if (blobs[i].contains(mouse.x, mouse.y)) { hoverBlob = blobs[i]; break; }
      }
    }
    canvas.style.cursor = grab ? 'grabbing' : (hoverBlob ? 'grab' : 'default');

    /* draw */
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.save();
    if (shake > 0.2) {
      ctx.translate(rnd(-shake, shake) * 0.5, rnd(-shake, shake) * 0.5);
      shake *= Math.pow(0.001, dt); // fast decay
    } else shake = 0;

    drawChamber();
    blobs.forEach(b => {
      const idx = b.entry ? files.findIndex(f => f.id === b.entry.id) : -1;
      b.draw(simTime, b === hoverBlob, idx);
    });
    drawPiston('L', simTime);
    drawPiston('R', simTime);
    drawFeedPipe();
    drawHopper(simTime);
    drawParticles(dt);
    drawGlass();

    if (flash > 0.02) {
      ctx.globalAlpha = flash;
      ctx.fillStyle = '#E4F3EC';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
      flash *= Math.pow(0.0001, dt);
    }
    ctx.restore();

    updateTip();
    requestAnimationFrame(frame);
  }

  /* hover tooltip (HTML overlay so long filenames wrap nicely) */
  function updateTip() {
    const tip = $('blobTip');
    if (!hoverBlob) { tip.classList.remove('show'); return; }
    const rect = canvas.getBoundingClientRect();
    const sx = rect.width / W, sy = rect.height / H;
    if (hoverBlob.segments) {
      const m = hoverBlob.mergedInfo;
      tip.innerHTML = `<span class="tip-label">Merged</span>` +
        `<span class="tip-name">${esc(m.name)}</span>` +
        `<span class="tip-meta">${m.pages} page${m.pages !== 1 ? 's' : ''} &middot; ${files.length} documents</span>`;
    } else {
      const e = hoverBlob.entry;
      const idx = files.findIndex(f => f.id === e.id);
      const pages = e.pages == null ? '&hellip;' : (e.pages === '?' ? '? pages' : e.pages + (e.pages === 1 ? ' page' : ' pages'));
      tip.innerHTML = `<span class="tip-label">Doc ${idx + 1} of ${files.length}</span>` +
        `<span class="tip-name">${esc(e.name)}</span>` +
        `<span class="tip-meta">${fmtSize(e.size)} &middot; ${pages}</span>`;
    }
    const c = hoverBlob.center();
    let left = c.x * sx + 18, top = c.y * sy - 14;
    tip.style.left = Math.min(left, rect.width - 250) + 'px';
    tip.style.top = Math.max(6, top) + 'px';
    tip.classList.add('show');
  }

  /* ── canvas sizing + input ── */
  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.width * (H / W) * dpr);
    canvas.style.height = (rect.width * H / W) + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  function updateMouse(e) {
    const rect = canvas.getBoundingClientRect();
    mouse.x = (e.clientX - rect.left) / rect.width * W;
    mouse.y = (e.clientY - rect.top) / rect.height * H;
  }

  function releaseGrab() {
    if (!grab) return;
    const b = grab.blob;
    if (blobs.includes(b)) {
      /* throw: velocity from the last ~130ms of pointer motion */
      const now = performance.now();
      const h = grab.hist.filter(p => now - p.t < 130);
      if (h.length >= 2) {
        const a = h[0], z = h[h.length - 1];
        const span = Math.max((z.t - a.t) / 1000, 0.016);
        let vx = (z.x - a.x) / span, vy = (z.y - a.y) / span;
        const sp = Math.hypot(vx, vy), CAP = 1500;
        if (sp > CAP) { vx *= CAP / sp; vy *= CAP / sp; }
        for (const n of b.nodes) { n.px = n.x - vx * lastSdt; n.py = n.y - vy * lastSdt; }
      }
      /* a quick tap without movement is just a poke */
      if (now - grab.t0 < 220 && !grab.moved) b.impulse(4);
    }
    grab = null;
  }

  canvas.addEventListener('pointerdown', e => {
    updateMouse(e);
    if (isPressing() && press.state !== 'release') return;  // hands off mid-squeeze
    for (let i = blobs.length - 1; i >= 0; i--) {
      const b = blobs[i];
      const c = b.center();
      if (b.contains(mouse.x, mouse.y) || Math.hypot(mouse.x - c.x, mouse.y - c.y) < b.r * 0.9) {
        grab = {
          blob: b,
          offx: mouse.x - c.x, offy: mouse.y - c.y,
          hist: [{ x: mouse.x, y: mouse.y, t: performance.now() }],
          moved: false, t0: performance.now()
        };
        try { canvas.setPointerCapture(e.pointerId); } catch {}
        e.preventDefault();
        break;
      }
    }
  });

  canvas.addEventListener('pointermove', e => {
    updateMouse(e);
    if (grab) {
      const h = grab.hist;
      const last = h[h.length - 1];
      if (Math.hypot(mouse.x - h[0].x, mouse.y - h[0].y) > 6) grab.moved = true;
      if (performance.now() - last.t > 12) {
        h.push({ x: mouse.x, y: mouse.y, t: performance.now() });
        if (h.length > 10) h.shift();
      }
    } else if (hoverBlob && !hoverBlob._wobbled) {
      hoverBlob.impulse(1.4);
      hoverBlob._wobbled = true;
      setTimeout(() => { if (hoverBlob) hoverBlob._wobbled = false; }, 400);
    }
  });

  canvas.addEventListener('pointerup', releaseGrab);
  canvas.addEventListener('pointercancel', releaseGrab);
  canvas.addEventListener('pointerleave', () => { if (!grab) { mouse.x = -1; mouse.y = -1; } });

  requestAnimationFrame(t => { last = t; frame(t); });

  return {
    feed, pop, clear, fuse, unfuse, isPressing, abortPress,
    press: pressAction,
    hasBlobs: () => blobs.length > 0,
    /* test/debug introspection: blob bounds in canvas coordinates */
    _debug: () => blobs.map(b => {
      const bb = b.bbox(), c = b.center();
      return { ...bb, cx: c.x, cy: c.y, merged: !!b.segments };
    })
  };
})();

/* ═══════════════════════════════════════════════════════════════
   DOWNLOAD-BUTTON GOO — a glass tank holding one slice of goo per
   pressed document, in the same colors as their blobs. Calm ripples
   at rest; hovering turns up the heat and it boils.
   ═══════════════════════════════════════════════════════════════ */
const dlGoo = (() => {
  const btn = $('dlBtn');
  const cvs = document.createElement('canvas');
  cvs.id = 'dlGooCvs';
  btn.prepend(cvs);
  const g2 = cvs.getContext('2d');
  let raf = null, W = 0, H = 0, n = 0, tPrev = 0;
  let h, v, colors = [], bubbles = [], swirls = [], hover = false, churn = 0;

  btn.addEventListener('mouseenter', () => { hover = true; });
  btn.addEventListener('mouseleave', () => { hover = false; });
  btn.addEventListener('pointerdown', () => { hover = true; setTimeout(() => hover = false, 900); });

  function build() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = btn.getBoundingClientRect();
    W = r.width; H = r.height;
    cvs.width = Math.round(W * dpr);
    cvs.height = Math.round(H * dpr);
    g2.setTransform(dpr, 0, 0, dpr, 0, 0);
    n = Math.max(24, Math.round(W / 4));
    h = new Float32Array(n).fill(H * 0.66);   // a generous pour
    v = new Float32Array(n);
    bubbles = [];
    /* two swirl-blobs of goo per document, anchored near their slice */
    swirls = [];
    const m = colors.length || 1;
    colors.forEach((c, k) => {
      for (let s = 0; s < 2; s++) {
        swirls.push({
          c,
          ax: W * (k + 0.5) / m + (Math.random() - 0.5) * 30,
          ay: H * 0.75 + (Math.random() - 0.5) * 14,
          ampX: 14 + Math.random() * 22,
          ampY: 5 + Math.random() * 9,
          sp: 0.4 + Math.random() * 0.5,
          ph: Math.random() * 6.28,
          r: H * (0.45 + Math.random() * 0.3)
        });
      }
    });
  }

  function frame(t) {
    tPrev = t;
    /* surface waves: neighbor springs, viscous damping */
    for (let i = 0; i < n; i++) {
      const l = i > 0 ? h[i - 1] : h[i], r = i < n - 1 ? h[i + 1] : h[i];
      v[i] = (v[i] + ((l + r) / 2 - h[i]) * 0.4) * 0.93;
    }
    let sum = 0;
    for (let i = 0; i < n; i++) {
      h[i] += v[i];
      if (h[i] > H - 8) { h[i] = H - 8; v[i] *= -0.3; }
      else if (h[i] < 6) { h[i] = 6; v[i] *= -0.3; }
      sum += h[i];
    }
    /* goo is conserved: clamps must never drain the tank */
    const topUp = (n * H * 0.66 - sum) / n;
    for (let i = 0; i < n; i++) h[i] += topUp;
    /* heat: gentle at rest, rolling boil on hover */
    if (!reduceMotion && Math.random() < (hover ? 0.9 : 0.05)) {
      v[(Math.random() * n) | 0] += (Math.random() - 0.5) * (hover ? 4.5 : 1.1);
    }
    if (!reduceMotion && Math.random() < (hover ? 0.55 : 0.012)) {
      bubbles.push({ x: 4 + Math.random() * (W - 8), y: H - 3, r: 1.5 + Math.random() * 2.8, vy: 0.5 + Math.random() });
    }

    g2.clearRect(0, 0, W, H);
    const tt = t / 1000;
    churn += ((hover ? 1 : 0) - churn) * 0.05;   // heat eases in and out

    /* the liquid body: all document colors blended across the width */
    const grad = g2.createLinearGradient(0, 0, W, 0);
    const m = colors.length || 1;
    colors.forEach((c, k) => grad.addColorStop(m === 1 ? 0.5 : k / (m - 1), c));
    if (!colors.length) grad.addColorStop(0.5, '#6BE675');
    g2.globalAlpha = 0.95;
    g2.beginPath();
    g2.moveTo(0, H);
    for (let i = 0; i < n; i++) g2.lineTo((i / (n - 1)) * W, H - h[i]);
    g2.lineTo(W, H);
    g2.closePath();
    g2.fillStyle = grad;
    g2.fill();
    g2.globalAlpha = 1;

    /* swirling color clouds INSIDE the liquid — hover churns the mix */
    g2.globalCompositeOperation = 'source-atop';
    for (const s of swirls) {
      const speed = s.sp * (1 + churn * 3.5);
      const x = s.ax + Math.cos(tt * speed * 2 + s.ph) * s.ampX * (1 + churn * 1.6);
      const y = s.ay + Math.sin(tt * speed * 3.1 + s.ph * 2) * s.ampY * (1 + churn * 1.8);
      if (churn > 0.05) {           /* stirring makes anchors wander → real mixing */
        s.ax += (Math.random() - 0.5) * churn * 1.6;
        s.ax = Math.max(10, Math.min(W - 10, s.ax));
      }
      const rg = g2.createRadialGradient(x, y, 0, x, y, s.r);
      rg.addColorStop(0, s.c);
      rg.addColorStop(0.65, s.c + '59');
      rg.addColorStop(1, s.c + '00');
      g2.fillStyle = rg;
      g2.beginPath(); g2.arc(x, y, s.r, 0, 7); g2.fill();
    }
    /* bubbles rise and pop with a little splash kick */
    bubbles = bubbles.filter(b => {
      b.y -= b.vy * (hover ? 1.7 : 1);
      const i = Math.max(0, Math.min(n - 1, Math.round((b.x / W) * (n - 1))));
      if (b.y <= H - h[i] + b.r) { v[i] -= 1.7; return false; }
      g2.fillStyle = 'rgba(255,255,255,0.55)';
      g2.beginPath(); g2.arc(b.x, b.y, b.r, 0, 7); g2.fill();
      return true;
    });
    g2.globalCompositeOperation = 'source-over';
    /* meniscus */
    g2.strokeStyle = 'rgba(255,255,255,0.8)';
    g2.lineWidth = 2.5;
    g2.lineCap = 'round';
    g2.beginPath();
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * W, y = H - h[i];
      i ? g2.lineTo(x, y) : g2.moveTo(x, y);
    }
    g2.stroke();
    /* glass streak */
    g2.fillStyle = 'rgba(255,255,255,0.15)';
    g2.beginPath();
    g2.moveTo(W * 0.07, 0); g2.lineTo(W * 0.19, 0); g2.lineTo(W * 0.11, H); g2.lineTo(W * -0.01, H);
    g2.closePath();
    g2.fill();

    if (!reduceMotion) raf = requestAnimationFrame(frame);
  }

  return {
    start(cols) {
      colors = cols;
      cancelAnimationFrame(raf);
      requestAnimationFrame(t0 => { build(); frame(t0); });
    },
    stop() { cancelAnimationFrame(raf); }
  };
})();

/* ═══════════════════════════════════════════════════════════════
   CONVEYOR — dropped PDFs travel a pipe from the dropbox straight
   into the machine's hopper. The story writes itself.
   ═══════════════════════════════════════════════════════════════ */
const conveyor = (() => {
  const svg = $('connector');
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  };
  /* cylinder illusion: shadow → dark rim → body → lit core → glass shine */
  const shadow  = mk('path', { fill: 'none', stroke: 'rgba(5,13,11,0.16)', 'stroke-width': 33, 'stroke-linecap': 'round' });
  const outline = mk('path', { fill: 'none', stroke: '#0F221D', 'stroke-width': 30, 'stroke-linecap': 'round' });
  const body    = mk('path', { fill: 'none', stroke: '#2A5B4E', 'stroke-width': 23, 'stroke-linecap': 'round' });
  const core    = mk('path', { fill: 'none', stroke: '#00B871', 'stroke-width': 12, 'stroke-linecap': 'round' });
  const shine   = mk('path', { fill: 'none', stroke: 'rgba(255,255,255,0.5)', 'stroke-width': 4.5, 'stroke-linecap': 'round' });
  const collarA = mk('rect', { fill: '#00FF9C', stroke: '#193830', 'stroke-width': 2, width: 38, height: 13, rx: 3 });
  const fittings = mk('g', {});
  /* the hopper's rim lip, standing proud of the box top for depth */
  const crown = mk('rect', { fill: '#0F221D', stroke: '#193830', 'stroke-width': 4, rx: 8, height: 17 });
  const crownHi = mk('rect', { fill: 'rgba(255,255,255,0.35)', rx: 2, height: 4 });
  svg.append(shadow, outline, body, core, shine, fittings, collarA, crown, crownHi);
  let len = 0, ready = false;

  /* ── THE SWAN-NECK LIFT ───────────────────────────────────────────
     One hand-drawn route, all tangent arcs, no sharp cuts:
     it drops out of the BOTTOM of the dropbox, U-turns upward, rises
     through the gutter between the two cards, crests in the band under
     the title, and plunges straight down into the TOP of the press.  */
  function layout() {
    if (window.innerWidth <= 880) { svg.style.display = 'none'; ready = false; return; }
    svg.style.display = 'block';
    const wb = $('main').getBoundingClientRect();
    const dz = $('dz').getBoundingClientRect();
    const mc = $('machine').getBoundingClientRect();
    const R = 34;
    const side = document.querySelector('.side').getBoundingClientRect();
    const gutterX = ((mc.right - wb.left) + (dz.left - wb.left)) / 2;
    const sx = dz.left - wb.left + dz.width * 0.5;    // exit at the dropbox floor, center
    const sy = dz.bottom - wb.top - 2;
    const ex = mc.left - wb.left + mc.width * 0.5;    // dead-aligned with the funnel below
    const ey = mc.top - wb.top + 30;
    const topY = mc.top - wb.top - 26;                // crest, in the band under the title
    const dip = side.bottom - wb.top + 38;            // hook under the whole right column
    const d =
      `M ${sx} ${sy}` +
      ` L ${sx} ${dip - R}` +
      ` A ${R} ${R} 0 0 1 ${sx - R} ${dip}` +
      ` L ${gutterX + R} ${dip}` +
      ` A ${R} ${R} 0 0 1 ${gutterX} ${dip - R}` +
      ` L ${gutterX} ${topY + R}` +
      ` A ${R} ${R} 0 0 0 ${gutterX - R} ${topY}` +
      ` L ${ex + R} ${topY}` +
      ` A ${R} ${R} 0 0 0 ${ex} ${topY + R}` +
      ` L ${ex} ${ey}`;
    for (const p of [outline, body, core, shine]) p.setAttribute('d', d);
    shadow.setAttribute('d', d);
    shadow.setAttribute('transform', 'translate(3 5)');
    collarA.setAttribute('x', sx - 19);  collarA.setAttribute('y', sy - 7);
    /* hopper rim lip: pokes ~7px above the box edge, rest hides behind it */
    const scale = mc.width / 600;
    const crownW = 166 * scale;
    const crownY = mc.top - wb.top - 7;
    crown.setAttribute('x', ex - crownW / 2);   crown.setAttribute('y', crownY);
    crown.setAttribute('width', crownW);
    crownHi.setAttribute('x', ex - crownW / 2 + 9); crownHi.setAttribute('y', crownY + 3);
    crownHi.setAttribute('width', crownW * 0.5);
    /* one gold union halfway up the gutter rise */
    fittings.innerHTML = '';
    fittings.appendChild(mk('rect', {
      fill: '#00FF9C', stroke: '#193830', 'stroke-width': 2, rx: 3,
      x: gutterX - 17, y: (dip + topY) / 2 - 7, width: 34, height: 14
    }));
    len = body.getTotalLength();
    ready = true;
  }

  const queue = [];
  let busy = false;
  function pump() {
    if (busy || !queue.length) return;
    const entry = queue.shift();
    if (!files.some(f => f.id === entry.id)) { pump(); return; }
    if (!ready) { machine.feed(entry); setTimeout(pump, 60); return; }
    busy = true;
    /* a little paper parcel tumbles down the pipe */
    const pkg = mk('g', {});
    pkg.append(
      mk('rect', { x: -8, y: -10, width: 16, height: 20, fill: '#FFFFFF', stroke: '#193830', 'stroke-width': 2, rx: 2 }),
      mk('rect', { x: -4.5, y: -5, width: 9, height: 2.5, fill: entry.color }),
      mk('rect', { x: -4.5, y: -0.5, width: 9, height: 2.5, fill: '#2A5B4E' })
    );
    svg.appendChild(pkg);
    /* travel time is CONSTANT no matter how long tonight's pipe is —
       the parcel simply moves faster through longer plumbing */
    const t0 = performance.now(), DUR = 900;
    (function step(now) {
      const k = Math.min((now - t0) / DUR, 1);
      const e = k * k * (3 - 2 * k);
      const pt = body.getPointAtLength(e * len);
      pkg.setAttribute('transform', `translate(${pt.x} ${pt.y}) rotate(${e * 300}) scale(${1 - e * 0.3})`);
      if (k < 1) requestAnimationFrame(step);
      else {
        pkg.remove();
        /* short beat while it travels the in-canvas corner pipe */
        setTimeout(() => { if (files.some(f => f.id === entry.id)) machine.feed(entry); }, 260);
        busy = false;
        setTimeout(pump, 200);
      }
    })(performance.now());
  }

  const ro = new ResizeObserver(layout);
  ro.observe(document.body);
  ro.observe(document.querySelector('.side'));   // queue growing/shrinking refits the hook
  requestAnimationFrame(layout);
  return {
    send(entry) { queue.push(entry); pump(); },
    clear() { queue.length = 0; }
  };
})();

/* ═══════════════════════════════════════════════════════════════
   WIRING
   ═══════════════════════════════════════════════════════════════ */
function wireDropTarget(el) {
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag-over'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
  el.addEventListener('drop', e => {
    e.preventDefault();
    el.classList.remove('drag-over');
    addFiles(e.dataTransfer.files);
  });
}
wireDropTarget($('dropCard'));
wireDropTarget($('machineCard'));

$('dz').addEventListener('click', () => $('fileInput').click());
$('dz').addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('fileInput').click(); }
});
$('fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
$('pressBtn').addEventListener('click', pressIt);
$('clearBtn').addEventListener('click', clearAll);

renderList();
</script>
