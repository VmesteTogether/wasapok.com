<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'self'; form-action 'none'; object-src 'none';">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050D0B">

<title>VmesteSoft</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vmestesoft.css">

<style>
html, body { height: 100%; overflow: hidden; }
body { background: var(--void); }

#scene {
  position: fixed; inset: 0;
  display: block;
  z-index: 0;
}

/* Each orb is a real link sitting over its own patch of the canvas, so the
   scene is clickable, tabbable and readable without seeing the art at all. */
.orb-link {
  position: absolute;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  text-decoration: none;
  z-index: 2;
  padding-bottom: 2px;
  -webkit-tap-highlight-color: transparent;
}
.orb-link span {
  font-family: var(--shout); font-weight: 800; font-size: 17px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ash);
  transition: color 100ms linear;
  white-space: nowrap;
}
.orb-link:hover span, .orb-link:focus-visible span { color: var(--hue, var(--acid)); }
.orb-link:focus-visible { outline: 1px solid var(--hue, var(--acid)); outline-offset: 4px; }

/* The one piece of chrome left: a way back into the system. */
.jump {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
  display: flex; justify-content: center; gap: 2px;
  padding: 14px;
  opacity: 0; pointer-events: none;
  transition: opacity 160ms linear;
}
.jump:focus-within { opacity: 1; pointer-events: auto; }
.jump a {
  font-family: var(--mono); font-size: var(--t-micro); font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ash); text-decoration: none;
  padding: 6px 10px; border: 1px solid var(--line);
}
.jump a:focus-visible { color: var(--acid); border-color: var(--acid); }
</style>
</head>
<body>

<h1 class="sr-only">VmesteSoft</h1>

<canvas id="scene" aria-hidden="true"></canvas>

<nav id="orbs" aria-label="Tools"></nav>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════
   One character grid holds the whole page.

   The wordmark is a 5×7 bitmap extruded into voxels, rotated and
   projected each frame with a depth test — the ASCII ramp is chosen
   by depth, so the letters read as solid rather than outlined.

   The tools are distorted spheres shaded into the same grid: a radius
   modulated by summed sines, lit from within rather than from a light
   source, and a churn term so the surface moves instead of just spinning.
   Each carries its own hue; the wordmark keeps the house accent.
   ════════════════════════════════════════════════════════════════ */

const LABEL_PX = 26;   // room under each sphere for its name
const RAMP = ' .:-=+*#%@';                     // 0 is empty
const GLITCH = '/\\|<>[]{}!?$&#@%*';            // what the cursor corrupts it into
const GLYPHSET = RAMP + GLITCH;                // chars[] indexes this

/* The wordmark keeps the house accent. */
const TITLE_BANDS = [
  'rgba(0,184,113,0.30)',   // deep in the extrusion
  'rgba(0,184,113,0.62)',   // mid
  '#00B871',                // near
  '#00FF9C'                 // the face
];

/* One hue per tool, swept across cyan → green → lime. Keeping them analogous
   is what lets six accents share a screen and still read as a set; each is
   placed so it differs from its neighbours in the grid. */
const ORB_HUES = [
  '#00FF9C',   // compress   — the house accent
  '#4DB8FF',   // format     — sky
  '#C6FF3D',   // merge      — lime
  '#00E5FF',   // qr         — cyan
  '#7CFF4D',   // vmestenize — spring
  '#29E0C4'    // haiku      — teal
];

/* Five steps per hue: four shades through the sphere, plus a light tint that
   the hovered orb shifts up into. */
function shadesOf(hex) {
  const r = parseInt(hex.slice(1, 3), 16),
        g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
  const a = v => 'rgba(' + r + ',' + g + ',' + b + ',' + v + ')';
  const lift = c => Math.min(255, Math.round(c + (255 - c) * 0.55));
  return [a(0.26), a(0.52), a(0.80), hex,
          'rgb(' + lift(r) + ',' + lift(g) + ',' + lift(b) + ')'];
}

// band ids: 0-3 the wordmark, then five per orb
const ORB_BAND0 = TITLE_BANDS.length;
const ORB_STEPS = 5;
const BANDS = TITLE_BANDS.concat(...ORB_HUES.map(shadesOf));

// the cursor eruption paints in its own two colours, over everything else
const GLITCH_BAND = BANDS.length;
const GLITCH_HOT  = BANDS.length + 1;
BANDS.push('#C6FF3D', '#EAFFB0');

const TOOLS = [
  { n: '01', label: 'Compress',   href: 'compressor/index.html'  },
  { n: '02', label: 'Format',     href: 'formatter/index.html'   },
  { n: '03', label: 'Merge',      href: 'merger/index.html'      },
  { n: '04', label: 'QR',         href: 'qr/index.html'          },
  { n: '05', label: 'Vmestenize', href: 'vmestenizer/index.html' },
  { n: '06', label: 'Haiku',      href: 'haiku/index.html'       }
];

/* ── 5×7 glyphs, only the letters the wordmark needs ── */
const GLYPHS = {
  // caps — the two the name carries
  V: ['#...#', '#...#', '#...#', '#...#', '#...#', '.#.#.', '..#..'],
  S: ['.####', '#....', '#....', '.###.', '....#', '....#', '####.'],
  // lowercase, sitting on the baseline; ascenders on f and t
  m: ['.....', '.....', '#####', '#.#.#', '#.#.#', '#.#.#', '#.#.#'],
  e: ['.....', '.....', '.###.', '#...#', '#####', '#....', '.###.'],
  s: ['.....', '.....', '.####', '#....', '.###.', '....#', '####.'],
  o: ['.....', '.....', '.###.', '#...#', '#...#', '#...#', '.###.'],
  t: ['.#...', '.#...', '####.', '.#...', '.#...', '.#...', '..##.'],
  f: ['..##.', '.#...', '####.', '.#...', '.#...', '.#...', '.#...']
};
/* One line where it fits, two where it doesn't. Either way it is the same
   ten letters, and letters 6-9 are SOFT — which is what the brighter band
   keys off, so the wordmark reads identically in both layouts. */
let LINES = ['VmesteSoft'];
const SOFT_AT = 6;                              // letters 6-9 are 'Soft'

/* Stable hash — the hand-drawn wobble has to be the SAME every frame, or the
   letters boil. Seeded by letter and voxel, never by time. */
function hash01(n) {
  n = (n ^ 61) ^ (n >>> 16);
  n = n + (n << 3);
  n = n ^ (n >>> 4);
  n = Math.imul(n, 0x27d4eb2d);
  n = n ^ (n >>> 15);
  return ((n >>> 0) % 100000) / 100000;
}

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d', { alpha: false });
const nav = document.getElementById('orbs');
const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

let W, H, dpr, cols, rows, charW, charH, fontPx;
let chars, band, tz, tset;
let voxels = null, voxCount = 0;
let hovered = -1;

/* Cursor eruption on the wordmark. The pointer is kept in cell coordinates
   and its strength eased, so the effect arrives and leaves continuously
   instead of snapping. Under reduced motion it never engages. */
let mCol = -999, mRow = -999, mAmt = 0, mTarget = 0;
addEventListener('pointermove', e => {
  if (!charW) return;
  mCol = e.clientX / charW;
  mRow = e.clientY / charH;
  mTarget = 1;
}, { passive: true });
addEventListener('pointerleave', () => { mTarget = 0; }, { passive: true });
addEventListener('blur', () => { mTarget = 0; });

/* ── build the extruded wordmark once; only projection runs per frame ── */
const GAP = 9;                                  // per-letter advance, 5 wide + 4 clear
function lineWidth(w) { return w.length * GAP - (GAP - 5); }
function blockWidth() { return Math.max(...LINES.map(lineWidth)); }

function buildVoxels(sub, deep) {
  const out = [];
  const lineH = 7, lead = 9;                    // glyph height, line advance
  const blockH = LINES.length * lead - (lead - lineH);

  let letter = 0;                               // index across the whole wordmark
  LINES.forEach((word, wi) => {
    const w = lineWidth(word);
    for (let li = 0; li < word.length; li++, letter++) {
      const g = GLYPHS[word[li]];
      if (!g) continue;

      /* Hand-drawn, not machine-set: every letter gets its own small tilt,
         baseline drift and size, and every voxel a little edge wobble. All of
         it is seeded by index rather than time, so the letterforms hold still
         instead of boiling. */
      const rot = (hash01(letter * 7 + 1) - 0.5) * 0.17;   // ±5°
      const dx  = (hash01(letter * 7 + 2) - 0.5) * 0.55;
      const dy  = (hash01(letter * 7 + 3) - 0.5) * 0.55;
      const sc  = 0.93 + hash01(letter * 7 + 4) * 0.13;
      const ct = Math.cos(rot), st = Math.sin(rot);

      for (let by = 0; by < lineH; by++) {
        for (let bx = 0; bx < 5; bx++) {
          if (g[by][bx] !== '#') continue;
          for (let sy = 0; sy < sub; sy++) {
            for (let sx = 0; sx < sub; sx++) {
              // local coords about the letter's own centre
              const seed = letter * 977 + by * 61 + bx * 7 + sy * 3 + sx;
              let lx = bx + sx / sub - 2 + (hash01(seed) - 0.5) * 0.46;
              let ly = by + sy / sub - 3 + (hash01(seed + 51) - 0.5) * 0.46;

              const rx = (lx * ct - ly * st) * sc + dx;
              const ry = (lx * st + ly * ct) * sc + dy;

              const px = li * GAP + 2 + rx - w / 2;
              const py = wi * lead + 3 + ry - blockH / 2;

              for (let z = 0; z < deep; z++) {
                out.push(
                  px, py,
                  (z / (deep - 1) - 0.5) * (deep * 0.26),
                  z / deep + (letter >= SOFT_AT ? 1 : 0)   // depth (< 1), + soft flag
                );
              }
            }
          }
        }
      }
    }
  });
  voxCount = out.length / 4;
  voxels = Float32Array.from(out);
}

function layout() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  // a zero viewport (hidden tab, pane not yet sized) would clamp the grid to
  // its minimum and bake a broken scene; wait for a real one instead
  if (W < 2 || H < 2) { requestAnimationFrame(layout); return; }
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  fontPx = W < 620 ? 6 : W < 1000 ? 7 : 7;
  // one line needs ~68 cells of width to stay legible; below that it stacks
  LINES = W < 900 ? ['Vmeste', 'Soft'] : ['VmesteSoft'];

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.font = '700 ' + fontPx + 'px "Space Mono", ui-monospace, monospace';
  ctx.textBaseline = 'top';

  charW = ctx.measureText('MMMMMMMMMM').width / 10;   // measured, never assumed
  charH = fontPx * 0.98;
  cols = Math.max(40, Math.floor(W / charW));
  rows = Math.max(30, Math.floor(H / charH));

  chars = new Uint8Array(cols * rows);
  band  = new Uint8Array(cols * rows);
  tz    = new Float32Array(cols * rows);
  tset  = new Uint8Array(cols * rows);

  // enough sub-samples that the projected voxels leave no holes
  const scale = titleScale();
  buildVoxels(Math.max(3, Math.min(4, Math.ceil(scale) + 1)), W < 620 ? 5 : 6);
}

function titleScale() {
  const blockH = LINES.length * 9 - 2;
  const wide = LINES.length === 1;
  return Math.min((cols * (wide ? 0.80 : 0.72)) / blockWidth(),
                  (rows * 0.34) / (blockH * 0.9));
}

/* ── the wordmark ── */
function drawTitle(t) {
  const yaw   = still ? 0.22 : Math.sin(t * 0.00042) * 0.24;
  const pitch = still ? 0.10 : Math.sin(t * 0.00031) * 0.13 + 0.06;
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);

  const scale = titleScale();
  const ox = cols / 2;
  const oy = rows * 0.18;
  const focal = 58;

  const aspect = charW / charH;
  const R = 7 + scale * 3.4;        // the hot zone scales with the wordmark
  const tick = (t * 0.055) | 0;     // corrupted glyphs hold ~18x/sec, so it
                                    // churns instead of fizzing white noise
  const live = mAmt > 0.01;

  for (let i = 0; i < voxCount; i++) {
    const v = i * 4;
    const vx = voxels[v], vy = voxels[v + 1], vz = voxels[v + 2], vd = voxels[v + 3];

    let x = vx * cy + vz * sy;
    let z = -vx * sy + vz * cy;
    const y = vy * cp - z * sp;
    z = vy * sp + z * cp;

    const k = focal / (focal + z);
    let fc = ox + x * scale * k;
    let fr = oy + y * scale * k * 0.9;

    /* Blow the letters apart around the cursor: push each voxel radially out
       of the hot zone, add per-voxel turbulence, and tear whole rows sideways.
       A voxel that moves simply stops writing the cell it left, so the
       wordmark opens into holes rather than smearing. */
    let erupt = 0;
    if (live) {
      const ddx = (fc - mCol) * aspect, ddy = fr - mRow;
      const dd = Math.hypot(ddx, ddy);
      if (dd < R) {
        const f = 1 - dd / R;
        erupt = f * f * mAmt;
        const inv = dd > 0.001 ? 1 / dd : 0;

        // swirl the neighbourhood around the cursor rather than throwing it
        // clear: the voxels stay put, so the letter survives as a melted
        // version of itself instead of vanishing into a hole
        const ang = erupt * 2.1;
        const ca = Math.cos(ang), sa = Math.sin(ang);
        let nx = ddx * ca - ddy * sa;
        let ny = ddx * sa + ddy * ca;

        // a travelling ripple, plus just enough outward bloom to read as pressure
        const rip = Math.sin(dd * 0.5 - t * 0.006) * erupt * 3.0 + erupt * R * 0.13;
        nx += ddx * inv * rip;
        ny += ddy * inv * rip;

        fc = mCol + nx / aspect;
        fr = mRow + ny;
        fc += Math.sin(t * 0.021 + i * 0.7) * erupt * 1.5;
        fr += Math.cos(t * 0.017 + i * 1.3) * erupt * 1.0;

        const tear = (((((fr | 0) * 374761393) ^ (tick * 668265263)) >>> 0) % 1000) / 1000;
        if (tear > 0.86) fc += (tear - 0.93) * 55 * erupt;
      }
    }

    const col = fc | 0;
    const row = fr | 0;
    if (col < 0 || col >= cols || row < 0 || row >= rows) continue;

    const through = vd % 1;                    // 0 at the face, 1 at the back
    const isSoft = vd >= 1;                    // the SOFT half of the wordmark

    const idx = row * cols + col;
    // shallowest-through wins: the face stays solid under any rotation, and
    // the extruded body only shows where the face doesn't cover
    if (tset[idx] && through >= tz[idx]) continue;
    tset[idx] = 1; tz[idx] = through;

    // Corruption is scattered, not solid: the chance a voxel turns into a
    // glitch glyph climbs with the eruption, so bright junk erupts THROUGH
    // the warped letters rather than replacing them.
    const roll = ((((i * 2654435761) ^ (tick * 40503)) >>> 0) % 1000) / 1000;
    // capped below 1 on purpose: even at the centre some voxels stay real
    // glyphs, so the warped letters never fully disappear behind the junk
    const pCorrupt = Math.min(0.72, (erupt - 0.20) / 0.42);

    if (pCorrupt > 0 && roll < pCorrupt) {
      const h = (((i * 40503) ^ (tick * 2654435761)) >>> 0) % GLITCH.length;
      chars[idx] = RAMP.length + h;
      band[idx] = erupt > 0.62 ? GLITCH_HOT : GLITCH_BAND;
    } else {
      const shade = 1 - through * 0.86;
      chars[idx] = 1 + Math.min(RAMP.length - 2, (shade * (RAMP.length - 1)) | 0);
      let b = through < 0.10 ? 3 : through < 0.36 ? 2 : through < 0.70 ? 1 : 0;
      if (!isSoft && b > 0) b -= 1;            // Vmeste reads a step cooler
      // ghost the letters under the eruption — still legible, just receding
      if (erupt > 0.05) b = Math.max(0, b - (erupt > 0.40 ? 2 : 1));
      band[idx] = b;
    }
  }
  tset.fill(0);
}

/* ── one distorted orb ── */
function drawOrb(o, t, hot) {
  const aspect = charW / charH;
  const amp = hot ? 0.32 : 0.24;
  const r = o.r * (hot ? 1.05 : 1);
  const reach = r * 1.42;

  const c0 = Math.max(0, Math.floor(o.x - reach / aspect));
  const c1 = Math.min(cols - 1, Math.ceil(o.x + reach / aspect));
  const r0 = Math.max(0, Math.floor(o.y - reach));
  const r1 = Math.min(rows - 1, Math.ceil(o.y + reach));

  for (let row = r0; row <= r1; row++) {
    const dy = row - o.y;
    for (let col = c0; col <= c1; col++) {
      const dx = (col - o.x) * aspect;
      const d = Math.hypot(dx, dy);
      if (d > reach) continue;

      // the distortion: three sines around the circumference, drifting
      const ang = Math.atan2(dy, dx);
      const rr = r * (1
        + amp * 0.55 * Math.sin(ang * 3 + t * 0.0017 + o.seed)
        + amp * 0.32 * Math.sin(ang * 5 - t * 0.0011 + o.seed * 2)
        + amp * 0.20 * Math.sin(ang * 8 + t * 0.0023));

      const idx = row * cols + col;

      if (d > rr) {
        // a thin corona, only where the surface has bulged outward
        if (d < rr * 1.10 && !chars[idx]) { chars[idx] = 1; band[idx] = o.b0 + (hot ? 1 : 0); }
        continue;
      }

      // the ball itself: lit from within, falling off to a dark limb
      const u = d / rr;
      const nz = Math.sqrt(Math.max(0, 1 - u * u));

      // plasma churn across the surface — three drifting waves, so the
      // brightness never settles into a fixed pattern
      const churn =
          0.42 * Math.sin(dx * 0.46 + t * 0.0026 + o.seed)
                * Math.sin(dy * 0.52 - t * 0.0019 + o.seed)
        + 0.30 * Math.sin((dx + dy) * 0.33 - t * 0.0015 + o.seed * 2)
        + 0.22 * Math.sin(d * 1.15 - t * 0.0034 + o.seed);

      let v = Math.pow(nz, 0.62) * (0.62 + 0.38 * churn)
            + 0.30 * nz * nz * nz;              // hot core

      v = Math.min(1, Math.max(0, v)) * o.dim;
      if (v < 0.10) continue;                   // leave the dead cells empty

      chars[idx] = 1 + Math.min(RAMP.length - 2, (v * (RAMP.length - 1)) | 0);
      // four steps through the sphere; hovering shifts the whole orb up one
      const lvl = (v > 0.70 ? 3 : v > 0.46 ? 2 : v > 0.24 ? 1 : 0) + (hot ? 1 : 0);
      band[idx] = o.b0 + lvl;
    }
  }
}

/* ── orb positions: a slow ring, tilted so some hang behind the others ── */
const orbs = TOOLS.map((tool, i) => ({
  tool, seed: i * 1.7, x: 0, y: 0, r: 0, dim: 1, z: 0,
  b0: ORB_BAND0 + i * ORB_STEPS      // where this orb's shades start in BANDS
}));

const links = orbs.map((o, i) => {
  const a = document.createElement('a');
  a.className = 'orb-link';
  a.href = o.tool.href;
  a.innerHTML = '<span>' + o.tool.label + '</span>';
  a.style.setProperty('--hue', ORB_HUES[i]);
  a.addEventListener('pointerenter', () => { hovered = i; });
  a.addEventListener('pointerleave', () => { if (hovered === i) hovered = -1; });
  a.addEventListener('focus', () => { hovered = i; });
  a.addEventListener('blur', () => { if (hovered === i) hovered = -1; });
  nav.appendChild(a);
  return a;
});

function placeOrbs(t) {
  // Derive the grid from the space that's actually left under the wordmark,
  // rather than fixing a shape that only works on one screen. Three across
  // when there's width for it, two when there isn't.
  const aspect = aspectOf();
  const perRow = cols >= 150 ? 3 : 2;
  const nRows = orbs.length / perRow;

  const clusterTop = rows * (perRow === 3 ? 0.40 : 0.34);
  const avail = rows * 0.98 - clusterTop;
  const cellH = avail / nRows;
  const cellW = (cols * 0.94) / perRow;

  // a sphere has to fit its cell in both directions, label included
  const baseR = Math.max(4, Math.min(
    (cellH - LABEL_PX / charH) / 2.5,      // height, minus room for the label
    (cellW * aspect) / 2.5,                // width, in the same units as rows
    17
  ));

  const colGap = cellW;
  const rowGap = cellH;
  const cx = cols / 2;
  const cy = clusterTop + avail / 2;

  for (let i = 0; i < orbs.length; i++) {
    const o = orbs[i];
    const gx = i % perRow, gy = (i / perRow) | 0;

    // each orb runs its own slow depth cycle, so the cluster breathes
    // instead of moving as one rigid object
    const zc = Math.sin(t * 0.00023 + i * 1.05);

    o.x = cx + (gx - (perRow - 1) / 2) * colGap
             + Math.sin(t * 0.00041 + i * 2.1) * 2.0;
    o.y = cy + (gy - (nRows - 1) / 2) * rowGap
             + Math.sin(t * 0.00088 + i * 1.7) * 1.3;
    o.z = zc;
    o.r = baseR * (0.84 + 0.22 * (zc + 1) / 2);
    o.dim = 0.74 + 0.26 * (zc + 1) / 2;

    // the hit area covers the sphere, with the label hung underneath it
    const wpx = (o.r * 2.3 / aspect) * charW;
    const hpx = o.r * 2.1 * charH;
    const el = links[i];
    el.style.left   = (o.x * charW - wpx / 2) + 'px';
    el.style.top    = ((o.y - o.r) * charH) + 'px';
    el.style.paddingTop = (o.r * 0.42 * charH) + 'px';   // clearance for the swell
    el.style.width  = wpx + 'px';
    el.style.height = (hpx + LABEL_PX) + 'px';
    el.style.opacity = (0.66 + 0.34 * (zc + 1) / 2).toFixed(2);
  }
}

function aspectOf() { return charW / charH; }

/* ── paint the grid: one fillText per colour present on each row ── */
const rowBuf = [];
const present = [];
let seen = null;
function paint() {
  if (!seen || seen.length !== BANDS.length) seen = new Uint8Array(BANDS.length);

  ctx.fillStyle = '#050D0B';
  ctx.fillRect(0, 0, W, H);

  for (let row = 0; row < rows; row++) {
    const base = row * cols;

    present.length = 0;
    for (let col = 0; col < cols; col++) {
      if (!chars[base + col]) continue;
      const b = band[base + col];
      if (!seen[b]) { seen[b] = 1; present.push(b); }
    }
    if (!present.length) continue;

    for (let k = 0; k < present.length; k++) {
      const b = present[k];
      seen[b] = 0;                       // reset only what we set
      rowBuf.length = 0;
      for (let col = 0; col < cols; col++) {
        const c = chars[base + col];
        rowBuf.push(c && band[base + col] === b ? GLYPHSET[c] : ' ');
      }
      ctx.fillStyle = BANDS[b];
      ctx.fillText(rowBuf.join(''), 0, row * charH);
    }
  }
}

function frame(t) {
  mAmt += (mTarget - mAmt) * 0.18;             // ease in and out, never snap
  chars.fill(0); band.fill(0);
  placeOrbs(t);
  drawTitle(t);
  // back to front, so the near orbs cover the far ones
  const order = orbs.map((o, i) => i).sort((a, b) => orbs[a].z - orbs[b].z);
  for (const i of order) drawOrb(orbs[i], t, i === hovered);
  paint();
}

layout();
addEventListener('resize', () => { layout(); if (still) frame(4200); }, { passive: true });
if (document.fonts) document.fonts.ready.then(() => { layout(); if (still) frame(4200); });

if (still) {
  frame(4200);
} else {
  let last = 0;
  (function loop(t) {
    requestAnimationFrame(loop);
    if (t - last < 33) return;      // 30fps is plenty for a character grid
    last = t;
    frame(t);
  })(0);
}
</script>

</body>
</html>
