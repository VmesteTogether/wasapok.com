<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pokemeter</title>
<!-- Installable field-companion (Safari -> Share -> Add to Home Screen). Launched
     standalone the app sheds its drawn shell and fills the device edge-to-edge (see
     body.standalone). The UI is DARK, so black-translucent is the right status-bar
     style: the web view runs continuously under the status bar (no separate strip,
     no seam) and iOS' white status glyphs read cleanly on the gunmetal HUD. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pokemeter">
<meta name="theme-color" content="#070a0e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,6 90,28 90,72 50,94 10,72 10,28' fill='none' stroke='%2335e6ff' stroke-width='7'/><circle cx='50' cy='50' r='15' fill='none' stroke='%2335e6ff' stroke-width='7'/></svg>">
</head>
<body>

<div class="phone-wrap" id="phoneWrap">
  <div class="phone" id="phone">

    <!-- ambient HUD layers (behind everything) -->
    <div class="amb grid-bg" aria-hidden="true"></div>
    <div class="amb hexwash" aria-hidden="true"></div>
    <div class="amb scanlines" aria-hidden="true"></div>
    <div class="amb vignette" aria-hidden="true"></div>
    <div class="amb sweep" aria-hidden="true"></div>

    <!-- drawn status bar — browser preview only, hidden in standalone -->
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span class="sb-right">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 12 L11.2 8.8 A4.4 4.4 0 0 0 5.8 8.8 Z"/><path d="M3.6 6.2 A7.4 7.4 0 0 1 13.4 6.2 L15.4 3.9 A10.4 10.4 0 0 0 1.6 3.9 Z" opacity="0.95"/></svg>
        <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" stroke="currentColor" stroke-opacity="0.5"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25.5 4.5 V8.5 A2.2 2.2 0 0 0 25.5 4.5Z" fill="currentColor" fill-opacity="0.5"/></svg>
      </span>
    </div>

    <!-- HUD header -->
    <header class="hud-head">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <h1>POKEMETER</h1>
          <span class="brand-sub">FIELD&nbsp;COMPANION&nbsp;//&nbsp;v0.1</span>
        </div>
      </div>
      <div class="sysreadout" title="Party count">
        <span class="sys-dot" aria-hidden="true"></span>
        <span class="sys-label">PARTY</span>
        <span class="sys-count"><b id="partyCount">0</b>/6</span>
      </div>
    </header>

    <!-- view toggle: flips between TEAM (loadout + readout) and HOME (squad diagnostic).
         Steel/grey at rest; the status light glows amber when there's an actionable gap. -->
    <button class="viewflip" id="viewFlip" type="button" aria-pressed="false">
      <span class="vf-ico" aria-hidden="true"></span>
      <span class="vf-core">
        <span class="vf-label" id="vfLabel">HOME</span>
        <span class="vf-sub" id="vfSub">SQUAD&nbsp;DIAGNOSTIC</span>
      </span>
      <span class="vf-status" id="vfStatus" aria-hidden="true"></span>
      <span class="vf-chev" aria-hidden="true">&rsaquo;</span>
    </button>

    <!-- loadout strip: six capsules (top strip in TEAM view; right rail in HOME view) -->
    <section class="loadout" id="loadout" aria-label="Party loadout — six unit slots"></section>

    <!-- per-unit readout console (TEAM view) -->
    <section class="console" id="console" aria-live="polite"></section>

    <!-- squad diagnostic cockpit (HOME view) -->
    <section class="home" id="home" aria-label="Squad diagnostic"></section>

    <!-- drawn home indicator — browser preview only, hidden in standalone -->
    <div class="home-indicator"></div>

    <!-- tactical search overlay -->
    <div class="search overlay" id="search" aria-hidden="true">
      <div class="search-panel">
        <div class="search-head">
          <button class="search-close" id="searchClose" type="button"><span class="chev">&lsaquo;</span> ABORT</button>
          <div class="search-title">ADD&nbsp;UNIT <b id="searchSlot">SLOT&nbsp;01</b></div>
        </div>
        <div class="search-inputwrap">
          <span class="si-glyph" aria-hidden="true"></span>
          <input id="searchInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="SEARCH DATABASE — ANY GEN">
          <button class="si-clear" id="searchClear" type="button" aria-label="Clear">&times;</button>
        </div>
        <div class="gen-filter" id="genFilter" aria-label="Filter by generation"></div>
        <div class="results" id="results"></div>
        <div class="results-foot" id="resultsFoot"></div>
      </div>
    </div>

  </div>
</div>

<!-- dev-only: fill the viewport at the device aspect (preview the installed app) -->
<button class="fit-toggle" id="fitToggle" type="button" aria-label="Fill the screen" title="Fill the screen">
  <svg class="ic-expand" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6 V2 H6 M16 6 V2 H12 M2 12 V16 H6 M16 12 V16 H12"/></svg>
  <svg class="ic-compress" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6 H6 V2 M16 6 H12 V2 M2 12 H6 V16 M16 12 H12 V16"/></svg>
</button>

<script src="pokemeter.js"></script>
<script>
  // fill-screen (desktop/browser preview): scale the whole device construction to
  // fill the viewport at its 390x844 aspect (min(vw/390, vh/844)), centered.
  // A Home-Screen (standalone) launch does NOT use this — it takes the real-app
  // path (body.standalone: full-bleed 100dvw x 100dvh + env() safe-area insets).
  (() => {
    const AR_W = 390, AR_H = 844, KEY = "pokemeter-fillscreen";
    const wrap = document.getElementById("phoneWrap");
    const btn = document.getElementById("fitToggle");
    const fit = () => {
      if (!document.body.classList.contains("fs")) { wrap.style.transform = ""; return; }
      const vv = window.visualViewport;
      const vw = vv ? vv.width : window.innerWidth;
      const vh = vv ? vv.height : window.innerHeight;
      const s = Math.min(vw / AR_W, vh / AR_H);
      wrap.style.transform = "translate(" + (vw - AR_W) / 2 + "px, " + (vh - AR_H) / 2 + "px) scale(" + s + ")";
    };
    const setFS = (on, { native = false, persist = true } = {}) => {
      document.body.classList.toggle("fs", on);
      btn.setAttribute("aria-label", on ? "Exit full screen" : "Fill the screen");
      fit();
      if (persist) { try { localStorage.setItem(KEY, on ? "1" : "0"); } catch {} }
      if (native) { try { const el = document.documentElement;
        if (on && el.requestFullscreen) el.requestFullscreen().catch(() => {});
        else if (!on && document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
      } catch {} }
    };
    btn.addEventListener("click", () => setFS(!document.body.classList.contains("fs"), { native: true }));
    addEventListener("resize", fit);
    addEventListener("orientationchange", fit);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", fit);
    const standalone = (navigator.standalone === true) ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    if (standalone) { document.body.classList.add("standalone"); }
    else { let saved = "0"; try { saved = localStorage.getItem(KEY) || "0"; } catch {} if (saved === "1") setFS(true, { persist: false }); }
  })();
</script>
</body>
</html>
