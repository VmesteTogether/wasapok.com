<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Garden Grove Virtual Museum</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #001a30; color: #f6efdc; font-family: 'Inter', sans-serif; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,15,30,0.45) 100%);
  }

  .hud { position: fixed; z-index: 10; pointer-events: none; }

  #title {
    top: 18px; left: 50%; transform: translateX(-50%);
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 18px; letter-spacing: 0.35em;
    color: #f0c878;
    padding: 10px 28px;
    background: rgba(0,26,48,0.7);
    border-top: 1px solid #d4a64c;
    border-bottom: 1px solid #d4a64c;
    text-transform: uppercase;
  }
  #title small { display: block; font-family: 'Inter', sans-serif; font-size: 10px; letter-spacing: 0.4em; color: #f6efdc; opacity: 0.75; margin-top: 4px; font-weight: 500; }

  #help {
    bottom: 18px; left: 20px;
    font-family: 'Inter', sans-serif; font-size: 13px; line-height: 1.7;
    color: #f6efdc; opacity: 0.85;
    background: rgba(0,26,48,0.65); padding: 10px 14px;
    border: 1px solid rgba(212,166,76,0.35);
    border-radius: 4px;
  }
  #help kbd {
    display: inline-block; min-width: 22px; text-align: center;
    padding: 1px 7px; margin: 0 1px;
    border: 1px solid #d4a64c; border-radius: 3px;
    background: rgba(0,40,80,0.7); color: #f0c878;
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
  }

  #minimap-wrap {
    position: fixed; top: 18px; right: 18px; z-index: 10;
    padding: 12px 12px 10px;
    background: rgba(0,26,48,0.85);
    border: 1px solid #d4a64c;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  #minimap-wrap::before {
    content: 'GALLERY MAP'; position: absolute; top: -10px; left: 12px;
    background: rgba(0,26,48,1); padding: 0 8px;
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 10px; letter-spacing: 0.3em; color: #d4a64c;
  }
  #minimap { image-rendering: pixelated; display: block; }

  /* Plaque inspect view */
  #plaque-view {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(0,15,30,0.92);
    align-items: center; justify-content: center; flex-direction: column; gap: 22px;
    padding: 40px;
  }
  #plaque-view.open { display: flex; }
  #plaque-view .frame {
    max-width: 70vw; max-height: 60vh;
    padding: 16px;
    background: linear-gradient(135deg, #d4a64c 0%, #f0c878 50%, #8a6020 100%);
    border: 2px solid #001a30;
    box-shadow: 0 24px 60px rgba(0,0,0,0.8), inset 0 0 16px rgba(0,0,0,0.4);
  }
  #plaque-view img {
    display: block; max-width: 66vw; max-height: 56vh;
    background: #001a30;
    border: 1px solid #001a30;
  }
  #plaque-view .plaque {
    background: linear-gradient(180deg, #f0c878, #d4a64c, #8a6020);
    color: #001a30;
    padding: 14px 32px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    border: 1px solid #001a30;
  }
  #plaque-view .plaque h2 {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 26px; letter-spacing: 0.04em;
  }
  #plaque-view .plaque .sub {
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
    letter-spacing: 0.16em; text-transform: uppercase;
    margin-top: 4px; opacity: 0.85;
  }
  #plaque-view .bio {
    max-width: 540px; text-align: center;
    font-family: 'Inter', sans-serif; font-size: 14px; line-height: 1.6;
    color: #f6efdc; opacity: 0.85;
  }
  #plaque-view .hint { font-size: 12px; letter-spacing: 0.25em; color: #d4a64c; opacity: 0.8; }

  /* ===== Souls-style "AREA DISCOVERED" overlay ===== */
  #discover {
    position: fixed; left: 50%; top: 38%;
    transform: translate(-50%, -50%);
    z-index: 30; pointer-events: none;
    text-align: center;
    opacity: 0;
  }
  #discover.show { animation: discover-fade 4200ms ease-out forwards; }
  @keyframes discover-fade {
    0%   { opacity: 0; letter-spacing: 0.55em; }
    12%  { opacity: 1; letter-spacing: 0.45em; }
    78%  { opacity: 1; letter-spacing: 0.46em; }
    100% { opacity: 0; letter-spacing: 0.5em; }
  }
  #discover .rule {
    height: 1px; width: 360px; margin: 0 auto;
    background: linear-gradient(90deg, transparent, #d4a64c, transparent);
  }
  #discover .pre {
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500;
    letter-spacing: 0.5em; color: #d4a64c; opacity: 0.85;
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  #discover .name {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 44px; letter-spacing: 0.18em;
    color: #f6efdc;
    text-shadow: 0 2px 12px rgba(0,0,0,0.85), 0 0 30px rgba(212,166,76,0.25);
    margin: 14px 0;
  }
  #discover .sub {
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
    letter-spacing: 0.32em; color: #f0c878; opacity: 0.9;
    text-transform: uppercase;
    margin-top: 14px;
  }

  /* ===== Look controls (Map Hall only) ===== */
  #look-controls {
    position: fixed; bottom: 18px; right: 18px; z-index: 11;
    background: rgba(0,26,48,0.85);
    border: 1px solid #d4a64c;
    padding: 12px 14px 10px;
    font-family: 'Inter', sans-serif; font-size: 12px;
    color: #f6efdc;
    opacity: 0; transform: translateY(8px);
    transition: opacity 360ms ease-out, transform 360ms ease-out;
    pointer-events: none;
  }
  #look-controls.show { opacity: 1; transform: translateY(0); }
  #look-controls::before {
    content: 'CARTOGRAPHY VIEW';
    position: absolute; top: -10px; left: 12px;
    background: rgba(0,26,48,1); padding: 0 8px;
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 10px; letter-spacing: 0.3em; color: #d4a64c;
  }
  #look-controls .row { line-height: 1.7; }
  #look-controls kbd {
    display: inline-block; min-width: 22px; text-align: center;
    padding: 1px 7px; margin: 0 1px;
    border: 1px solid #d4a64c; border-radius: 3px;
    background: rgba(0,40,80,0.7); color: #f0c878;
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
  }

  /* Speed lines (sprint kinetic FX) */
  #speedlines {
    position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.55) 100%),
                repeating-radial-gradient(circle at center, rgba(255,255,255,0) 0 6px, rgba(255,255,255,0.06) 6px 7px);
    transition: opacity 80ms linear;
  }

  /* Tweaks panel */
  #tweaks {
    position: fixed; right: 18px; top: 50%; transform: translate(120%, -50%);
    z-index: 40; width: 280px;
    background: rgba(0,26,48,0.95);
    border: 1px solid #d4a64c;
    padding: 18px 18px 14px;
    color: #f6efdc; font-family: 'Inter', sans-serif; font-size: 13px;
    transition: transform 360ms ease-out;
    box-shadow: 0 18px 60px rgba(0,0,0,0.6);
  }
  #tweaks.open { transform: translate(0, -50%); }
  #tweaks h3 {
    font-family: 'Playfair Display', serif; font-weight: 700;
    font-size: 13px; letter-spacing: 0.3em; color: #d4a64c;
    text-transform: uppercase; margin-bottom: 14px; padding-bottom: 8px;
    border-bottom: 1px solid rgba(212,166,76,0.4);
  }
  #tweaks .row { margin: 10px 0; }
  #tweaks label { display: block; font-size: 11px; letter-spacing: 0.18em; color: #f0c878; margin-bottom: 4px; text-transform: uppercase; }
  #tweaks select, #tweaks input[type=range] { width: 100%; background: rgba(0,40,80,0.6); border: 1px solid #d4a64c; color: #f6efdc; padding: 6px 8px; font-family: inherit; font-size: 13px; }
  #tweaks .toggle { display: flex; align-items: center; gap: 8px; }
  #tweaks .toggle input { accent-color: #d4a64c; }
  #tweaks .val { font-family: 'Playfair Display', serif; color: #f0c878; font-weight: 600; }
  #tweaks-close { position: absolute; top: 8px; right: 12px; cursor: pointer; color: #d4a64c; font-size: 18px; pointer-events: auto; }

  #loading {
    position: fixed; inset: 0; z-index: 50; background: #001a30;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 20px; color: #d4a64c;
    font-family: 'Playfair Display', serif; letter-spacing: 0.3em;
  }
  #loading .seal {
    width: 64px; height: 64px; border: 3px solid #d4a64c; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 28px; color: #f0c878;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 rgba(212,166,76,0.4); }
    50%     { box-shadow: 0 0 0 14px rgba(212,166,76,0); }
  }
</style>
</head>
<template id="__bundler_thumbnail" data-bg-color="#003a67">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#003a67"/>
    <text x="600" y="470" font-family="serif" font-weight="900" font-size="380" text-anchor="middle" fill="#d4a64c">GG</text>
    <text x="600" y="620" font-family="serif" font-size="48" letter-spacing="14" text-anchor="middle" fill="#f0c878">VIRTUAL MUSEUM</text>
  </svg>
</template>
<body>
  <div id="game"></div>
  <div id="vignette"></div>

  <div id="title" class="hud">
    Garden Grove Virtual Museum
    <small>Civic Halls · Established 1956</small>
  </div>

  <div id="help" class="hud">
    <div><kbd>W</kbd><kbd>S</kbd> walk &nbsp; <kbd>A</kbd><kbd>D</kbd> turn &nbsp; <kbd>Q</kbd><kbd>E</kbd> strafe &nbsp; <kbd>SHIFT</kbd> sprint &nbsp; <kbd>W</kbd><kbd>W</kbd> dash</div>
    <div><kbd>SPACE</kbd> inspect plaque &nbsp; <kbd>ESC</kbd> close</div>
  </div>

  <div id="minimap-wrap"><canvas id="minimap" width="200" height="180"></canvas></div>

  <div id="discover">
    <div class="rule"></div>
    <div class="pre">Area Discovered</div>
    <div class="name" id="discover-name">—</div>
    <div class="sub" id="discover-sub"></div>
    <div class="rule"></div>
  </div>

  <div id="look-controls">
    <div class="row"><kbd>R</kbd> look up &nbsp; <kbd>F</kbd> look down</div>
  </div>

  <div id="speedlines"></div>

  <div id="tweaks">
    <span id="tweaks-close">×</span>
    <h3>Tweaks</h3>
    <div class="row">
      <label>Aesthetic Preset</label>
      <select id="tw-aesthetic">
        <option value="civic">Civic Classical</option>
        <option value="ps1">PS1 Dungeon</option>
        <option value="atrium">Sunlit Atrium</option>
        <option value="velvet">Velvet Cathedral</option>
      </select>
    </div>
    <div class="row">
      <label>Pixelation <span class="val" id="tw-pixel-val">3</span></label>
      <input id="tw-pixel" type="range" min="1" max="6" step="1" value="3">
    </div>
    <div class="row">
      <label>Fog Distance <span class="val" id="tw-fog-val">32</span>m</label>
      <input id="tw-fog" type="range" min="12" max="60" step="2" value="32">
    </div>
    <div class="row toggle"><input id="tw-bob" type="checkbox" checked><label for="tw-bob" style="margin:0;">Headbob while walking</label></div>
    <div class="row toggle"><input id="tw-fov" type="checkbox" checked><label for="tw-fov" style="margin:0;">FOV widens with sprint</label></div>
  </div>

  <div id="plaque-view">
    <div class="frame"><img id="plaque-img" src="" alt=""></div>
    <div class="plaque">
      <h2 id="plaque-title">—</h2>
      <div class="sub" id="plaque-subtitle"></div>
    </div>
    <div class="bio" id="plaque-bio"></div>
    <div class="hint">Press SPACE or ESC to return</div>
  </div>

  <div id="loading"><div class="seal">GG</div><div>OPENING THE GALLERY…</div></div>

<!-- Featured large artwork: Map Hall -->
<script id="map-manifest" type="application/json">
{
  "src": "artworks/garden-grove-map.png",
  "title": "City of Garden Grove",
  "subtitle": "Map of the Civic Boundaries"
}
</script>

  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"

</body>
</html>
